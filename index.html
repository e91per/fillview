<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2E9D5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fillview">
<meta name="description" content="Fillview: free crypto charts with your own trades and journal built in.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>Fillview</title>
<style>
:root{
  --bg:#F2E9D5;--card:#F8F1E1;--ink:#2B2418;--acc:#7A5A2B;--acc-ink:#FBF4E3;--win:#2D6A3E;--loss:#A32D2A;--fs:15px;
  --font:"Pretendard Variable",Pretendard,"SF Pro Text","Roboto","SamsungOneUI","Noto Sans KR",system-ui,sans-serif;
  --mute:color-mix(in srgb,var(--ink) 56%,var(--bg));
  --line:color-mix(in srgb,var(--ink) 13%,var(--bg));
  --soft:color-mix(in srgb,var(--ink) 6%,var(--card));
  --railw:56px;--panelw:340px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.45}
body{display:flex;flex-direction:column;height:100svh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.win{color:var(--win)}.loss{color:var(--loss)}.mute{color:var(--mute)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 상단 */
header.tb{display:flex;align-items:center;gap:14px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:6}
.logo{font-size:1.15rem;font-weight:600;letter-spacing:-.03em;color:var(--ink);flex:none}
.logo i{font-style:normal;color:var(--loss)}
.symbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.38rem .7rem;flex:none;max-width:52vw}
.symbtn b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.symbtn span{font-size:.76rem;color:var(--mute);white-space:nowrap}
.exb{font-size:.66rem;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 .35rem;color:var(--mute)}
.mkt{display:flex;align-items:center;gap:18px;flex:1;min-width:0}
.price{flex:none;min-width:7rem}
.price b{display:block;font-size:1.32rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.price small{font-size:.76rem}
.stats{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.stats::-webkit-scrollbar{display:none}
.st{flex:none}
.st span{display:block;font-size:.7rem;color:var(--mute);white-space:nowrap}
.st b{display:block;font-size:.86rem;font-weight:600;white-space:nowrap}
.rng{display:flex;align-items:center;gap:6px;font-size:.76rem}
.rng .bar{position:relative;width:80px;height:2px;background:var(--line)}
.rng .bar i{position:absolute;top:-4px;width:2px;height:10px;background:var(--ink)}
.hright{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.disc{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.28rem .6rem;text-align:left;display:flex;gap:12px}
.disc div span{display:block;font-size:.66rem;color:var(--mute);white-space:nowrap}
.disc div b{font-size:.84rem;white-space:nowrap}
.disc .lim{height:3px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}
.disc .lim i{display:block;height:100%;background:var(--loss)}
.ib{border:1px solid transparent;background:none;border-radius:9px;padding:.35rem .5rem;color:var(--mute);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.82rem}
.ib:hover{border-color:var(--line);color:var(--ink)}

/* 봉 바 */
.tfbar{display:flex;align-items:center;gap:2px;padding:5px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.tfbar::-webkit-scrollbar{display:none}
.tfbar>button{border:0;background:none;border-radius:8px;padding:.32rem .6rem;font-weight:600;font-size:.85rem;color:var(--mute);flex:none;display:inline-flex;align-items:center;gap:6px}
.tfbar>button.on{background:var(--soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
.tfbar .sep{width:1px;height:18px;background:var(--line);margin:0 6px;flex:none}
.tfbar select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:.25rem .45rem;font-size:.82rem;flex:none;width:auto!important}
.tfbar .grow{flex:1}
.live{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--mute);flex:none;padding-right:2px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.live.ok i{background:var(--win)}.live.slow i{background:var(--acc)}.live.bad i{background:var(--loss)}

/* 본문 */
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto var(--railw);min-height:0}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.chartbox{position:relative;flex:1;min-height:300px}
#chart{position:absolute;inset:0}
.legend{position:absolute;left:12px;top:8px;z-index:2;font-size:.8rem;color:var(--mute);pointer-events:none}
.legend b{color:var(--ink);font-weight:600}
.msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:2rem;color:var(--mute);z-index:3}
.msg.on{display:grid}
.histbar{position:absolute;left:50%;transform:translateX(-50%);bottom:40px;z-index:3;display:none}
.histbar.on{display:block}
.pill{border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:.45rem 1rem;font-weight:600;font-size:.85rem}
.tpop{position:absolute;right:12px;top:10px;z-index:4;width:min(300px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:none;box-shadow:0 6px 24px color-mix(in srgb,var(--ink) 14%,transparent)}
.tpop.on{display:block}
.tpop h4{margin:0 0 4px;font-size:.95rem;display:flex;justify-content:space-between;gap:8px}
.tpop .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.8rem;margin:6px 0 10px}
.tpop .kv span{color:var(--mute)}
.tpop .kv b{text-align:right;font-weight:600}

/* Fillog 화면 */
.center{position:relative}
.logview{position:absolute;inset:0;display:none;background:var(--bg);z-index:6}
.logview iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
body.vlog .logview{display:block}
body.vlog .tfbar{display:none}

/* 계산기 */
.cbox{margin:8px 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.cbox h5{margin:0 0 6px;font-size:.88rem}
.cl{display:block;font-size:.76rem;font-weight:600;color:var(--mute);margin:10px 0 4px}
.cf{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.cf:focus-within{border-color:var(--acc)}
.cf input{border:0!important;background:transparent!important;flex:1;min-width:0;padding:.55rem .65rem!important;border-radius:0!important}
.cf input.solved{color:var(--acc);font-weight:700}
.cf .cu{padding:0 .65rem;font-size:.78rem;color:var(--mute);flex:none}
.cf .cb{border:0;background:none;color:var(--acc);font-weight:700;font-size:.76rem;padding:0 .5rem;flex:none}
.cf select.cu2,select.cu2{border:0!important;border-left:1px solid var(--line)!important;border-radius:0!important;background:transparent!important;width:auto!important;font-size:.78rem;padding:.4rem .5rem!important}
select.cu2{border:1px solid var(--line)!important;border-radius:8px!important}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border-radius:10px;background:var(--soft)}
.seg2 button{border:0;background:transparent;border-radius:8px;padding:.5rem;font-weight:700;color:var(--mute)}
.seg2 button.on.win{background:var(--win);color:#fff}
.seg2 button.on.loss{background:var(--loss);color:#fff}
.crow{display:flex;align-items:center;gap:8px;font-size:.82rem;margin:10px 0 0;flex-wrap:wrap}
.crow .mute{font-size:.74rem}
.cres .big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px}
.cres .big small{font-size:.78rem;font-weight:600;color:var(--mute)}
.arow{display:grid;grid-template-columns:1.2rem 1fr 1fr auto;gap:6px;align-items:center;margin-top:6px}
.arow input{padding:.45rem .55rem!important}

/* 오른쪽 패널 + 아이콘 줄 */
.spanel{width:0;overflow:hidden;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
.spanel.on{width:var(--panelw)}
.spanel>header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.spanel>header h3{margin:0;font-size:.95rem;flex:1}
.sbody{flex:1;overflow-y:auto;min-height:0;padding-bottom:16px}
nav.rail{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;background:var(--bg)}
nav.rail button{border:0;background:none;width:48px;padding:.5rem 0;border-radius:10px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:600}
nav.rail button.on{background:var(--soft);color:var(--ink)}
nav.rail .gap{flex:1}

/* 공통 목록 */
.row{display:flex;align-items:center;gap:10px;padding:.5rem 12px;border:0;background:none;width:100%;text-align:left}
button.row:hover{background:var(--soft)}
.row .l{flex:1;min-width:0}
.row .l b{display:block;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l span{display:block;font-size:.74rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:.86rem;flex:none}
.row .r span{display:block;font-size:.74rem}
.row.cur{background:var(--soft);box-shadow:inset 2px 0 0 var(--acc)}
.grp{display:flex;align-items:center;gap:6px;padding:.55rem 12px .35rem;font-size:.76rem;font-weight:700;color:var(--mute);border:0;background:none;width:100%;text-align:left}
.grp i{font-style:normal;font-weight:500}
.star{border:0;background:none;color:var(--mute);padding:.15rem .3rem;font-size:1rem;flex:none}
.star.on{color:var(--acc)}
.box{margin:8px 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.box p{margin:0 0 8px;font-size:.84rem;color:var(--mute)}
.box h5{margin:0 0 6px;font-size:.88rem}
.kv2{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:.84rem}
.kv2 span{color:var(--mute)}
.kv2 b{text-align:right;font-weight:600}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:.5rem .85rem;font-weight:600;font-size:.85rem}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:.3rem .6rem;font-size:.78rem}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap}
input[type=checkbox]{width:auto;margin:0;accent-color:var(--acc)}
input:not([type=checkbox]):not([type=color]):not([type=range]),select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem;background:var(--card);outline:none}
input[type=color]{width:2.6rem;height:2rem;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:2px}
input[type=range]{width:100%;accent-color:var(--acc)}
input:focus,select:focus{border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:.25rem .7rem;font-size:.78rem;font-weight:600;color:var(--mute)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.empty{padding:1.2rem 12px;color:var(--mute);font-size:.85rem}
.soon{margin:12px;padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);font-size:.86rem}
.soon b{display:block;color:var(--ink);margin-bottom:4px}
.soon ul{margin:.4rem 0 0;padding-left:1.1rem}
.h{font-size:.74rem;color:var(--mute);padding:.7rem 12px .2rem;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.tbl td,.tbl th{padding:.32rem 12px;text-align:right;white-space:nowrap}
.tbl th{color:var(--mute);font-weight:600;font-size:.72rem}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--soft)}
.ob{font-size:.76rem}
.ob .lv{display:grid;grid-template-columns:5.6rem 1fr 4.6rem;align-items:center;gap:6px;padding:1px 12px}
.ob .lv .bars{display:flex;height:12px;border-radius:2px;overflow:hidden}
.ob .lv .bars i{display:block;height:100%}
.ob .mid{padding:6px 12px;font-weight:700;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:3px 0;display:flex;justify-content:space-between}
.legend2{display:flex;gap:10px;flex-wrap:wrap;padding:4px 12px 8px;font-size:.72rem;color:var(--mute)}
.legend2 i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* 하단 띠 */
footer.tick{display:flex;align-items:center;gap:18px;padding:5px 12px calc(5px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:.78rem;overflow-x:auto;scrollbar-width:none;white-space:nowrap;background:var(--bg)}
footer.tick::-webkit-scrollbar{display:none}
footer.tick button{border:0;background:none;padding:0;font-size:.78rem}
footer.tick .clk{margin-left:auto;color:var(--mute)}
footer.tick a{color:var(--mute)}

/* 창 */
.dim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);z-index:30;display:none;align-items:flex-start;justify-content:center;padding:calc(30px + env(safe-area-inset-top)) 12px 12px}
.dim.on{display:flex}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;max-height:86svh;display:flex;flex-direction:column;overflow:hidden}
.sheet>header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet>header h3{margin:0;font-size:1rem;flex:1}
.sheet .sb{overflow-y:auto;padding:4px 0 14px}
.set h4{margin:0;padding:14px 14px 4px;font-size:.84rem}
.set .it{padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.set .it>label{flex:1;min-width:9rem;font-size:.86rem}
.set .it>label small{display:block;color:var(--mute);font-size:.74rem}
.set .it .ctl{flex:none;max-width:100%}
.set .it .ctl.w{flex:1 1 100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:.35rem .65rem;font-weight:600;font-size:.8rem;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.sw{position:relative;display:inline-block;vertical-align:middle;width:42px;height:24px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:color-mix(in srgb,var(--ink) 22%,var(--bg));pointer-events:none;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--card);transition:transform .15s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{transform:translateX(18px)}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:12px;font-size:.86rem;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}

@media (max-width:899px){
  header.tb{flex-wrap:wrap;gap:8px 10px}
  .mkt{order:5;flex-basis:100%;gap:14px}
  header.tb{gap:8px 8px;flex-wrap:wrap}
  .hright{order:3;gap:2px}
  #symQ,#symEx{display:none}
  .logo{font-size:1rem}
  .symbtn{padding:.32rem .55rem;gap:6px}
  .disc{gap:8px;padding:.2rem .45rem}
  .disc div span{font-size:.62rem}
  .disc div b{font-size:.76rem}
  #setBtn{padding:.3rem}
  .body{display:flex;flex-direction:column;padding-bottom:calc(58px + env(safe-area-inset-bottom))}
  .center{border-right:0;flex:1;min-height:0}
  .chartbox{flex:1;min-height:0}
  body.vlog .mkt{display:none}
  nav.rail{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:row;justify-content:space-between;padding:4px 2px calc(4px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
  nav.rail .gap{display:none}
  nav.rail button{flex:1 1 0;min-width:0;width:auto;font-size:.58rem;padding:.45rem 0;white-space:nowrap;overflow:hidden}
  nav.rail button svg.i{width:19px;height:19px}
  .spanel{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom));height:70svh;width:auto!important;z-index:19;border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;display:none;box-shadow:0 -8px 30px color-mix(in srgb,var(--ink) 18%,transparent)}
  .spanel.on{display:flex}
  footer.tick{display:none}
}
@media (max-width:899px){.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){.toast,.sw i,.sw i::after{transition:none}}
</style>
</head>
<body>
<header class="tb">
  <span class="logo">Fillview<i>_</i></span>
  <button class="symbtn" id="symBtn" aria-haspopup="dialog"><b id="symName">BTC</b><span id="symQ"></span><span class="exb" id="symEx"></span><span aria-hidden="true">▾</span></button>
  <div class="mkt">
    <div class="price"><b class="num" id="px">–</b><small class="num" id="chg"></small></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="hright"><button class="disc" id="disc" hidden></button><button class="ib" id="setBtn" aria-label="settings"></button></div>
</header>
<div class="tfbar" id="tfbar"></div>
<div class="body">
  <div class="center">
    <section class="chartbox" id="chartbox">
      <div class="legend" id="legend"></div>
      <div id="chart"></div>
      <div class="msg" id="msg"></div>
      <div class="tpop" id="tpop"></div>
      <div class="histbar" id="histbar"><button class="pill" id="liveBtn"></button></div>
    </section>
    <div class="logview" id="logview"><iframe id="fl" title="Fillog"></iframe></div>
  </div>
  <aside class="spanel" id="spanel"><header><h3 id="spTitle"></h3><button class="ib" id="spClose"></button></header><div class="sbody" id="sbody"></div></aside>
  <nav class="rail" id="rail"></nav>
</div>
<footer class="tick" id="tick"></footer>
<div class="dim" id="dim"><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<script>
'use strict';
/* =========================================================
   Fillview v2 — 서버 없이 동작하는 차트 + Fillog 일지 통합
   ========================================================= */

/* ---------- 순수 계산 (테스트 가능) ---------- */
const Core=(()=>{
  const pad=n=>String(n).padStart(2,'0');
  const QUOTE=/(USDT|USDC|BUSD|FDUSD|USD)$/;
  const baseOf=s=>{let x=String(s||'').toUpperCase();if(x.includes(':'))x=x.split(':').pop();
    x=x.replace(/\.P$/,'').replace(/PERP(ETUAL)?/g,'').replace(/[\s/_-]/g,'');const y=x.replace(QUOTE,'');return y||x};
  const coreBase=b=>String(b||'').toUpperCase().replace(/^(1000000|1000|1M|K)(?=[A-Z])/,'');
  const TF={'1m':6e4,'5m':3e5,'15m':9e5,'1h':36e5,'4h':144e5,'1d':864e5,'1w':6048e5};
  const barFloor=(ms,tf)=>{const d=TF[tf];if(tf==='1w'){const o=4*864e5;return Math.floor((ms-o)/d)*d+o}return Math.floor(ms/d)*d};
  const pickTf=h=>h<2*36e5?'5m':h<12*36e5?'15m':h<2*864e5?'1h':h<10*864e5?'4h':'1d';

function mkWS(url,onopen,onmsg){let ws=null,gen=0,tries=0,last=0;const st={ok:false};
  function open(){const g=++gen;try{ws&&ws.close()}catch(e){}
    let u;try{u=url();if(!u){st.ok=false;return}ws=new WebSocket(u)}catch(e){st.ok=false;return}
    ws.onopen=()=>{if(g!==gen)return;tries=0;last=Date.now();st.ok=true;onopen&&onopen();updLive()};
    ws.onmessage=e=>{if(g!==gen)return;last=Date.now();let m;try{m=JSON.parse(e.data)}catch(_){return}onmsg(m)};
    ws.onclose=()=>{if(g!==gen)return;st.ok=false;updLive();tries++;setTimeout(()=>{if(g===gen)open()},Math.min(30000,1500*tries))};
    ws.onerror=()=>{}}
  return{open,close(){gen++;try{ws&&ws.close()}catch(e){}st.ok=false},send(o){try{ws&&ws.readyState===1&&ws.send(JSON.stringify(o))}catch(e){}},st,age:()=>Date.now()-last}}

function applyChartOpts(){if(!chart)return;const p=pal(),s=S_(),mute=mix(p.ink,p.bg,.56),line=mix(p.ink,p.bg,.09);

function setCandles(k){const z=tzSec(),p=pal();idxMap=new Map();k.forEach((x,i)=>idxMap.set(x.t,i));
  candle.setData(k.map(x=>({time:x.t/1000+z,open:x.o,high:x.h,low:x.l,close:x.c})));

function liveCandle(x){if(M.hist||!candle||!lastK.length)return;const z=tzSec(),p=pal(),L0=lastK[lastK.length-1];
  if(x.t<L0.t)return;if(L0.t===x.t)lastK[lastK.length-1]=x;else{lastK.push(x);idxMap.set(x.t,lastK.length-1);M.last=x.t}

/* 시각 → 화면 좌표 */
function xOf(ms){if(!chart||!lastK.length)return null;const d=TF[CFG.tf],bt=barFloor(ms,CFG.tf);
  let i=idxMap.get(bt);if(i==null)i=(bt-M.first)/d;return chart.timeScale().logicalToCoordinate(i)}
const yOf=p=>p==null||!candle?null:candle.priceToCoordinate(p);

/* 차트 위 그림: 경제 일정선, 매매 상자, 체결 기호 */
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawOverlay(ctx,size){
  const p=pal(),s=S_(),W=size.width,H=size.height,font=getComputedStyle(document.body).fontFamily;HITS=[];
  /* 경제 일정 */
  if(s.evShow){const evs=visibleEvents().filter(e=>e.ms>=M.first-TF[CFG.tf]*2);let rows=[];
    ctx.font='600 11px '+font;
    evs.forEach(e=>{const x=xOf(e.ms);if(x==null||x<0||x>W)return;
      ctx.save();ctx.strokeStyle=hexA(p.acc,'99');ctx.setLineDash([3,4]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,H);ctx.stroke();ctx.restore();
      if(!s.evLabel)return;const txt=evShort(e)+' '+fmtHM(e.ms),tw=ctx.measureText(txt).width+14;
      let r=0;while(rows[r]!=null&&rows[r]>x-tw/2-4)r++;rows[r]=x+tw/2;const y=H-24-r*24;
      rrect(ctx,x-tw/2,y,tw,19,6);ctx.fillStyle=p.card;ctx.fill();ctx.strokeStyle=hexA(p.acc,'cc');ctx.setLineDash([]);ctx.stroke();
      ctx.fillStyle=p.ink;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y+10)})}
  if(s.marks==='off')return;
  const base=curBase(),shapes=Core.tradeShapes((J&&J.trades)||[],base),showBox=s.marks!=='sym',showSym=s.marks!=='box';
  shapes.forEach(t=>{const x1=xOf(t.o),x2=xOf(t.c);if(x1==null||x2==null)return;if(x2<-20||x1>W+20)return;
    const ya=yOf(t.pe),yb=yOf(t.px!=null?t.px:t.pe),sel=SEL===t.id,col=t.pnl>=0?p.win:p.loss;
    if(showBox&&ya!=null&&yb!=null){const L0=Math.min(x1,x2)-3,R=Math.max(x1,x2)+3,T=Math.min(ya,yb),B=Math.max(ya,yb),h=Math.max(4,B-T);
      ctx.fillStyle=hexA(col,sel?'38':'1c');ctx.fillRect(L0,T,R-L0,h);ctx.strokeStyle=hexA(col,sel?'ff':'88');ctx.lineWidth=sel?1.6:1;ctx.setLineDash([]);ctx.strokeRect(L0+.5,T+.5,R-L0-1,h-1);
      if(s.pnlLabel){ctx.font='700 10.5px '+font;ctx.fillStyle=col;ctx.textAlign='left';ctx.textBaseline='bottom';
        ctx.fillText((t.pnl>=0?'+':'')+t.pnl.toFixed(t.pnl>=1000||t.pnl<=-1000?0:2),R+3,T-1)}
      HITS.push({id:t.id,x1:L0-4,x2:R+4,y1:T-6,y2:T+h+6})}
    else HITS.push({id:t.id,x1:Math.min(x1,x2)-6,x2:Math.max(x1,x2)+6,y1:0,y2:H});
    if(showSym)t.steps.forEach(st=>{const x=xOf(st.t),y=yOf(st.p);if(x==null||y==null)return;
      const c=st.k==='close'?col:st.dir>0?p.win:p.loss;drawSym(ctx,st.k,st.dir,x,y,c,p.card,sel)})});
  /* 아직 일지로 안 보낸 하이퍼리퀴드 체결 */
  if(s.hlMarks&&showSym){const sent=new Set(HL.sent);HL.fills.forEach(f=>{if(sent.has(String(f.tid))||coreBase(f.coin)!==base)return;
    const x=xOf(f.time),y=yOf(+f.px);if(x==null||y==null||x<0||x>W)return;const dir=f.side==='B'?1:-1,k=/^open/i.test(f.dir)?'open':/^close/i.test(f.dir)?'reduce':'add';
    drawSym(ctx,k,dir,x,y,dir>0?p.win:p.loss,p.card,false,true)})}}
function drawSym(ctx,k,dir,x,y,col,bg,sel,ghost){const r=sel?5.5:4.5;ctx.save();ctx.globalAlpha=ghost?.55:1;ctx.lineWidth=1.4;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.beginPath();
  if(k==='open'){if(dir>0){ctx.moveTo(x,y-r-1);ctx.lineTo(x+r+1,y+r);ctx.lineTo(x-r-1,y+r)}else{ctx.moveTo(x,y+r+1);ctx.lineTo(x+r+1,y-r);ctx.lineTo(x-r-1,y-r)}ctx.closePath();ctx.fill();ctx.strokeStyle=bg;ctx.lineWidth=1;ctx.stroke()}
  else if(k==='add'){ctx.arc(x,y,r-1,0,Math.PI*2);ctx.fill();ctx.strokeStyle=bg;ctx.lineWidth=1;ctx.stroke()}

  else{ctx.rect(x-r,y-r,r*2,r*2);ctx.fill();ctx.strokeStyle=bg;ctx.lineWidth=1;ctx.stroke()}
  ctx.restore()}

const OBC={BN:'#D4A62A',BY:'#E07B39',OK:'#8A8F98',HL:'#3FB8A8'},OBN={BN:'Binance',BY:'Bybit',OK:'OKX',HL:'Hyperliquid'},OKCT={};

async function fetchBooks(){if(bookBusy)return;bookBusy=true;const b=curBase(),ex=S_().obEx,out={},st={},ref=(tick(CFG.sym)||{}).c,rg=+S_().obRange;
  const bk=bnKeyFor(b),bsym=bk?parseKey(bk).id:b+'USDT',jobs=[];
  const conv=a=>(a||[]).map(x=>[+x[0],+x[1]]);
  if(ex.BN&&bk)jobs.push(getJ(BN+'/fapi/v1/depth?symbol='+bsym+'&limit=500').then(r=>{out.BN={bids:conv(r.bids),asks:conv(r.asks)}}).catch(()=>{st.BN=1}));
  if(ex.BY)jobs.push(getJ('https://api.bybit.com/v5/market/orderbook?category=linear&symbol='+bsym+'&limit=200').then(r=>{if(!r.result||!r.result.b)throw 0;out.BY={bids:conv(r.result.b),asks:conv(r.result.a)}}).catch(()=>{st.BY=1}));
  if(ex.OK){const inst=b+'-USDT-SWAP';jobs.push((async()=>{if(OKCT[inst]==null){const r=await getJ('https://www.okx.com/api/v5/public/instruments?instType=SWAP&instId='+inst);OKCT[inst]=+r.data[0].ctVal}
    const r=await getJ('https://www.okx.com/api/v5/market/books?instId='+inst+'&sz=400'),d=r.data[0],k=OKCT[inst];
    out.OK={bids:d.bids.map(x=>[+x[0],+x[1]*k]),asks:d.asks.map(x=>[+x[0],+x[1]*k])}})().catch(()=>{st.OK=1}))}
  const hc=cur().ex==='HL'?cur().id:(hlKeyFor(b)||'').slice(3);
  if(ex.HL&&hc&&ref){const nsig=Math.max(2,Math.min(5,Math.floor(Math.log10(ref))+1-Math.floor(Math.log10(ref*rg/100/15))));
    jobs.push(hlPost({type:'l2Book',coin:hc,nSigFigs:nsig}).then(r=>{const [bd,as]=r.levels;out.HL={bids:bd.map(x=>[+x.px,+x.sz]),asks:as.map(x=>[+x.px,+x.sz])}}).catch(()=>{st.HL=1}))}
  await Promise.all(jobs);
  /* 가격 단위가 다른 거래소(예: 1000PEPE vs PEPE)는 빼요 */
  const mids={};Object.entries(out).forEach(([k,v])=>{if(v.bids[0]&&v.asks[0])mids[k]=(v.bids[0][0]+v.asks[0][0])/2});
  const ms=Object.values(mids).sort((a,b)=>a-b),med=ms.length?ms[Math.floor(ms.length/2)]:ref;
  Object.keys(out).forEach(k=>{if(!mids[k]||Math.abs(mids[k]/med-1)>.02){delete out[k];st[k]=2}});
  M.book={out,st,mid:med};M.bookSt=st;bookBusy=false;if(CFG.panel&&CFG.rail==='book')renderBook()}
function renderBook(){const P=$('#sbody'),s=S_(),bk=M.book;

    <div class="chips" style="padding-top:0">${Object.keys(OBN).map(k=>`<button class="chip ${s.obEx[k]?'on':''}" data-obex="${k}">${OBN[k]}${bk&&bk.st[k]===1?' ✕':bk&&bk.st[k]===2?' ≠':''}</button>`).join('')}</div>`;

/* PNL: 네 칸 중 비어 있는 한 칸을 계산 (순수 함수, 테스트 가능) */
function solvePnl(o){const dir=o.side==='short'?-1:1,f=o.fee?o.feeRate/100:0,lev=o.lev>0?o.lev:NaN;
  const ks=['entry','close','qty','pnl'],empty=ks.filter(k=>!(isFinite(o[k])));
  if(empty.length!==1)return{err:empty.length?'need3':'leaveOne'};
  const miss=empty[0];let {entry:e,close:c,qty:v,pnl:P}=o,q,N;
  const toN=val=>o.unit==='margin'?val*lev:val;
  if(o.unit==='margin'&&!(lev>0))return{err:'lev'};
  if(miss==='entry'){if(o.unit==='coin'){q=v;e=(q*c*(dir-f)-P)/(q*(dir+f))}else{N=toN(v);e=c*N*(dir-f)/(P+N*(dir+f));q=N/e}}
  else{q=o.unit==='coin'?v:toN(v)/e}
  if(miss==='close')c=(P+q*e*(dir+f))/(q*(dir-f));
  if(miss==='qty'){const den=dir*(c-e)-f*(e+c);if(!den)return{err:'qty'};q=P/den;if(!(q>0))return{err:'qty'}}
  if(miss==='pnl')P=q*dir*(c-e)-f*q*(e+c);
  if(!(e>0)||!(c>0)||!(q>0)||!isFinite(P))return{err:'bad'};
  N=q*e;const margin=lev>0?N/lev:NaN,fees=(o.feeRate/100)*q*(e+c),mmr=.005;
  const liq=lev>0?(dir>0?e*(1-1/lev+mmr):e*(1+1/lev-mmr)):NaN;
  const outQty=o.unit==='coin'?q:o.unit==='notional'?N:margin;
  return{miss,entry:e,close:c,qty:outQty,coin:q,pnl:P,notional:N,margin,roe:margin>0?P/margin*100:NaN,move:(c-e)/e*100,fees,feeIn:!!o.fee,liq}}
/* 평균 진입가 */
function solveAvg(o){const rows=o.rows.map(r=>({p:cnum(r.p),v:cnum(r.q)})).filter(r=>r.p>0&&r.v>0).map(r=>({p:r.p,q:o.unit==='coin'?r.v:r.v/r.p}));
  if(!rows.length)return null;const Q=rows.reduce((s,r)=>s+r.q,0),N=rows.reduce((s,r)=>s+r.p*r.q,0),A=N/Q,dir=o.side==='short'?-1:1;
  const out={n:rows.length,avg:A,qty:Q,notional:N};
  const cur=cnum(o.cur);if(cur>0){out.cur=cur;out.upnl=dir*(cur-A)*Q;out.upct=dir*(cur-A)/A*100}
  const T=cnum(o.tgt),p=cnum(o.addp);
  if(T>0&&p>0){if(p===T||(T-A)*(p-T)<=0)out.tgtErr=true;else{const x=Q*(T-A)/(p-T);if(x>0){out.addQ=x;out.addN=x*p}else out.tgtErr=true}}
  return out}
