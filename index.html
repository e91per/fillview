<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2E9D5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fillview">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>Fillview</title>
<style>
:root{
  --bg:#F2E9D5;--card:#F8F1E1;--ink:#2B2418;--acc:#7A5A2B;--acc-ink:#FBF4E3;--win:#2D6A3E;--loss:#A32D2A;
  --font:"Pretendard Variable",Pretendard,"SF Pro Text","Roboto","SamsungOneUI","Noto Sans KR",system-ui,sans-serif;
  --mute:color-mix(in srgb,var(--ink) 56%,var(--bg));
  --line:color-mix(in srgb,var(--ink) 14%,var(--bg));
  --soft:color-mix(in srgb,var(--ink) 5%,var(--card));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.win{color:var(--win)}.loss{color:var(--loss)}
.mute{color:var(--mute)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* 상단 시세 바 */
header.tb{display:flex;align-items:center;gap:14px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.logo{font-size:1.15rem;font-weight:600;letter-spacing:-.03em;text-decoration:none;color:var(--ink);flex:none}
.logo i{font-style:normal;color:var(--loss)}
.symbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.4rem .7rem;flex:none}
.symbtn b{font-size:1.05rem;letter-spacing:-.01em}
.symbtn span{font-size:.78rem;color:var(--mute)}
.price{flex:none;min-width:7.5rem}
.price b{display:block;font-size:1.35rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.price small{font-size:.78rem}
.mkt{display:flex;align-items:center;gap:18px;flex:1;min-width:0}
.stats{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.stats::-webkit-scrollbar{display:none}
.st{flex:none}
.st span{display:block;font-size:.72rem;color:var(--mute);white-space:nowrap}
.st b{display:block;font-size:.88rem;font-weight:600;white-space:nowrap}
.rng{display:flex;align-items:center;gap:6px;font-size:.78rem}
.rng .bar{position:relative;width:84px;height:2px;background:var(--line)}
.rng .bar i{position:absolute;top:-4px;width:2px;height:10px;background:var(--ink)}
.icons{display:flex;gap:4px;flex:none}
.ib{border:1px solid transparent;background:none;border-radius:9px;padding:.35rem .55rem;font-size:.82rem;font-weight:600;color:var(--mute);text-decoration:none}
.ib:hover{border-color:var(--line);color:var(--ink)}

/* 봉 선택 바 */
.tfbar{display:flex;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tfbar::-webkit-scrollbar{display:none}
.tfbar button{border:0;background:none;border-radius:8px;padding:.35rem .65rem;font-weight:600;font-size:.86rem;color:var(--mute);flex:none}
.tfbar button.on{background:var(--soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
.tfbar .sep{width:1px;height:18px;background:var(--line);margin:0 6px;flex:none}
.tfbar .tog{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--mute);flex:none;padding:0 6px;white-space:nowrap}
.tfbar .grow{flex:1}
.live{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--mute);flex:none;padding-right:4px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.live.ok i{background:var(--win)}.live.slow i{background:var(--acc)}.live.bad i{background:var(--loss)}

/* 본문 */
main.wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0}
.chartbox{position:relative;border-right:1px solid var(--line);min-height:420px;height:calc(100svh - 150px)}
#chart{position:absolute;inset:0}
.histbar{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;z-index:3;display:none}
.histbar.on{display:block}
.pill{border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:.45rem 1rem;font-weight:600;font-size:.86rem}
.legend{position:absolute;left:12px;top:8px;z-index:2;font-size:.8rem;color:var(--mute);pointer-events:none}
.legend b{color:var(--ink);font-weight:600}
.msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:2rem;color:var(--mute);z-index:2}
.msg.on{display:grid}

aside.side{display:flex;flex-direction:column;min-height:0;height:calc(100svh - 150px)}
.stabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.stabs button{border:0;background:none;padding:.7rem 0 .6rem;font-weight:600;font-size:.86rem;color:var(--mute);box-shadow:inset 0 -2px 0 transparent}
.stabs button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
.spane{overflow-y:auto;flex:1;padding:6px 0 16px}
.row{display:flex;align-items:center;gap:10px;padding:.55rem 14px;border:0;background:none;width:100%;text-align:left}
button.row:hover{background:var(--soft)}
.row .l{flex:1;min-width:0}
.row .l b{display:block;font-weight:600;font-size:.92rem}
.row .l span{display:block;font-size:.76rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:.88rem}
.row .r span{display:block;font-size:.76rem}
.row.cur{background:var(--soft);box-shadow:inset 2px 0 0 var(--acc)}
.box{margin:8px 14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.box p{margin:0 0 8px;font-size:.84rem;color:var(--mute)}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:.55rem .9rem;font-weight:600;font-size:.86rem}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap}
input[type=checkbox]{width:auto;margin:0;accent-color:var(--acc)}
input:not([type=checkbox]),select{width:100%;border:1px solid var(--line);border-radius:10px;padding:.55rem .7rem;background:var(--card);outline:none}
input:focus{border-color:var(--acc)}
.h{font-size:.76rem;color:var(--mute);padding:.7rem 14px .2rem;font-weight:600}
.empty{padding:1.4rem 14px;color:var(--mute);font-size:.86rem}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:.84rem;margin-top:6px}
.kv span{color:var(--mute)}
.kv b{text-align:right;font-weight:600}

/* 하단 시세 띠 */
footer.tick{display:flex;align-items:center;gap:18px;padding:6px 12px calc(6px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:.8rem;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
footer.tick::-webkit-scrollbar{display:none}
footer.tick button{border:0;background:none;padding:0;font-size:.8rem}
footer.tick .clk{margin-left:auto;color:var(--mute)}
footer.tick a{color:var(--mute)}

/* 창 */
.dim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);z-index:20;display:none;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top)) 12px 12px}
.dim.on{display:flex}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:440px;max-height:80svh;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:1rem;flex:1}
.sheet .body{overflow-y:auto;padding:4px 0 12px}
.star{border:0;background:none;font-size:1.05rem;color:var(--mute);padding:.2rem .4rem}
.star.on{color:var(--acc)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:.5rem;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
label.l{display:block;font-size:.78rem;color:var(--mute);font-weight:600;margin:.8rem 0 .3rem}
.toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:12px;font-size:.86rem;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}

@media (max-width:899px){
  header.tb{flex-wrap:wrap;gap:10px 12px}
  .mkt{order:5;flex-basis:100%;gap:14px}
  .icons{margin-left:auto}
  main.wrap{grid-template-columns:1fr}
  .chartbox{border-right:0;border-bottom:1px solid var(--line);height:58svh;min-height:340px}
  aside.side{height:auto;min-height:50svh}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<header class="tb">
  <a class="logo" href="./" aria-label="Fillview">Fillview<i>_</i></a>
  <button class="symbtn" id="symBtn" aria-haspopup="dialog"><b id="symBase">BTC</b><span id="symQ"></span><span aria-hidden="true">▾</span></button>
  <div class="mkt">
    <div class="price"><b class="num" id="px">–</b><small class="num" id="chg"></small></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="icons">
    <a class="ib" href="../fillog/" id="lnkJournal"></a>
    <button class="ib" id="setBtn"></button>
  </div>
</header>
<div class="tfbar" id="tfbar"></div>
<main class="wrap">
  <section class="chartbox">
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
    <div class="msg" id="msg"></div>
    <div class="histbar" id="histbar"><button class="pill" id="liveBtn"></button></div>
  </section>
  <aside class="side">
    <nav class="stabs" id="stabs"></nav>
    <div class="spane" id="spane"></div>
  </aside>
</main>
<footer class="tick" id="tick"></footer>
<div class="dim" id="dim"><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
<script>
'use strict';
/* =========================================================
   Fillview — 서버 없이 동작하는 차트 + 내 매매 화면
   시세: 바이낸스 선물 공개 데이터 / 내 매매: Fillog 일지 + 하이퍼리퀴드 공개 데이터
   ========================================================= */

/* ---------- 순수 계산 (테스트 가능) ---------- */
const Core=(()=>{
  const pad=n=>String(n).padStart(2,'0');
  const QUOTE=/(USDT|USDC|BUSD|FDUSD|USD)$/;
  const baseOf=s=>{const x=String(s||'').toUpperCase().replace(/\.P$/,'').replace(/PERP(ETUAL)?/g,'').replace(/[\s/_:-]/g,'');const y=x.replace(QUOTE,'');return y||x};
  const TF={'1m':6e4,'5m':3e5,'15m':9e5,'1h':36e5,'4h':144e5,'1d':864e5,'1w':6048e5};
  const barFloor=(ms,tf)=>{const d=TF[tf];if(tf==='1w'){const o=4*864e5;return Math.floor((ms-o)/d)*d+o}return Math.floor(ms/d)*d};
  const pickTf=h=>h<2*36e5?'5m':h<12*36e5?'15m':h<2*864e5?'1h':h<10*864e5?'4h':'1d';
  const decimals=p=>p>=1e4?1:p>=100?2:p>=10?3:p>=1?4:p>=.1?5:p>=.01?6:7;
  const fmtP=p=>p==null||!isFinite(p)?'–':Number(p).toLocaleString('en-US',{minimumFractionDigits:decimals(Math.abs(p)),maximumFractionDigits:decimals(Math.abs(p))});
  const compact=n=>{if(n==null||!isFinite(n))return '–';const a=Math.abs(n);
    return a>=1e9?(n/1e9).toFixed(2)+'B':a>=1e6?(n/1e6).toFixed(2)+'M':a>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(2)};
  const countdown=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
  const plainCoin=c=>/^[A-Z0-9]+$/i.test(String(c||''))&&!String(c).startsWith('@');

  /* 하이퍼리퀴드 체결을 '0에서 시작해 0으로 끝난 매매' 단위로 묶어요.
     시작 전 기록이 없는 매매와 아직 진행 중인 매매는 보내지 않아요. */
  function hlGroups(fills){
    const EPS=1e-8,by={};let skipped=0;
    (fills||[]).forEach(f=>{if(!plainCoin(f.coin)){skipped++;return}(by[f.coin]=by[f.coin]||[]).push(f)});
    const closed=[];let open=0,partial=0,flips=0;
    Object.keys(by).forEach(coin=>{
      const arr=by[coin].slice().sort((a,b)=>a.time-b.time||(a.tid||0)-(b.tid||0));let cur=null;
      arr.forEach(f=>{
        const sz=+f.sz,d=f.side==='B'?1:-1,st=+f.startPosition,end=st+d*sz;
        if(Math.abs(st)<EPS)cur=[f];
        else if(cur)cur.push(f);
        else{partial++;return}
        if(Math.abs(end)<EPS){closed.push({coin,fills:cur});cur=null}
        else if(Math.abs(st)>=EPS&&Math.sign(end)!==Math.sign(st)){closed.push({coin,fills:cur,flip:true});cur=null;flips++}
      });
      if(cur)open++});
    closed.sort((a,b)=>a.fills[0].time-b.fills[0].time);
    return{closed,open,partial,flips,skipped}}

  function toFillog(groups){
    const fills=[];
    groups.forEach(g=>g.fills.forEach(f=>fills.push({time:f.time,symbol:g.coin+'USDT',side:f.side==='B'?'buy':'sell',
      price:+f.px,qty:+f.sz,fee:Math.abs(+f.fee||0),feeAsset:f.feeToken||'USDC',pnl:+f.closedPnl||0,id:String(f.tid??'')})));
    return JSON.stringify({fillog:1,exchange:'Hyperliquid',timezone:'UTC',fills})}

  const HLDIR={'Open Long':['롱 진입','Long'],'Close Long':['롱 청산','Close L'],'Open Short':['숏 진입','Short'],'Close Short':['숏 청산','Close S']};
  const hlLabel=(dir,en)=>{const x=HLDIR[dir];if(x)return x[en?1:0];return /long\s*>\s*short|short\s*>\s*long/i.test(String(dir))?(en?'Flip':'전환'):''};

  /* 차트 표시(마커) 만들기 */
  function markers(o){
    const {trades=[],hl=[],events=[],base,tf,tzSec=0,from=-Infinity,to=Infinity,en=false,col}=o,items=[];
    trades.forEach(t=>{if(t.settle||baseOf(t.symbol)!==base)return;
      (t.fills||[]).forEach(f=>{if(f.time==null)return;items.push({ms:f.time,dir:f.dir>0?1:-1,label:f.label||''})})});
    hl.forEach(f=>{if(String(f.coin).toUpperCase()!==base)return;items.push({ms:f.time,dir:f.side==='B'?1:-1,label:hlLabel(f.dir,en)})});
    const g=new Map();
    items.forEach(x=>{const bar=barFloor(x.ms,tf)/1000;if(bar<from||bar>to)return;const k=bar+'|'+x.dir+'|'+x.label;
      const e=g.get(k);if(e)e.n++;else g.set(k,{bar,dir:x.dir,label:x.label,n:1})});
    const many=g.size>120,out=[];
    g.forEach(e=>out.push({time:e.bar+tzSec,position:e.dir>0?'belowBar':'aboveBar',shape:e.dir>0?'arrowUp':'arrowDown',
      color:e.dir>0?col.win:col.loss,text:many?'':(e.label+(e.n>1?' ×'+e.n:'')).trim()}));
    events.forEach(ev=>{const bar=barFloor(ev.ms,tf)/1000;if(bar<from||bar>to)return;
      out.push({time:bar+tzSec,position:'aboveBar',shape:'square',color:col.acc,text:many?'':ev.title})});
    out.sort((a,b)=>a.time-b.time);return out}

  return{pad,baseOf,TF,barFloor,pickTf,decimals,fmtP,compact,countdown,plainCoin,hlGroups,toFillog,hlLabel,markers}})();
/* ---------- 순수 계산 끝 ---------- */

const {pad,baseOf,TF,barFloor,pickTf,decimals,fmtP,compact,countdown}=Core;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 저장소 (일지와 같은 기기 저장소를 함께 써요) ---------- */
const DB=(()=>{let db=null;
  const open=()=>new Promise(res=>{try{const r=indexedDB.open('fillog',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}});
  const st=m=>db.transaction('kv',m).objectStore('kv');
  const get=k=>new Promise(res=>{if(!db)return res();const r=st('readonly').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>res()});
  const set=(k,v)=>new Promise(res=>{if(!db)return res();const r=st('readwrite').put(v,k);r.onsuccess=()=>res();r.onerror=()=>res()});
  return{open,get,set}})();

/* ---------- 언어 ---------- */
const T={
  ko:{perp:'USDT 무기한',range:'24시간 범위',vol:'24시간 거래대금',fund:'펀딩',lpay:'롱이 냄',spay:'숏이 냄',oi:'미결제약정',mark:'표시 가격',
    journal:'일지',settings:'설정',watch:'와치',trades:'내 매매',pos:'포지션',events:'일정',showMine:'내 매매 표시',
    live:'실시간',slow:'새로고침 방식',down:'시세 연결 안 됨',back:'실시간으로 돌아가기',search:'종목 검색 (예: SOL)',pick:'종목 선택',
    close:'닫기',noWatch:'별표를 눌러 와치리스트에 종목을 추가하세요.',fromJ:'일지 기록',noJ:'이 종목의 일지 기록이 없어요.',
    hl:'하이퍼리퀴드',hlAddr:'지갑 주소 (0x로 시작)',hlHelp:'지갑 주소만 넣으면 체결과 포지션을 자동으로 불러와요. 키나 서명은 필요 없어요.',
    hlSave:'저장하고 불러오기',hlSync:'새 체결 불러오기',hlSend:'일지로 보내기',hlNone:'불러온 체결이 없어요.',
    hlReady:n=>`일지로 보낼 수 있는 끝난 매매 ${n}건`,hlOpen:n=>`진행 중 ${n}건은 끝나면 보낼 수 있어요`,hlPartial:n=>`시작 기록이 없는 체결 ${n}건은 건너뛰어요`,
    hlLoaded:n=>`새 체결 ${n}건을 불러왔어요`,hlErr:'하이퍼리퀴드에 연결하지 못했어요. 주소를 확인하고 잠시 후 다시 시도해 주세요.',
    hlSent:'일지로 보냈어요. 미리보기에서 확인하고 저장하세요.',noPos:'열린 포지션이 없어요.',posNeed:'설정에서 하이퍼리퀴드 지갑 주소를 넣으면 포지션이 보여요.',
    entry:'진입가',liq:'청산가',upnl:'미실현 손익',size:'수량',lev:'레버리지',toLiq:'청산까지',acct:'계좌 가치',
    evTitle:'일정 이름 (예: CPI)',evAdd:'일정 추가',evNone:'다가오는 일정이 없어요. CPI·FOMC 같은 일정을 추가하면 차트에도 표시돼요.',evPast:'지난 일정',

function modeNow(){const m=CFG.mode||(J&&J.theme&&J.theme.mode)||'system';return m==='system'?(mq.matches?'dark':'light'):m}
function pal(){const d=modeNow()==='dark',th=J&&J.theme,p={...(d?THEME0.dark:THEME0.light),...((th&&(d?th.dark:th.light))||{})};
  p.card=p.card||p.bg;p.acc=p.acc||p.ink;return p}
const hexA=(h,a)=>/^#[0-9a-f]{6}$/i.test(h)?h+a:h;
function lum(h){const m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m)return 1;const n=parseInt(m[1],16);return (.299*(n>>16&255)+.587*(n>>8&255)+.114*(n&255))/255}
function applyTheme(){const p=pal(),r=document.documentElement.style;
  ['bg','card','ink','acc','win','loss'].forEach(k=>r.setProperty('--'+k,p[k]));
  r.setProperty('--acc-ink',lum(p.acc)>.55?'#2B2418':'#FBF4E3');r.colorScheme=modeNow();
  $('meta[name=theme-color]').setAttribute('content',p.bg);
  if(chart){const mute=mix(p.ink,p.bg,.56),line=mix(p.ink,p.bg,.12);
    chart.applyOptions({layout:{background:{type:'solid',color:p.card},textColor:mute,fontFamily:getComputedStyle(document.body).fontFamily},
      grid:{vertLines:{color:line},horzLines:{color:line}},rightPriceScale:{borderColor:line},timeScale:{borderColor:line},
      watermark:{visible:true,text:'Fillview',color:hexA(p.ink,'14'),fontSize:44}});
    candle.applyOptions({upColor:p.win,downColor:p.loss,wickUpColor:p.win,wickDownColor:p.loss,borderVisible:false});
    if(lastK.length)setCandles(lastK);drawMarks();drawPosLines()}}
function mix(a,b,w){const x=/^#?([0-9a-f]{6})$/i.exec(a),y=/^#?([0-9a-f]{6})$/i.exec(b);if(!x||!y)return a;
  const A=parseInt(x[1],16),B=parseInt(y[1],16),c=s=>Math.round(((A>>s)&255)*w+((B>>s)&255)*(1-w));
  return '#'+[16,8,0].map(s=>c(s).toString(16).padStart(2,'0')).join('')}

const tzMin=()=>J&&J.settings&&J.settings.tzMin!=null?J.settings.tzMin:-new Date().getTimezoneOffset();
const tzSec=()=>tzMin()*60;
const fmtDT=ms=>{const d=new Date(ms+tzMin()*60000);return pad(d.getUTCMonth()+1)+'/'+pad(d.getUTCDate())+' '+pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
const tzLabel=()=>{const m=tzMin(),a=Math.abs(m);return 'UTC'+(m<0?'-':'+')+(a%60?pad(Math.floor(a/60))+':'+pad(a%60):Math.floor(a/60))};

async function loadKlines(endMs){
  const u=API+'/fapi/v1/klines?symbol='+CFG.sym+'&interval='+CFG.tf+'&limit=1000'+(endMs?'&endTime='+Math.floor(endMs):'');

let chart,candle,vol,lastK=[],posLines=[];
function initChart(){
  if(!window.LightweightCharts){showMsg(t('libErr'));return}
  chart=LightweightCharts.createChart($('#chart'),{autoSize:true,
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    timeScale:{timeVisible:true,secondsVisible:false,rightOffset:6},
    localization:{priceFormatter:p=>fmtP(p)}});
  candle=chart.addCandlestickSeries({borderVisible:false});
  vol=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:''});
  vol.priceScale().applyOptions({scaleMargins:{top:.82,bottom:0}});
  candle.priceScale().applyOptions({scaleMargins:{top:.08,bottom:.22}});
  chart.subscribeCrosshairMove(p=>{const d=p&&p.seriesData?p.seriesData.get(candle):null;legend(d)})}
function setCandles(k){const z=tzSec(),p=pal();
  candle.setData(k.map(x=>({time:x.t/1000+z,open:x.o,high:x.h,low:x.l,close:x.c})));
  vol.setData(k.map(x=>({time:x.t/1000+z,value:x.v,color:hexA(x.c>=x.o?p.win:p.loss,'55')})));
  const lp=k.length?k[k.length-1].c:0,dc=decimals(lp);
  candle.applyOptions({priceFormat:{type:'price',precision:dc,minMove:Math.pow(10,-dc)}});
  M.first=k.length?k[0].t/1000:0;M.last=k.length?k[k.length-1].t/1000:0}
function liveCandle(x){if(M.hist||!candle)return;const z=tzSec(),p=pal();
  if(lastK.length&&x.t<lastK[lastK.length-1].t)return;
  if(lastK.length&&lastK[lastK.length-1].t===x.t)lastK[lastK.length-1]=x;else{lastK.push(x);M.last=x.t/1000}
  candle.update({time:x.t/1000+z,open:x.o,high:x.h,low:x.l,close:x.c});
  vol.update({time:x.t/1000+z,value:x.v,color:hexA(x.c>=x.o?p.win:p.loss,'55')})}
function legend(d){const el=$('#legend');const b=baseOf(CFG.sym)+' · '+TFL[LANG][CFG.tf];
  if(!d){el.innerHTML='<b>'+esc(b)+'</b>';return}
  const c=d.close>=d.open?'win':'loss';
  el.innerHTML='<b>'+esc(b)+'</b>&nbsp; O <span class="num '+c+'">'+fmtP(d.open)+'</span> H <span class="num '+c+'">'+fmtP(d.high)+'</span> L <span class="num '+c+'">'+fmtP(d.low)+'</span> C <span class="num '+c+'">'+fmtP(d.close)+'</span>'}
function drawMarks(){if(!candle)return;const p=pal();
  const list=CFG.showMine?Core.markers({trades:(J&&J.trades)||[],hl:unsentFills(),events:CFG.events,base:baseOf(CFG.sym),tf:CFG.tf,tzSec:tzSec(),
    from:M.first,to:M.last+TF[CFG.tf]/1000,en:LANG==='en',col:{win:p.win,loss:p.loss,acc:p.acc}}):[];
  candle.setMarkers(list)}
function drawPosLines(){if(!candle)return;posLines.forEach(l=>candle.removePriceLine(l));posLines=[];
  if(!CFG.showMine||!HL.pos)return;const p=pal(),b=baseOf(CFG.sym);
  HL.pos.forEach(x=>{if(String(x.coin).toUpperCase()!==b)return;const long=x.szi>0;
    posLines.push(candle.createPriceLine({price:x.entryPx,color:long?p.win:p.loss,lineWidth:1,lineStyle:2,axisLabelVisible:true,title:(long?t('longW'):t('shortW'))+' '+t('entry')}));
    if(x.liquidationPx)posLines.push(candle.createPriceLine({price:x.liquidationPx,color:p.loss,lineWidth:1,lineStyle:1,axisLabelVisible:true,title:t('liq')}))})}
function showMsg(s){const m=$('#msg');m.textContent=s||'';m.classList.toggle('on',!!s)}

async function reloadChart(endMs){
  try{const k=await loadKlines(endMs);lastK=k;setCandles(k);showMsg('');

/* 일지 매매로 이동: 보유 시간에 맞는 봉으로 바꾸고 그 구간을 보여 줘요 */
async function focusTrade(tr){
  const o=tr.openTime||tr.closeTime,c=tr.closeTime||o,sym=(baseOf(tr.symbol)+'USDT');
  if(sym!==CFG.sym){CFG.sym=sym;renderTop()}
  CFG.tf=pickTf(c-o);saveCfg();renderTf();connect();
  const span=TF[CFG.tf],end=c+span*80,now=Date.now();
  const ok=await reloadChart(end<now-span*5?end:0);if(!ok)return;
  const z=tzSec(),from=barFloor(o,CFG.tf)/1000-span/1000*40+z,to=barFloor(c,CFG.tf)/1000+span/1000*40+z;
  chart.timeScale().setVisibleRange({from,to})}

/* ---------- 실시간 연결 (끊기면 새로고침 방식으로 바꿔요) ---------- */
let ws=null,wsTry=0,wsGen=0,lastMsg=0,pollT=null,pollW=null;
function streams(){const s=CFG.sym.toLowerCase(),set=new Set([s+'@kline_'+CFG.tf,s+'@markPrice@1s',s+'@miniTicker']);
  CFG.watch.forEach(w=>set.add(w.toLowerCase()+'@miniTicker'));return [...set]}
function connect(){
  const gen=++wsGen;try{ws&&ws.close()}catch(e){}
  try{ws=new WebSocket('wss://fstream.binance.com/stream?streams='+streams().join('/'))}catch(e){startPoll();return}
  ws.onopen=()=>{if(gen!==wsGen)return;wsTry=0;lastMsg=Date.now();setLive('ok');stopPoll()};
  ws.onmessage=e=>{if(gen!==wsGen)return;lastMsg=Date.now();let m;try{m=JSON.parse(e.data)}catch(_){return}onData(m.data||m)};
  ws.onclose=()=>{if(gen!==wsGen)return;wsTry++;if(wsTry>=3){startPoll()}else setTimeout(()=>{if(gen===wsGen)connect()},1500*wsTry)};
  ws.onerror=()=>{}}
function onData(d){if(!d||!d.e)return;
  if(d.e==='kline'&&d.s===CFG.sym&&d.k.i===CFG.tf){const k=d.k;liveCandle({t:k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v})}
  else if(d.e==='markPriceUpdate'&&d.s===CFG.sym){M.mark=+d.p;M.fund=+d.r;M.next=+d.T;renderStats()}
  else if(d.e==='24hrMiniTicker'){M.tick[d.s]={c:+d.c,o:+d.o,h:+d.h,l:+d.l,q:+d.q};if(d.s===CFG.sym)renderPrice();scheduleLists()}}
function setLive(s){M.live=s;const el=$('#liveDot');if(el){el.className='live '+s;el.lastChild.textContent=t(s==='ok'?'live':s==='slow'?'slow':'down')}}
function startPoll(){setLive('slow');if(pollT)return;const run=async()=>{
    try{const k=await getJ(API+'/fapi/v1/klines?symbol='+CFG.sym+'&interval='+CFG.tf+'&limit=2');
      k.forEach(r=>liveCandle({t:r[0],o:+r[1],h:+r[2],l:+r[3],c:+r[4],v:+r[5]}));
      const pi=await getJ(API+'/fapi/v1/premiumIndex?symbol='+CFG.sym);M.mark=+pi.markPrice;M.fund=+pi.lastFundingRate;M.next=+pi.nextFundingTime;
      setLive('slow')}catch(e){setLive('bad')}};
  run();pollT=setInterval(run,5000);
  /* 와치리스트 가격은 15초마다 */
  pollW=setInterval(loadAllTickers,15000)}
function stopPoll(){if(!pollT)return;clearInterval(pollT);clearInterval(pollW);pollT=null;pollW=null}
let wsRetryAt=0;
setInterval(()=>{
  if(M.live==='ok'&&Date.now()-lastMsg>15000){setLive('slow');connect();return}
  /* 새로고침 방식일 때도 1분마다 실시간 연결을 다시 시도해요 */
  if(pollT&&Date.now()-wsRetryAt>60000){wsRetryAt=Date.now();wsTry=2;connect()}},5000);

async function loadAllTickers(){
  try{const a=await getJ(API+'/fapi/v1/ticker/24hr');
    M.all=a.filter(x=>/USDT$/.test(x.symbol)).map(x=>({s:x.symbol,c:+x.lastPrice,o:+x.openPrice,h:+x.highPrice,l:+x.lowPrice,q:+x.quoteVolume}))
      .sort((x,y)=>y.q-x.q);
    M.all.forEach(x=>{M.tick[x.s]={c:x.c,o:x.o,h:x.h,l:x.l,q:x.q}});renderPrice();scheduleLists();return true}
  catch(e){return false}}
async function loadDeriv(){
  try{const pi=await getJ(API+'/fapi/v1/premiumIndex?symbol='+CFG.sym);M.mark=+pi.markPrice;M.fund=+pi.lastFundingRate;M.next=+pi.nextFundingTime}catch(e){}

/* ---------- 하이퍼리퀴드 (지갑 주소만으로 공개 데이터 조회) ---------- */
const HLAPI='https://api.hyperliquid.xyz/info';
const hlPost=b=>getJ(HLAPI,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
const unsentFills=()=>{const s=new Set(HL.sent);return HL.fills.filter(f=>!s.has(String(f.tid)))};
async function hlSync(quiet){
  const user=CFG.hlAddr;if(!user)return;
  try{let start=HL.last?HL.last+1:0,added=0,guard=0;const seen=new Set(HL.fills.map(f=>String(f.tid)));
    while(guard++<10){const arr=await hlPost({type:'userFillsByTime',user,startTime:start,aggregateByTime:false});
      if(!Array.isArray(arr)||!arr.length)break;
      arr.forEach(f=>{const k=String(f.tid);if(!seen.has(k)){seen.add(k);HL.fills.push(f);added++}});
      const mx=Math.max(...arr.map(f=>f.time));HL.last=Math.max(HL.last,mx);
      if(arr.length<2000)break;start=mx+1}
    HL.fills.sort((a,b)=>a.time-b.time);
    if(HL.fills.length>12000)HL.fills=HL.fills.slice(-12000);
    await saveHL();drawMarks();renderSide();
    if(!quiet)toast(tf_('hlLoaded',added))}
  catch(e){if(!quiet)toast(t('hlErr'))}}
async function hlPositions(){
  if(!CFG.hlAddr){HL.pos=null;return}
  try{const r=await hlPost({type:'clearinghouseState',user:CFG.hlAddr});
    HL.pos=(r.assetPositions||[]).map(a=>a.position).filter(Boolean).map(p=>({coin:p.coin,szi:+p.szi,entryPx:+p.entryPx,
      liquidationPx:p.liquidationPx!=null?+p.liquidationPx:null,upnl:+p.unrealizedPnl,lev:p.leverage&&p.leverage.value,value:+p.positionValue}));
    HL.acct=r.marginSummary?+r.marginSummary.accountValue:null;drawPosLines();if(CFG.tab==='pos')renderSide()}
  catch(e){}}
setInterval(()=>{if(!document.hidden)hlPositions()},30000);
async function hlSend(){
  const g=Core.hlGroups(unsentFills());if(!g.closed.length)return;
  const json=Core.toFillog(g.closed);
  await DB.set('pendingImport',json);
  g.closed.forEach(x=>x.fills.forEach(f=>HL.sent.push(String(f.tid))));
  if(HL.sent.length>20000)HL.sent=HL.sent.slice(-20000);
  await saveHL();toast(t('hlSent'));setTimeout(()=>{location.href='../fillog/'},500)}

function renderSide(){
  const tabs=[['watch',t('watch')],['trades',t('trades')],['pos',t('pos')],['events',t('events')]];
  $('#stabs').innerHTML=tabs.map(([k,n])=>`<button data-stab="${k}" class="${CFG.tab===k?'on':''}">${n}</button>`).join('');
  const P=$('#spane');
  if(CFG.tab==='watch'){
    if(!CFG.watch.length){P.innerHTML=`<div class="empty">${t('noWatch')}</div>`;return}
    P.innerHTML=CFG.watch.map(s=>{const x=M.tick[s]||{},d=x.o?(x.c-x.o)/x.o*100:null,c=d==null?'':d>=0?'win':'loss';
      return `<button class="row ${s===CFG.sym?'cur':''}" data-sym="${s}"><div class="l"><b>${esc(baseOf(s))}</b><span>${compact(x.q)} USDT</span></div>
        <div class="r num"><b>${fmtP(x.c)}</b><span class="${c}">${d==null?'':(d>=0?'+':'')+d.toFixed(2)+'%'}</span></div></button>`}).join('');
    return}
  if(CFG.tab==='trades'){
    const b=baseOf(CFG.sym),js=((J&&J.trades)||[]).filter(x=>!x.settle&&baseOf(x.symbol)===b).sort((x,y)=>(y.openTime||0)-(x.openTime||0));
    let h='';
    if(CFG.hlAddr){const g=Core.hlGroups(unsentFills());
      h+=`<div class="box"><p><b style="color:var(--ink)">${t('hl')}</b> · ${esc(CFG.hlAddr.slice(0,6)+'…'+CFG.hlAddr.slice(-4))}</p>
        <p>${HL.fills.length?esc(tf_('hlReady',g.closed.length)):t('hlNone')}${g.open?'<br>'+esc(tf_('hlOpen',g.open)):''}${g.partial?'<br>'+esc(tf_('hlPartial',g.partial)):''}</p>
        <div class="btns"><button class="btn ghost" data-act="hlSync">${t('hlSync')}</button><button class="btn" data-act="hlSend" ${g.closed.length?'':'disabled'}>${t('hlSend')}</button></div></div>`}
    else h+=`<div class="box"><p>${t('hlHelp')}</p><button class="btn ghost" data-act="settings">${t('settings')}</button></div>`;
    h+=`<div class="h">${t('fromJ')}</div>`;
    h+=js.length?js.slice(0,80).map(x=>{const i=J.trades.indexOf(x),side=x.side==='long'?t('longW'):x.side==='short'?t('shortW'):'';
      return `<button class="row" data-tr="${i}"><div class="l"><b>${esc(side)} ${esc(baseOf(x.symbol))}</b><span>${fmtDT(x.openTime||x.closeTime)} → ${fmtDT(x.closeTime||x.openTime)}</span></div>
        <div class="r num ${x.pnl>0?'win':x.pnl<0?'loss':''}"><b>${(x.pnl>0?'+':'')+(x.pnl||0).toFixed(2)}</b></div></button>`}).join('')
      :`<div class="empty">${t('noJ')}</div>`;
    const hl=HL.fills.filter(f=>String(f.coin).toUpperCase()===b).slice(-30).reverse();
    if(hl.length){h+=`<div class="h">${t('hlRecent')}</div>`+hl.map(f=>`<div class="row"><div class="l"><b>${esc(Core.hlLabel(f.dir,LANG==='en')||f.dir)}</b><span>${fmtDT(f.time)} · ${esc(f.sz)} @ ${fmtP(+f.px)}</span></div>
      <div class="r num ${+f.closedPnl>0?'win':+f.closedPnl<0?'loss':''}">${+f.closedPnl?(+f.closedPnl>0?'+':'')+(+f.closedPnl).toFixed(2):''}</div></div>`).join('')}
    P.innerHTML=h;return}
  if(CFG.tab==='pos'){
    if(!CFG.hlAddr){P.innerHTML=`<div class="empty">${t('posNeed')}</div>`;return}
    const ps=HL.pos||[];let h=HL.acct!=null?`<div class="box"><div class="kv"><span>${t('acct')}</span><b class="num">${HL.acct.toLocaleString('en-US',{maximumFractionDigits:2})} USDC</b></div></div>`:'';
    h+=ps.length?ps.map(p=>{const mk=(M.tick[p.coin.toUpperCase()+'USDT']||{}).c,toL=p.liquidationPx&&mk?Math.abs(mk-p.liquidationPx)/mk*100:null;
      return `<div class="box"><p><b style="color:var(--ink)">${p.szi>0?t('longW'):t('shortW')} ${esc(p.coin)}</b>${p.lev?' · '+p.lev+'x':''}</p>
        <div class="kv"><span>${t('size')}</span><b class="num">${Math.abs(p.szi)}</b><span>${t('entry')}</span><b class="num">${fmtP(p.entryPx)}</b>
        <span>${t('liq')}</span><b class="num">${p.liquidationPx?fmtP(p.liquidationPx):'–'}</b><span>${t('toLiq')}</span><b class="num">${toL==null?'–':toL.toFixed(1)+'%'}</b>
        <span>${t('upnl')}</span><b class="num ${p.upnl>=0?'win':'loss'}">${(p.upnl>=0?'+':'')+p.upnl.toFixed(2)}</b></div></div>`}).join('')
      :`<div class="empty">${t('noPos')}</div>`;
    P.innerHTML=h;return}
  if(CFG.tab==='events'){
    const now=Date.now(),up=CFG.events.filter(e=>e.ms>=now).sort((a,b)=>a.ms-b.ms),past=CFG.events.filter(e=>e.ms<now).sort((a,b)=>b.ms-a.ms).slice(0,10);
    const row=e=>`<div class="row"><div class="l"><b>${esc(e.title)}</b><span>${fmtDT(e.ms)}${e.ms>=now?' · '+esc(tf_('inT',countdown(e.ms-now))):''}</span></div><button class="btn ghost" data-evdel="${esc(e.id)}">${t('del')}</button></div>`;
    P.innerHTML=`<div class="box"><label class="l" style="margin-top:0">${t('evTitle')}</label><input id="evT" maxlength="24">
      <label class="l">${tzLabel()}</label><input id="evD" type="datetime-local"><div class="btns" style="margin-top:10px"><button class="btn" data-act="evAdd">${t('evAdd')}</button></div></div>`+
      (up.length?up.map(row).join(''):`<div class="empty">${t('evNone')}</div>`)+(past.length?`<div class="h">${t('evPast')}</div>`+past.map(row).join(''):'')}}

function renderTick(){
  $('#tick').innerHTML=CFG.watch.map(s=>{const x=M.tick[s]||{},d=x.o?(x.c-x.o)/x.o*100:null;
    return `<button data-sym="${s}"><b>${esc(baseOf(s))}</b> <span class="num">${fmtP(x.c)}</span> <span class="num ${d==null?'':d>=0?'win':'loss'}">${d==null?'':(d>=0?'+':'')+d.toFixed(2)+'%'}</span></button>`}).join('')+
    `<span class="clk num" id="clk">${clock()}</span><a href="https://www.tradingview.com/" target="_blank" rel="noopener">${t('attr')}</a>`}

/* ---------- 창 (종목 선택 / 설정) ---------- */
let sheetKind=null;
function openSheet(kind){sheetKind=kind;$('#dim').classList.add('on');
  if(kind==='sym'){$('#sheet').innerHTML=`<header><h3>${t('pick')}</h3><button class="ib" data-act="close">${t('close')}</button></header>
      <div style="padding:10px 14px 4px"><input id="symQ2" placeholder="${esc(t('search'))}" autocomplete="off" autocapitalize="characters"></div><div class="body" id="symList"></div>`;
    renderSymList();setTimeout(()=>{const i=$('#symQ2');i&&i.focus()},50);
    if(!M.all.length)loadAllTickers()}
  else if(kind==='set'){const m=CFG.mode||'system';
    $('#sheet').innerHTML=`<header><h3>${t('settings')}</h3><button class="ib" data-act="close">${t('close')}</button></header><div class="body" style="padding:4px 14px 14px">
      <label class="l">${t('hl')}</label><input id="hlA" value="${esc(CFG.hlAddr)}" placeholder="0x…" autocomplete="off" spellcheck="false">
      <p class="mute" style="font-size:.8rem;margin:.4rem 0 0">${t('hlHelp')}</p>
      <div class="btns" style="margin-top:10px"><button class="btn" data-act="hlSave">${t('hlSave')}</button></div>
      <label class="l">${t('lang')}</label><div class="seg"><button data-lang="ko" class="${LANG==='ko'?'on':''}">한국어</button><button data-lang="en" class="${LANG==='en'?'on':''}">English</button></div>
      <label class="l">${t('theme')}</label><div class="seg"><button data-mode="system" class="${m==='system'?'on':''}">${t('sys')}</button><button data-mode="light" class="${m==='light'?'on':''}">${t('light')}</button><button data-mode="dark" class="${m==='dark'?'on':''}">${t('dark')}</button></div>
      </div>`}}
function closeSheet(){$('#dim').classList.remove('on');sheetKind=null}
function renderSymList(){const q=(($('#symQ2')||{}).value||'').trim().toUpperCase();
  const all=M.all.length?M.all:CFG.watch.map(s=>({s,...(M.tick[s]||{})}));
  const list=all.filter(x=>!q||x.s.includes(q)).slice(0,60);
  $('#symList').innerHTML=list.map(x=>{const d=x.o?(x.c-x.o)/x.o*100:null,on=CFG.watch.includes(x.s);
    return `<div class="row ${x.s===CFG.sym?'cur':''}"><button class="star ${on?'on':''}" data-star="${x.s}" aria-label="watchlist">${on?'★':'☆'}</button>
      <button class="row" style="padding:0" data-sym="${x.s}"><div class="l"><b>${esc(baseOf(x.s))}</b><span>${compact(x.q)} USDT</span></div>
      <div class="r num"><b>${fmtP(x.c)}</b><span class="${d==null?'':d>=0?'win':'loss'}">${d==null?'':(d>=0?'+':'')+d.toFixed(2)+'%'}</span></div></button></div>`}).join('')||`<div class="empty">–</div>`}

let toastT;
function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2600)}

async function setSym(s){if(s===CFG.sym){closeSheet();return}CFG.sym=s;saveCfg();closeSheet();M.mark=null;M.fund=null;M.oi=null;M.next=0;
  renderTop();renderSide();connect();await reloadChart();loadDeriv()}
async function setTf(x){CFG.tf=x;saveCfg();renderTf();connect();await reloadChart()}

/* ---------- 입력 처리 ---------- */
document.addEventListener('click',async e=>{const el=e.target.closest('[data-tf],[data-sym],[data-stab],[data-act],[data-tr],[data-star],[data-lang],[data-mode],[data-evdel]');
  if(e.target.id==='dim'){closeSheet();return}
  if(e.target.closest('#symBtn')){openSheet('sym');return}
  if(e.target.closest('#setBtn')){openSheet('set');return}
  if(e.target.closest('#liveBtn')){await reloadChart();return}
  if(!el)return;const D=el.dataset;
  if(D.tf){setTf(D.tf);return}
  if(D.star){const i=CFG.watch.indexOf(D.star);if(i>=0)CFG.watch.splice(i,1);else CFG.watch.push(D.star);saveCfg();renderSymList();renderSide();renderTick();connect();return}
  if(D.sym){setSym(D.sym);return}
  if(D.stab){CFG.tab=D.stab;saveCfg();renderSide();if(D.stab==='pos')hlPositions();return}
  if(D.tr!=null){const tr=J&&J.trades[+D.tr];if(tr)focusTrade(tr);return}
  if(D.lang){LANG=D.lang;CFG.lang=D.lang;saveCfg();document.documentElement.lang=LANG;renderAll();openSheet('set');return}
  if(D.mode){CFG.mode=D.mode==='system'?null:D.mode;saveCfg();applyTheme();openSheet('set');return}
  if(D.evdel){CFG.events=CFG.events.filter(x=>x.id!==D.evdel);saveCfg();renderSide();drawMarks();return}
  switch(D.act){
    case 'close':closeSheet();break;
    case 'settings':openSheet('set');break;
    case 'hlSave':{const v=($('#hlA').value||'').trim();
      if(v&&!/^0x[0-9a-fA-F]{40}$/.test(v)){toast(t('hlAddr'));break}
      if(v.toLowerCase()!==CFG.hlAddr.toLowerCase()){HL={fills:[],sent:[],last:0,pos:null};await saveHL()}
      CFG.hlAddr=v.toLowerCase();saveCfg();closeSheet();CFG.tab='trades';renderSide();toast(t('saved'));
      if(v){await hlSync();hlPositions()}else drawPosLines();break}
    case 'hlSync':el.disabled=true;await hlSync();break;
    case 'hlSend':el.disabled=true;await hlSend();break;
    case 'evAdd':{const ti=($('#evT').value||'').trim(),dv=$('#evD').value;if(!ti||!dv)break;
      const [dd,tt]=dv.split('T'),[y,mo,d]=dd.split('-').map(Number),[h,mi]=tt.split(':').map(Number);
      const ms=Date.UTC(y,mo-1,d,h,mi)-tzMin()*60000;
      CFG.events.push({id:Date.now().toString(36),title:ti,ms});saveCfg();renderSide();drawMarks();break}
  }});
document.addEventListener('input',e=>{if(e.target.id==='symQ2')renderSymList()});
document.addEventListener('change',e=>{if(e.target.id==='mineTog'){CFG.showMine=e.target.checked;saveCfg();drawMarks();drawPosLines()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();
  if(e.key==='Enter'&&e.target.id==='symQ2'){const b=document.querySelector('#symList [data-sym]');b&&b.click()}});
document.addEventListener('visibilitychange',async()=>{if(document.hidden)return;
  const s=await DB.get('state');if(s&&s.trades){J=s;drawMarks();if(CFG.tab==='trades')renderSide()}
  if(M.live!=='ok')connect();if(CFG.hlAddr)hlSync(true)});

function renderAll(){renderTop();renderTf();renderSide();renderTick();legend(null);drawMarks();drawPosLines()}

/* ---------- 시작 ---------- */
(async()=>{
  await DB.open();
  const [s,c,h]=await Promise.all([DB.get('state'),DB.get('term'),DB.get('hl')]);
  if(s&&s.trades)J=s;
  if(c)CFG={...CFG,...c,watch:Array.isArray(c.watch)?c.watch:CFG.watch,events:Array.isArray(c.events)?c.events:[]};
  if(h)HL={...HL,fills:h.fills||[],sent:h.sent||[],last:h.last||0};
  if(!TF[CFG.tf])CFG.tf='1h';
  LANG=CFG.lang||(J&&J.settings&&J.settings.uiLang)||((navigator.language||'').toLowerCase().startsWith('ko')?'ko':'en');
  document.documentElement.lang=LANG;
  initChart();applyTheme();renderAll();
  const ok=await loadAllTickers();
  if(ok)CFG.watch=CFG.watch.filter(w=>M.all.some(x=>x.s===w));
  if(ok&&!M.all.some(x=>x.s===CFG.sym))CFG.sym='BTCUSDT';
  renderAll();connect();
  if(chart)await reloadChart();
  loadDeriv();
  if(CFG.hlAddr){hlSync(true);hlPositions()}
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
