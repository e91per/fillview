<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2E9D5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fillview">
<meta name="description" content="Fillview: free crypto charts with your own trades and journal built in.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>Fillview</title>
<style>
:root{
  --bg:#F2E9D5;--card:#F8F1E1;--ink:#2B2418;--acc:#7A5A2B;--acc-ink:#FBF4E3;--win:#2D6A3E;--loss:#A32D2A;--fs:15px;
  --font:"Pretendard Variable",Pretendard,"SF Pro Text","Roboto","SamsungOneUI","Noto Sans KR",system-ui,sans-serif;
  --mute:color-mix(in srgb,var(--ink) 56%,var(--bg));
  --line:color-mix(in srgb,var(--ink) 13%,var(--bg));
  --soft:color-mix(in srgb,var(--ink) 6%,var(--card));
  --railw:56px;--panelw:340px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.45}
body{display:flex;flex-direction:column;height:100svh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.win{color:var(--win)}.loss{color:var(--loss)}.mute{color:var(--mute)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 상단 */
header.tb{display:flex;align-items:center;gap:14px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:6}
.logo{font-size:1.15rem;font-weight:600;letter-spacing:-.03em;color:var(--ink);flex:none}
.logo i{font-style:normal;color:var(--loss)}
.symbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.38rem .7rem;flex:none;max-width:52vw}
.symbtn b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.symbtn span{font-size:.76rem;color:var(--mute);white-space:nowrap}
.exb{font-size:.66rem;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 .35rem;color:var(--mute)}
.mkt{display:flex;align-items:center;gap:18px;flex:1;min-width:0}
.price{flex:none;min-width:7rem}
.price b{display:block;font-size:1.32rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.price small{font-size:.76rem}
.stats{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.stats::-webkit-scrollbar{display:none}
.st{flex:none}
.st span{display:block;font-size:.7rem;color:var(--mute);white-space:nowrap}
.st b{display:block;font-size:.86rem;font-weight:600;white-space:nowrap}
.rng{display:flex;align-items:center;gap:6px;font-size:.76rem}
.rng .bar{position:relative;width:80px;height:2px;background:var(--line)}
.rng .bar i{position:absolute;top:-4px;width:2px;height:10px;background:var(--ink)}
.hright{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.disc{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.28rem .6rem;text-align:left;display:flex;gap:12px}
.disc div span{display:block;font-size:.66rem;color:var(--mute);white-space:nowrap}
.disc div b{font-size:.84rem;white-space:nowrap}
.disc .lim{height:3px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}
.disc .lim i{display:block;height:100%;background:var(--loss)}
.ib{border:1px solid transparent;background:none;border-radius:9px;padding:.35rem .5rem;color:var(--mute);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.82rem}
.ib:hover{border-color:var(--line);color:var(--ink)}

/* 봉 바 */
.tfbar{display:flex;align-items:center;gap:2px;padding:5px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.tfbar::-webkit-scrollbar{display:none}
.tfbar>button{border:0;background:none;border-radius:8px;padding:.32rem .6rem;font-weight:600;font-size:.85rem;color:var(--mute);flex:none;display:inline-flex;align-items:center;gap:6px}
.tfbar>button.on{background:var(--soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
.tfbar .sep{width:1px;height:18px;background:var(--line);margin:0 6px;flex:none}
.tfbar select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:.25rem .45rem;font-size:.82rem;flex:none;width:auto!important}
.tfbar .grow{flex:1}
.live{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--mute);flex:none;padding-right:2px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.live.ok i{background:var(--win)}.live.slow i{background:var(--acc)}.live.bad i{background:var(--loss)}

/* 본문 */
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto var(--railw);min-height:0}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.chartbox{position:relative;flex:1;min-height:300px}
#chart{position:absolute;inset:0}
.legend{position:absolute;left:12px;top:8px;z-index:2;font-size:.8rem;color:var(--mute);pointer-events:none}
.legend b{color:var(--ink);font-weight:600}
.msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:2rem;color:var(--mute);z-index:3}
.msg.on{display:grid}
.histbar{position:absolute;left:50%;transform:translateX(-50%);bottom:40px;z-index:3;display:none}
.histbar.on{display:block}
.pill{border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:.45rem 1rem;font-weight:600;font-size:.85rem}
.tpop{position:absolute;right:12px;top:10px;z-index:4;width:min(300px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:none;box-shadow:0 6px 24px color-mix(in srgb,var(--ink) 14%,transparent)}
.tpop.on{display:block}
.tpop h4{margin:0 0 4px;font-size:.95rem;display:flex;justify-content:space-between;gap:8px}
.tpop .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.8rem;margin:6px 0 10px}
.tpop .kv span{color:var(--mute)}
.tpop .kv b{text-align:right;font-weight:600}

/* Fillog 화면 */
.center{position:relative}
.logview{position:absolute;inset:0;display:none;background:var(--bg);z-index:6}
.logview iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
body.vlog .logview{display:block}
body.vlog .tfbar{display:none}

/* 거래란 */
.trade{display:flex;height:330px;flex:none;border-top:1px solid var(--line);background:var(--bg);min-height:0}
.trade.setup{display:block;overflow-y:auto}
.trade[hidden]{display:none}
.tscroll{overflow-y:auto;min-height:0}
.tform{width:320px;flex:none;border-right:1px solid var(--line);padding:10px 12px 0}
.tright{flex:1;display:flex;flex-direction:column;min-width:0}
.tright .tscroll{flex:1}
.ttabs{display:flex;align-items:center;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);flex:none}
.ttabs>button{border:0;background:none;padding:.5rem .7rem;font-weight:600;font-size:.84rem;color:var(--mute);box-shadow:inset 0 -2px 0 transparent}
.ttabs>button.on{color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
.ttabs .grow{flex:1}
.tfh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.tfh b{font-size:1.05rem}.tfh .mute{font-size:.74rem}.tfh .grow{flex:1;font-weight:700}
.trow{display:flex;gap:8px;margin-bottom:8px}
.trow2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.seg3{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;padding:3px;border-radius:10px;background:var(--soft);flex:1}
.seg3.w{display:grid;width:100%;margin-bottom:8px}
.seg3 button{border:0;background:transparent;border-radius:8px;padding:.38rem .5rem;font-weight:700;font-size:.82rem;color:var(--mute)}
.seg3 button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px color-mix(in srgb,var(--ink) 15%,transparent)}
.cf.lev{width:9.5rem;flex:none}
.cf.lev input{text-align:center}
.trade .cf{margin-bottom:6px}
.chips.tight{padding:0 0 4px;gap:4px}
.chips.tight .chip{padding:.18rem .55rem;font-size:.74rem}
.tinfo{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.76rem;color:var(--mute);min-height:1.1rem;margin:2px 0 4px}
.tinfo b{color:var(--ink);font-weight:700}
.tbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;position:sticky;bottom:0;background:var(--bg);padding:8px 0 4px;z-index:1}
.btn.tlong{background:var(--win);border-color:var(--win);color:#fff}
.btn.tshort{background:var(--loss);border-color:var(--loss);color:#fff}
.tlockmsg{margin-top:8px;font-size:.78rem;color:var(--loss);font-weight:600}
.tsetup{max-width:560px;padding:12px 14px 18px}
.tsetup h4{margin:0 0 6px;font-size:.98rem}
.tsetup ol{margin:0 0 6px;padding-left:1.2rem;font-size:.84rem;color:var(--mute)}
.tsetup ol li{margin:2px 0}
.tsetup a{color:var(--acc)}
.ordhead{font-weight:800;font-size:1.05rem}
.checks{border:1px solid var(--line);border-radius:12px;padding:6px 12px 10px;background:var(--card)}
.checks h5{margin:6px 0 2px;font-size:.86rem}
.checks .crow{font-size:.88rem;margin-top:8px}
.tiltbar{position:absolute;left:50%;transform:translateX(-50%);top:8px;z-index:5;display:none;align-items:center;gap:8px;background:var(--loss);color:#fff;border-radius:99px;padding:.3rem .45rem .3rem .9rem;font-size:.8rem;font-weight:600;max-width:calc(100% - 24px)}
.tiltbar.on{display:flex}
.tiltbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiltbar .ib{color:#fff;border-color:rgba(255,255,255,.5);font-size:.74rem;padding:.2rem .5rem}
.tiltbig{font-size:1.5rem;font-weight:800;margin:6px 0}
.rpbar{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;z-index:5;display:none;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:.25rem .5rem;box-shadow:0 6px 20px color-mix(in srgb,var(--ink) 15%,transparent);font-size:.8rem;white-space:nowrap}
.rpbar.on{display:flex}
.rpbar .ib{color:var(--ink);font-size:.86rem;padding:.3rem .55rem}
.rpbar .chip{padding:.15rem .55rem}
.shprev{display:flex;justify-content:center;background:var(--soft);border-radius:12px;padding:10px;margin-bottom:6px}
.shprev canvas{width:100%;max-width:300px;height:auto;border-radius:10px;box-shadow:0 6px 24px color-mix(in srgb,var(--ink) 20%,transparent)}

/* 계산기 */
.cbox{margin:8px 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.cbox h5{margin:0 0 6px;font-size:.88rem}
.cl{display:block;font-size:.76rem;font-weight:600;color:var(--mute);margin:10px 0 4px}
.cf{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.cf:focus-within{border-color:var(--acc)}
.cf input{border:0!important;background:transparent!important;flex:1;min-width:0;padding:.55rem .65rem!important;border-radius:0!important}
.cf input.solved{color:var(--acc);font-weight:700}
.cf .cu{padding:0 .65rem;font-size:.78rem;color:var(--mute);flex:none}
.cf .cb{border:0;background:none;color:var(--acc);font-weight:700;font-size:.76rem;padding:0 .5rem;flex:none}
.cf select.cu2,select.cu2{border:0!important;border-left:1px solid var(--line)!important;border-radius:0!important;background:transparent!important;width:auto!important;font-size:.78rem;padding:.4rem .5rem!important}
select.cu2{border:1px solid var(--line)!important;border-radius:8px!important}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border-radius:10px;background:var(--soft)}
.seg2 button{border:0;background:transparent;border-radius:8px;padding:.5rem;font-weight:700;color:var(--mute)}
.seg2 button.on.win{background:var(--win);color:#fff}
.seg2 button.on.loss{background:var(--loss);color:#fff}
.crow{display:flex;align-items:center;gap:8px;font-size:.82rem;margin:10px 0 0;flex-wrap:wrap}
.crow .mute{font-size:.74rem}
.cres .big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px}
.cres .big small{font-size:.78rem;font-weight:600;color:var(--mute)}
.arow{display:grid;grid-template-columns:1.2rem 1fr 1fr auto;gap:6px;align-items:center;margin-top:6px}
.arow input{padding:.45rem .55rem!important}

/* 오른쪽 패널 + 아이콘 줄 */
.spanel{width:0;overflow:hidden;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
.spanel.on{width:var(--panelw)}
.spanel>header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.spanel>header h3{margin:0;font-size:.95rem;flex:1}
.sbody{flex:1;overflow-y:auto;min-height:0;padding-bottom:16px}
nav.rail{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;background:var(--bg)}
nav.rail button{border:0;background:none;width:48px;padding:.5rem 0;border-radius:10px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:600}
nav.rail button.on{background:var(--soft);color:var(--ink)}
nav.rail .gap{flex:1}

/* 공통 목록 */
.row{display:flex;align-items:center;gap:10px;padding:.5rem 12px;border:0;background:none;width:100%;text-align:left}
button.row:hover{background:var(--soft)}
.row .l{flex:1;min-width:0}
.row .l b{display:block;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l span{display:block;font-size:.74rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:.86rem;flex:none}
.row .r span{display:block;font-size:.74rem}
.row.cur{background:var(--soft);box-shadow:inset 2px 0 0 var(--acc)}
.grp{display:flex;align-items:center;gap:6px;padding:.55rem 12px .35rem;font-size:.76rem;font-weight:700;color:var(--mute);border:0;background:none;width:100%;text-align:left}
.grp i{font-style:normal;font-weight:500}
.star{border:0;background:none;color:var(--mute);padding:.15rem .3rem;font-size:1rem;flex:none}
.star.on{color:var(--acc)}
.box{margin:8px 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.box p{margin:0 0 8px;font-size:.84rem;color:var(--mute)}
.box h5{margin:0 0 6px;font-size:.88rem}
.kv2{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:.84rem}
.kv2 span{color:var(--mute)}
.kv2 b{text-align:right;font-weight:600}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:.5rem .85rem;font-weight:600;font-size:.85rem}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:.3rem .6rem;font-size:.78rem}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap}
input[type=checkbox]{width:auto;margin:0;accent-color:var(--acc)}
input:not([type=checkbox]):not([type=color]):not([type=range]),select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem;background:var(--card);outline:none}
input[type=color]{width:2.6rem;height:2rem;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:2px}
input[type=range]{width:100%;accent-color:var(--acc)}
input:focus,select:focus{border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:.25rem .7rem;font-size:.78rem;font-weight:600;color:var(--mute)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.empty{padding:1.2rem 12px;color:var(--mute);font-size:.85rem}
.soon{margin:12px;padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);font-size:.86rem}
.soon b{display:block;color:var(--ink);margin-bottom:4px}
.soon ul{margin:.4rem 0 0;padding-left:1.1rem}
.h{font-size:.74rem;color:var(--mute);padding:.7rem 12px .2rem;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.tbl td,.tbl th{padding:.32rem 12px;text-align:right;white-space:nowrap}
.tbl th{color:var(--mute);font-weight:600;font-size:.72rem}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--soft)}
.ob{font-size:.76rem}
.ob .lv{display:grid;grid-template-columns:5.6rem 1fr 4.6rem;align-items:center;gap:6px;padding:1px 12px}
.ob .lv .bars{display:flex;height:12px;border-radius:2px;overflow:hidden}
.ob .lv .bars i{display:block;height:100%}
.ob .mid{padding:6px 12px;font-weight:700;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:3px 0;display:flex;justify-content:space-between}
.legend2{display:flex;gap:10px;flex-wrap:wrap;padding:4px 12px 8px;font-size:.72rem;color:var(--mute)}
.legend2 i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* 하단 띠 */
footer.tick{display:flex;align-items:center;gap:18px;padding:5px 12px calc(5px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:.78rem;overflow-x:auto;scrollbar-width:none;white-space:nowrap;background:var(--bg)}
footer.tick::-webkit-scrollbar{display:none}
footer.tick button{border:0;background:none;padding:0;font-size:.78rem}
footer.tick .clk{margin-left:auto;color:var(--mute)}
footer.tick a{color:var(--mute)}

/* 창 */
.dim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);z-index:30;display:none;align-items:flex-start;justify-content:center;padding:calc(30px + env(safe-area-inset-top)) 12px 12px}
.dim.on{display:flex}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;max-height:86svh;display:flex;flex-direction:column;overflow:hidden}
.sheet>header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet>header h3{margin:0;font-size:1rem;flex:1}
.sheet .sb{overflow-y:auto;padding:4px 0 14px}
.set h4{margin:0;padding:14px 14px 4px;font-size:.84rem}
.set .it{padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.set .it>label{flex:1;min-width:9rem;font-size:.86rem}
.set .it>label small{display:block;color:var(--mute);font-size:.74rem}
.set .it .ctl{flex:none;max-width:100%}
.set .it .ctl.w{flex:1 1 100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:.35rem .65rem;font-weight:600;font-size:.8rem;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.sw{position:relative;display:inline-block;vertical-align:middle;width:42px;height:24px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:color-mix(in srgb,var(--ink) 22%,var(--bg));pointer-events:none;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--card);transition:transform .15s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{transform:translateX(18px)}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:12px;font-size:.86rem;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}

@media (max-width:899px){
  header.tb{flex-wrap:wrap;gap:8px 10px}
  .mkt{order:5;flex-basis:100%;gap:14px}
  header.tb{gap:8px 8px;flex-wrap:wrap}

<script>
'use strict';
/* =========================================================
   Fillview v2 — 서버 없이 동작하는 차트 + Fillog 일지 통합
   ========================================================= */

/* ---------- 순수 계산 (테스트 가능) ---------- */
const Core=(()=>{
  const pad=n=>String(n).padStart(2,'0');
  const QUOTE=/(USDT|USDC|BUSD|FDUSD|USD)$/;
  const baseOf=s=>{let x=String(s||'').toUpperCase();if(x.includes(':'))x=x.split(':').pop();
    x=x.replace(/\.P$/,'').replace(/PERP(ETUAL)?/g,'').replace(/[\s/_-]/g,'');const y=x.replace(QUOTE,'');return y||x};
  const coreBase=b=>String(b||'').toUpperCase().replace(/^(1000000|1000|1M|K)(?=[A-Z])/,'');
  const TF={'1m':6e4,'5m':3e5,'15m':9e5,'1h':36e5,'4h':144e5,'1d':864e5,'1w':6048e5};
  const barFloor=(ms,tf)=>{const d=TF[tf];if(tf==='1w'){const o=4*864e5;return Math.floor((ms-o)/d)*d+o}return Math.floor(ms/d)*d};
  const pickTf=h=>h<2*36e5?'5m':h<12*36e5?'15m':h<2*864e5?'1h':h<10*864e5?'4h':'1d';
  const decimals=p=>p>=1e4?1:p>=100?2:p>=10?3:p>=1?4:p>=.1?5:p>=.01?6:7;
  const fmtP=p=>p==null||!isFinite(p)?'–':Number(p).toLocaleString('en-US',{minimumFractionDigits:decimals(Math.abs(p)),maximumFractionDigits:decimals(Math.abs(p))});
  const compact=n=>{if(n==null||!isFinite(n))return '–';const a=Math.abs(n);
    return a>=1e9?(n/1e9).toFixed(2)+'B':a>=1e6?(n/1e6).toFixed(2)+'M':a>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(2)};
  const countdown=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
  const plainCoin=c=>/^[A-Z0-9]+$/i.test(String(c||''))&&!String(c).startsWith('@');
  const niceStep=x=>{if(!(x>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(x))),f=x/e;return (f<1.5?1:f<2.25?2:f<3.5?2.5:f<7.5?5:10)*e};

  /* 미국 동부 시각 → UTC ms (서머타임: 3월 둘째 일요일 ~ 11월 첫째 일요일) */
  function nthSunday(y,m,n){const d=new Date(Date.UTC(y,m,1));const first=(7-d.getUTCDay())%7+1;return first+7*(n-1)}
  function etToUtc(date,time){const [y,mo,d]=date.split('-').map(Number),[h,mi]=time.split(':').map(Number);
    const s=Date.UTC(y,2,nthSunday(y,2,2),2),e=Date.UTC(y,10,nthSunday(y,10,1),2),loc=Date.UTC(y,mo-1,d,h,mi);
    const dst=loc>=s&&loc<e;return loc+(dst?4:5)*36e5}

  /* 하이퍼리퀴드 체결을 0→0 매매 단위로 묶기 */
  function hlGroups(fills){
    const EPS=1e-8,by={};let skipped=0;
    (fills||[]).forEach(f=>{if(!plainCoin(f.coin)){skipped++;return}(by[f.coin]=by[f.coin]||[]).push(f)});
    const closed=[];let open=0,partial=0,flips=0;
    Object.keys(by).forEach(coin=>{
      const arr=by[coin].slice().sort((a,b)=>a.time-b.time||(a.tid||0)-(b.tid||0));let cur=null;
      arr.forEach(f=>{const sz=+f.sz,d=f.side==='B'?1:-1,st=+f.startPosition,end=st+d*sz;
        if(Math.abs(st)<EPS)cur=[f];else if(cur)cur.push(f);else{partial++;return}
        if(Math.abs(end)<EPS){closed.push({coin,fills:cur});cur=null}
        else if(Math.abs(st)>=EPS&&Math.sign(end)!==Math.sign(st)){closed.push({coin,fills:cur,flip:true});cur=null;flips++}});
      if(cur)open++});
    closed.sort((a,b)=>a.fills[0].time-b.fills[0].time);
    return{closed,open,partial,flips,skipped}}
  function toFillog(groups){const fills=[];
    groups.forEach(g=>g.fills.forEach(f=>fills.push({time:f.time,symbol:g.coin+'USDT',side:f.side==='B'?'buy':'sell',
      price:+f.px,qty:+f.sz,fee:Math.abs(+f.fee||0),feeAsset:f.feeToken||'USDC',pnl:+f.closedPnl||0,id:String(f.tid??'')})));
    return JSON.stringify({fillog:1,exchange:'Hyperliquid',timezone:'UTC',fills})}

  /* 호가 묶기: 거래소별 [가격, 수량(코인)] → 구간별 금액 */
  function bucketBook(books,mid,step,range){
    const lo=mid*(1-range/100),hi=mid*(1+range/100),B=new Map(),A=new Map();
    Object.entries(books).forEach(([ex,b])=>{if(!b)return;
      (b.bids||[]).forEach(([p,q])=>{if(p<lo||p>mid)return;const k=Math.floor(p/step)*step;const e=B.get(k)||{};e[ex]=(e[ex]||0)+p*q;B.set(k,e)});
      (b.asks||[]).forEach(([p,q])=>{if(p>hi||p<mid)return;const k=Math.ceil(p/step)*step;const e=A.get(k)||{};e[ex]=(e[ex]||0)+p*q;A.set(k,e)})});
    const tot=e=>Object.values(e).reduce((s,x)=>s+x,0);
    const bids=[...B.entries()].map(([p,e])=>({p,e,t:tot(e)})).sort((a,b)=>b.p-a.p);
    const asks=[...A.entries()].map(([p,e])=>({p,e,t:tot(e)})).sort((a,b)=>a.p-b.p);
    return{bids,asks,bidSum:bids.reduce((s,x)=>s+x.t,0),askSum:asks.reduce((s,x)=>s+x.t,0)}}

  /* 매매 → 차트 그림 재료 (상자 + 기호) */
  function tradeShapes(trades,base){
    const out=[];
    (trades||[]).forEach(t=>{if(t.settle||!t.symbol||coreBase(baseOf(t.symbol))!==coreBase(base))return;
      const fl=(t.fills||[]).filter(f=>f.time!=null&&f.price!=null);if(!t.openTime&&!fl.length)return;
      const o=t.openTime||fl[0].time,c=t.closeTime||fl[fl.length-1].time;
      out.push({id:t.id,o,c,pe:t.avgEntry!=null?+t.avgEntry:(fl.find(f=>f.kind==='open')||{}).price,px:t.avgExit!=null?+t.avgExit:null,pnl:+t.pnl||0,side:t.side,
        steps:fl.map(f=>({t:f.time,p:+f.price,k:f.kind||'',dir:f.dir}))})});
    return out}

  return{pad,baseOf,coreBase,TF,barFloor,pickTf,decimals,fmtP,compact,countdown,plainCoin,niceStep,etToUtc,hlGroups,toFillog,bucketBook,tradeShapes}})();
/* ---------- 순수 계산 끝 ---------- */

function mix(a,b,w){const x=/^#?([0-9a-f]{6})$/i.exec(a),y=/^#?([0-9a-f]{6})$/i.exec(b);if(!x||!y)return a;

    ws.onmessage=e=>{if(g!==gen)return;last=Date.now();let m;try{m=JSON.parse(e.data)}catch(_){return}onmsg(m)};
    ws.onclose=()=>{if(g!==gen)return;st.ok=false;updLive();tries++;setTimeout(()=>{if(g===gen)open()},Math.min(30000,1500*tries))};
    ws.onerror=()=>{}}

/* 시각 → 화면 좌표 */
function xOf(ms){if(!chart||!lastK.length)return null;const d=TF[CFG.tf],bt=barFloor(ms,CFG.tf);
  let i=idxMap.get(bt);if(i==null)i=(bt-M.first)/d;return chart.timeScale().logicalToCoordinate(i)}
const yOf=p=>p==null||!candle?null:candle.priceToCoordinate(p);

/* 차트 위 그림: 경제 일정선, 매매 상자, 체결 기호 */
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawOverlay(ctx,size){
  const p=pal(),s=S_(),W=size.width,H=size.height,font=getComputedStyle(document.body).fontFamily;HITS=[];const LIM=RP.on&&RP.full&&RP.i?RP.full[RP.i-1].t+TF[CFG.tf]:Infinity;
  /* 경제 일정 */
  if(s.evShow){const evs=visibleEvents().filter(e=>e.ms>=M.first-TF[CFG.tf]*2);let rows=[];
    ctx.font='600 11px '+font;
    evs.forEach(e=>{const x=xOf(e.ms);if(x==null||x<0||x>W)return;
      ctx.save();ctx.strokeStyle=hexA(p.acc,'99');ctx.setLineDash([3,4]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,H);ctx.stroke();ctx.restore();
      if(!s.evLabel)return;const txt=evShort(e)+' '+fmtHM(e.ms),tw=ctx.measureText(txt).width+14;
      let r=0;while(rows[r]!=null&&rows[r]>x-tw/2-4)r++;rows[r]=x+tw/2;const y=H-24-r*24;
      rrect(ctx,x-tw/2,y,tw,19,6);ctx.fillStyle=p.card;ctx.fill();ctx.strokeStyle=hexA(p.acc,'cc');ctx.setLineDash([]);ctx.stroke();
      ctx.fillStyle=p.ink;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y+10)})}
  if(s.marks==='off')return;
  const base=curBase(),shapes=Core.tradeShapes((J&&J.trades)||[],base),showBox=s.marks!=='sym',showSym=s.marks!=='box';
  shapes.forEach(t=>{if(t.o>=LIM)return;const open=t.c>=LIM;if(open){t={...t,c:LIM-1,px:null,steps:t.steps.filter(z=>z.t<LIM)}}const x1=xOf(t.o),x2=xOf(t.c);if(x1==null||x2==null)return;if(x2<-20||x1>W+20)return;
    const ya=yOf(t.pe),yb=yOf(t.px!=null?t.px:t.pe),sel=SEL===t.id,col=t.pnl>=0?p.win:p.loss;
    if(showBox&&ya!=null&&yb!=null){const L0=Math.min(x1,x2)-3,R=Math.max(x1,x2)+3,T=Math.min(ya,yb),B=Math.max(ya,yb),h=Math.max(4,B-T);
      ctx.fillStyle=hexA(col,sel?'38':'1c');ctx.fillRect(L0,T,R-L0,h);ctx.strokeStyle=hexA(col,sel?'ff':'88');ctx.lineWidth=sel?1.6:1;ctx.setLineDash([]);ctx.strokeRect(L0+.5,T+.5,R-L0-1,h-1);
      if(s.pnlLabel&&!open){ctx.font='700 10.5px '+font;ctx.fillStyle=col;ctx.textAlign='left';ctx.textBaseline='bottom';
        ctx.fillText((t.pnl>=0?'+':'')+t.pnl.toFixed(t.pnl>=1000||t.pnl<=-1000?0:2),R+3,T-1)}
      HITS.push({id:t.id,x1:L0-4,x2:R+4,y1:T-6,y2:T+h+6})}
    else HITS.push({id:t.id,x1:Math.min(x1,x2)-6,x2:Math.max(x1,x2)+6,y1:0,y2:H});
    if(showSym)t.steps.forEach(st=>{const x=xOf(st.t),y=yOf(st.p);if(x==null||y==null)return;
      const c=st.k==='close'?col:st.dir>0?p.win:p.loss;drawSym(ctx,st.k,st.dir,x,y,c,p.card,sel)})});
  /* 아직 일지로 안 보낸 하이퍼리퀴드 체결 */
  if(s.hlMarks&&showSym){const sent=new Set(HL.sent);HL.fills.forEach(f=>{if(sent.has(String(f.tid))||coreBase(f.coin)!==base||f.time>=LIM)return;
    const x=xOf(f.time),y=yOf(+f.px);if(x==null||y==null||x<0||x>W)return;const dir=f.side==='B'?1:-1,k=/^open/i.test(f.dir)?'open':/^close/i.test(f.dir)?'reduce':'add';
    drawSym(ctx,k,dir,x,y,dir>0?p.win:p.loss,p.card,false,true)})}}
function drawSym(ctx,k,dir,x,y,col,bg,sel,ghost){const r=sel?5.5:4.5;ctx.save();ctx.globalAlpha=ghost?.55:1;ctx.lineWidth=1.4;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.beginPath();
  if(k==='open'){if(dir>0){ctx.moveTo(x,y-r-1);ctx.lineTo(x+r+1,y+r);ctx.lineTo(x-r-1,y+r)}else{ctx.moveTo(x,y+r+1);ctx.lineTo(x+r+1,y-r);ctx.lineTo(x-r-1,y-r)}ctx.closePath();ctx.fill();ctx.strokeStyle=bg;ctx.lineWidth=1;ctx.stroke()}
  else if(k==='add'){ctx.arc(x,y,r-1,0,Math.PI*2);ctx.fill();ctx.strokeStyle=bg;ctx.lineWidth=1;ctx.stroke()}
  else if(k==='reduce'){ctx.arc(x,y,r-.5,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();ctx.stroke()}
  else{ctx.rect(x-r,y-r,r*2,r*2);ctx.fill();ctx.strokeStyle=bg;ctx.lineWidth=1;ctx.stroke()}
  ctx.restore()}

async function focusTrade(id){J=(await DB.get('state'))||J;const t=findTrade(id);if(!t){toast(L('매매를 찾지 못했어요','Trade not found'));return}

/* 차트 캡처 */
async function snapChart(){if(!chart||!chart.takeScreenshot)return null;
  const cv=chart.takeScreenshot(),p=pal(),W=cv.width,H=cv.height,k=Math.min(1,1600/W),w=Math.round(W*k),h=Math.round(H*k),fh=Math.max(26,Math.round(w*.028));
  const c=document.createElement('canvas');c.width=w;c.height=h+fh;const x=c.getContext('2d');
  x.fillStyle=p.card;x.fillRect(0,0,w,h+fh);x.drawImage(cv,0,0,w,h);
  x.fillStyle=p.ink;x.font='600 '+Math.round(fh*.46)+'px '+getComputedStyle(document.body).fontFamily;x.textBaseline='middle';
  x.fillText(symName(CFG.sym)+' '+quoteLabel(CFG.sym)+' · '+TFL()[CFG.tf]+' · '+fmtDT(Date.now())+' '+tzLabel(),12,h+fh/2);

async function snapTo(target,quiet){const url=await snapChart();if(!url){toast(L('캡처하지 못했어요','Could not capture'));return}

/* 종합 호가 */
const OBC={BN:'#D4A62A',BY:'#E07B39',OK:'#8A8F98',HL:'#3FB8A8'},OBN={BN:'Binance',BY:'Bybit',OK:'OKX',HL:'Hyperliquid'},OKCT={};
let bookT=null,bookBusy=false;
function bookLoop(){clearInterval(bookT);if(CFG.panel&&CFG.rail==='book'){fetchBooks();bookT=setInterval(()=>{if(!document.hidden)fetchBooks()},3000)}}
async function fetchBooks(){if(bookBusy)return;bookBusy=true;const b=curBase(),ex=S_().obEx,out={},st={},ref=(tick(CFG.sym)||{}).c,rg=+S_().obRange;
  const bk=bnKeyFor(b),bsym=bk?parseKey(bk).id:b+'USDT',jobs=[];
  const conv=a=>(a||[]).map(x=>[+x[0],+x[1]]);
  if(ex.BN&&bk)jobs.push(getJ(BN+'/fapi/v1/depth?symbol='+bsym+'&limit=500').then(r=>{out.BN={bids:conv(r.bids),asks:conv(r.asks)}}).catch(()=>{st.BN=1}));
  if(ex.BY)jobs.push(getJ('https://api.bybit.com/v5/market/orderbook?category=linear&symbol='+bsym+'&limit=200').then(r=>{if(!r.result||!r.result.b)throw 0;out.BY={bids:conv(r.result.b),asks:conv(r.result.a)}}).catch(()=>{st.BY=1}));
  if(ex.OK){const inst=b+'-USDT-SWAP';jobs.push((async()=>{if(OKCT[inst]==null){const r=await getJ('https://www.okx.com/api/v5/public/instruments?instType=SWAP&instId='+inst);OKCT[inst]=+r.data[0].ctVal}
    const r=await getJ('https://www.okx.com/api/v5/market/books?instId='+inst+'&sz=400'),d=r.data[0],k=OKCT[inst];
    out.OK={bids:d.bids.map(x=>[+x[0],+x[1]*k]),asks:d.asks.map(x=>[+x[0],+x[1]*k])}})().catch(()=>{st.OK=1}))}
  const hc=cur().ex==='HL'?cur().id:(hlKeyFor(b)||'').slice(3);
  if(ex.HL&&hc&&ref){const nsig=Math.max(2,Math.min(5,Math.floor(Math.log10(ref))+1-Math.floor(Math.log10(ref*rg/100/15))));
    jobs.push(hlPost({type:'l2Book',coin:hc,nSigFigs:nsig}).then(r=>{const [bd,as]=r.levels;out.HL={bids:bd.map(x=>[+x.px,+x.sz]),asks:as.map(x=>[+x.px,+x.sz])}}).catch(()=>{st.HL=1}))}
  await Promise.all(jobs);
  /* 가격 단위가 다른 거래소(예: 1000PEPE vs PEPE)는 빼요 */
  const mids={};Object.entries(out).forEach(([k,v])=>{if(v.bids[0]&&v.asks[0])mids[k]=(v.bids[0][0]+v.asks[0][0])/2});
  const ms=Object.values(mids).sort((a,b)=>a-b),med=ms.length?ms[Math.floor(ms.length/2)]:ref;
  Object.keys(out).forEach(k=>{if(!mids[k]||Math.abs(mids[k]/med-1)>.02){delete out[k];st[k]=2}});
  M.book={out,st,mid:med};M.bookSt=st;bookBusy=false;if(CFG.panel&&CFG.rail==='book')renderBook()}
function renderBook(){const P=$('#sbody'),s=S_(),bk=M.book;
  let h=`<div class="chips">${[.5,1,2,5].map(v=>`<button class="chip ${+s.obRange===v?'on':''}" data-obr="${v}">±${v}%</button>`).join('')}</div>
    <div class="chips" style="padding-top:0">${Object.keys(OBN).map(k=>`<button class="chip ${s.obEx[k]?'on':''}" data-obex="${k}">${OBN[k]}${bk&&bk.st[k]===1?' ✕':bk&&bk.st[k]===2?' ≠':''}</button>`).join('')}</div>`;
  if(!bk||!bk.mid){P.innerHTML=h+`<div class="empty">${L('호가를 불러오는 중이에요…','Loading order books…')}</div>`;return}
  const step=+s.obStep>0?+s.obStep:niceStep(bk.mid*s.obRange/100/14),r=Core.bucketBook(bk.out,bk.mid,step,+s.obRange);
  const max=Math.max(1,...r.bids.map(x=>x.t),...r.asks.map(x=>x.t)),exs=Object.keys(bk.out);
  const lv=(x,side)=>`<div class="lv num"><span class="${side}">${fmtP(x.p)}</span><div class="bars" style="width:${(x.t/max*100).toFixed(1)}%">${exs.map(e=>x.e[e]?`<i style="width:${(x.e[e]/x.t*100).toFixed(1)}%;background:${OBC[e]}"></i>`:'').join('')}</div><span style="text-align:right">$${compact(x.t)}</span></div>`;
  const imb=r.bidSum+r.askSum?(r.bidSum-r.askSum)/(r.bidSum+r.askSum)*100:0;
  h+=`<div class="legend2">${exs.map(e=>`<span><i style="background:${OBC[e]}"></i>${OBN[e]}</span>`).join('')}<span>${L('묶음','Step')} ${fmtP(step)}</span></div>`;
  h+=`<div class="ob">${r.asks.slice(0,16).reverse().map(x=>lv(x,'loss')).join('')}
    <div class="mid"><span class="num">${fmtP(bk.mid)}</span><span class="num ${imb>=0?'win':'loss'}">${L('매수','Bids')} $${compact(r.bidSum)} · ${L('매도','Asks')} $${compact(r.askSum)} (${imb>=0?'+':''}${imb.toFixed(1)}%)</span></div>
    ${r.bids.slice(0,16).map(x=>lv(x,'win')).join('')}</div>`;
  const walls=(a,side)=>a.slice().sort((x,y)=>y.t-x.t).slice(0,3).map(x=>`<span>${fmtP(x.p)} <b class="num ${side}">$${compact(x.t)}</b></span>`).join(' · ');
  h+=`<div class="box"><h5>${L('큰 벽','Largest walls')}</h5><p style="margin:0">${L('매도','Asks')}: ${walls(r.asks,'loss')||'–'}</p><p style="margin:4px 0 0">${L('매수','Bids')}: ${walls(r.bids,'win')||'–'}</p></div>`;
  h+=`<p class="mute" style="font-size:.74rem;padding:0 12px">${L('✕ 연결 안 됨, ≠ 가격 단위가 달라 제외. 브라우저에서 막히는 거래소는 추후 서버로 연결해요.','✕ unreachable, ≠ excluded (different price unit). Blocked venues will be connected via a server later.')}</p>`;
  P.innerHTML=h}

  try{let start=HL.last?HL.last+1:0,added=0,guard=0;const seen=new Set(HL.fills.map(f=>String(f.tid)));
    while(guard++<10){const arr=await hlPost({type:'userFillsByTime',user,startTime:start,aggregateByTime:false});if(!Array.isArray(arr)||!arr.length)break;
      arr.forEach(f=>{const k=String(f.tid);if(!seen.has(k)){seen.add(k);HL.fills.push(f);added++}});
      const mx=Math.max(...arr.map(f=>f.time));HL.last=Math.max(HL.last,mx);if(arr.length<2000)break;start=mx+1}

/* PNL: 네 칸 중 비어 있는 한 칸을 계산 (순수 함수, 테스트 가능) */
function solvePnl(o){const dir=o.side==='short'?-1:1,f=o.fee?o.feeRate/100:0,lev=o.lev>0?o.lev:NaN;
  const ks=['entry','close','qty','pnl'],empty=ks.filter(k=>!(isFinite(o[k])));
  if(empty.length!==1)return{err:empty.length?'need3':'leaveOne'};
  const miss=empty[0];let {entry:e,close:c,qty:v,pnl:P}=o,q,N;
  const toN=val=>o.unit==='margin'?val*lev:val;
  if(o.unit==='margin'&&!(lev>0))return{err:'lev'};
  if(miss==='entry'){if(o.unit==='coin'){q=v;e=(q*c*(dir-f)-P)/(q*(dir+f))}else{N=toN(v);e=c*N*(dir-f)/(P+N*(dir+f));q=N/e}}
  else{q=o.unit==='coin'?v:toN(v)/e}
  if(miss==='close')c=(P+q*e*(dir+f))/(q*(dir-f));
  if(miss==='qty'){const den=dir*(c-e)-f*(e+c);if(!den)return{err:'qty'};q=P/den;if(!(q>0))return{err:'qty'}}
  if(miss==='pnl')P=q*dir*(c-e)-f*q*(e+c);
  if(!(e>0)||!(c>0)||!(q>0)||!isFinite(P))return{err:'bad'};
  N=q*e;const margin=lev>0?N/lev:NaN,fees=(o.feeRate/100)*q*(e+c),mmr=.005;
  const liq=lev>0?(dir>0?e*(1-1/lev+mmr):e*(1+1/lev-mmr)):NaN;
  const outQty=o.unit==='coin'?q:o.unit==='notional'?N:margin;
  return{miss,entry:e,close:c,qty:outQty,coin:q,pnl:P,notional:N,margin,roe:margin>0?P/margin*100:NaN,move:(c-e)/e*100,fees,feeIn:!!o.fee,liq}}
/* 평균 진입가 */
function solveAvg(o){const rows=o.rows.map(r=>({p:cnum(r.p),v:cnum(r.q)})).filter(r=>r.p>0&&r.v>0).map(r=>({p:r.p,q:o.unit==='coin'?r.v:r.v/r.p}));
  if(!rows.length)return null;const Q=rows.reduce((s,r)=>s+r.q,0),N=rows.reduce((s,r)=>s+r.p*r.q,0),A=N/Q,dir=o.side==='short'?-1:1;
  const out={n:rows.length,avg:A,qty:Q,notional:N};
  const cur=cnum(o.cur);if(cur>0){out.cur=cur;out.upnl=dir*(cur-A)*Q;out.upct=dir*(cur-A)/A*100}
  const T=cnum(o.tgt),p=cnum(o.addp);
  if(T>0&&p>0){if(p===T||(T-A)*(p-T)<=0)out.tgtErr=true;else{const x=Q*(T-A)/(p-T);if(x>0){out.addQ=x;out.addN=x*p}else out.tgtErr=true}}
  return out}

/* ---------- 주문 서명 (외부 라이브러리 없이: Keccak-256, secp256k1, EIP-712, msgpack) ---------- */
const HC=(()=>{
  const enc=new TextEncoder();
  const hex=b=>Array.from(b,x=>x.toString(16).padStart(2,'0')).join('');
  const unhex=h=>{h=String(h).replace(/^0x/i,'');if(h.length%2)h='0'+h;const o=new Uint8Array(h.length/2);for(let i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o};
  const concat=(...a)=>{const n=a.reduce((s,x)=>s+x.length,0),o=new Uint8Array(n);let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o};
  const b2n=b=>BigInt('0x'+(hex(b)||'0'));
  const n2b=(n,len=32)=>unhex(n.toString(16).padStart(len*2,'0'));

  /* Keccak-f[1600] (64비트 칸을 32비트 두 개로 다뤄요) */
  const RC=[1,0,32898,0,32906,2147483648,2147516416,2147483648,32907,0,2147483649,0,2147516545,2147483648,32777,2147483648,138,0,136,0,2147516425,0,2147483658,0,2147516555,0,139,2147483648,32905,2147483648,32771,2147483648,32770,2147483648,128,2147483648,32778,0,2147483658,2147483648,2147516545,2147483648,32896,2147483648,2147483649,0,2147516424,2147483648];
  const ROT=[0,1,62,28,27,36,44,6,55,20,3,10,43,25,39,41,45,15,21,8,18,2,61,56,14];
  function keccakF(s){const B=new Uint32Array(50),C=new Uint32Array(10);
    for(let r=0;r<24;r++){
      for(let x=0;x<5;x++){C[x*2]=s[x*2]^s[x*2+10]^s[x*2+20]^s[x*2+30]^s[x*2+40];C[x*2+1]=s[x*2+1]^s[x*2+11]^s[x*2+21]^s[x*2+31]^s[x*2+41]}
      for(let x=0;x<5;x++){const x1=(x+1)%5,x4=(x+4)%5,lo=C[x1*2],hi=C[x1*2+1];
        const dl=C[x4*2]^((lo<<1)|(hi>>>31)),dh=C[x4*2+1]^((hi<<1)|(lo>>>31));
        for(let y=0;y<5;y++){s[(x+5*y)*2]^=dl;s[(x+5*y)*2+1]^=dh}}
      for(let x=0;x<5;x++)for(let y=0;y<5;y++){const i=x+5*y,n=ROT[i],lo=s[i*2],hi=s[i*2+1],j=y+5*((2*x+3*y)%5);let rl,rh;
        if(n===0){rl=lo;rh=hi}else if(n<32){rl=(lo<<n)|(hi>>>(32-n));rh=(hi<<n)|(lo>>>(32-n))}else if(n===32){rl=hi;rh=lo}else{const m=n-32;rl=(hi<<m)|(lo>>>(32-m));rh=(lo<<m)|(hi>>>(32-m))}
        B[j*2]=rl;B[j*2+1]=rh}
      for(let x=0;x<5;x++)for(let y=0;y<5;y++){const i=x+5*y,a=((x+1)%5)+5*y,b=((x+2)%5)+5*y;s[i*2]=B[i*2]^(~B[a*2]&B[b*2]);s[i*2+1]=B[i*2+1]^(~B[a*2+1]&B[b*2+1])}
      s[0]^=RC[r*2];s[1]^=RC[r*2+1]}}
  function sponge(msg,pad){const rate=136,s=new Uint32Array(50),n=Math.floor(msg.length/rate)+1,buf=new Uint8Array(n*rate);
    buf.set(msg);buf[msg.length]^=pad;buf[buf.length-1]^=0x80;
    for(let b=0;b<n;b++){for(let i=0;i<rate/4;i++){const o=b*rate+i*4;s[i]^=buf[o]|(buf[o+1]<<8)|(buf[o+2]<<16)|(buf[o+3]<<24)}keccakF(s)}
    const out=new Uint8Array(32);for(let i=0;i<8;i++){const v=s[i];out[i*4]=v&255;out[i*4+1]=(v>>>8)&255;out[i*4+2]=(v>>>16)&255;out[i*4+3]=(v>>>24)&255}return out}
  const keccak256=m=>sponge(typeof m==='string'?enc.encode(m):m,0x01);
  const sha3_256=m=>sponge(typeof m==='string'?enc.encode(m):m,0x06);

  /* secp256k1 */
  const P=2n**256n-2n**32n-977n,N=BigInt('0xfffffffffffffffffffffffffffffffebaaedce6af48a03bbfd25e8cd0364141');
  const G=[BigInt('0x79be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798'),BigInt('0x483ada7726a3c4655da4fbfc0e1108a8fd17b448a68554199c47d08ffb10d4b8')];
  const mod=(a,m=P)=>{const r=a%m;return r>=0n?r:r+m};
  const inv=(a,m=P)=>{let [x,y,u,v]=[0n,1n,mod(a,m),m];let [x0,x1]=[1n,0n];let [aa,bb]=[mod(a,m),m];
    while(bb){const q=aa/bb;[aa,bb]=[bb,aa-q*bb];[x0,x1]=[x1,x0-q*x1]}return mod(x0,m)};
  function padd(p,q){if(!p)return q;if(!q)return p;const [x1,y1]=p,[x2,y2]=q;
    if(x1===x2){if(mod(y1+y2)===0n)return null;const l=mod(3n*x1*x1*inv(2n*y1));const x3=mod(l*l-2n*x1);return[x3,mod(l*(x1-x3)-y1)]}
    const l=mod((y2-y1)*inv(x2-x1));const x3=mod(l*l-x1-x2);return[x3,mod(l*(x1-x3)-y1)]}
  function pmul(k,p=G){let r=null,a=p;while(k>0n){if(k&1n)r=padd(r,a);a=padd(a,a);k>>=1n}return r}
  const pubOf=priv=>pmul(b2n(priv));
  const addressOf=priv=>{const [x,y]=pubOf(priv);return '0x'+hex(keccak256(concat(n2b(x),n2b(y))).slice(12))};
  async function hmac(key,data){const k=await crypto.subtle.importKey('raw',key,{name:'HMAC',hash:'SHA-256'},false,['sign']);return new Uint8Array(await crypto.subtle.sign('HMAC',k,data))}
  async function rfc6979(priv,h){let V=new Uint8Array(32).fill(1),K=new Uint8Array(32);const x=n2b(b2n(priv)),hm=n2b(b2n(h)%N);
    K=await hmac(K,concat(V,new Uint8Array([0]),x,hm));V=await hmac(K,V);K=await hmac(K,concat(V,new Uint8Array([1]),x,hm));V=await hmac(K,V);
    for(;;){V=await hmac(K,V);const k=b2n(V);if(k>0n&&k<N)return k;K=await hmac(K,concat(V,new Uint8Array([0])));V=await hmac(K,V)}}
  async function sign(h,priv){const d=b2n(priv),z=b2n(h);if(!(d>0n&&d<N))throw new Error('bad key');
    const k=await rfc6979(priv,h),R=pmul(k),r=mod(R[0],N);let s=mod(inv(k,N)*(z+r*d),N);let rec=Number(R[1]&1n)|(R[0]>=N?2:0);
    if(s>N/2n){s=N-s;rec^=1}return{r:'0x'+r.toString(16).padStart(64,'0'),s:'0x'+s.toString(16).padStart(64,'0'),v:27+rec}}
  function recover(h,sig){const r=b2n(unhex(sig.r)),s=b2n(unhex(sig.s)),rec=sig.v-27,x=r+(rec&2?N:0n);
    const y2=mod(x*x*x+7n);let y=1n,b=y2,e=(P+1n)/4n;while(e>0n){if(e&1n)y=mod(y*b);b=mod(b*b);e>>=1n}if(Number(y&1n)!==(rec&1))y=P-y;
    const ri=inv(r,N),z=b2n(h),Q=padd(pmul(mod(s*ri,N),[x,y]),pmul(mod(-z*ri,N)));return '0x'+hex(keccak256(concat(n2b(Q[0]),n2b(Q[1]))).slice(12))}

  /* EIP-712 */
  function typeStr(types,t){const deps=new Set(),walk=x=>{(types[x]||[]).forEach(f=>{const b=f.type.replace(/\[\]$/,'');if(types[b]&&!deps.has(b)&&b!==t){deps.add(b);walk(b)}})};walk(t);
    return [t,...[...deps].sort()].map(x=>x+'('+types[x].map(f=>f.type+' '+f.name).join(',')+')').join('')}
  function encField(types,type,v){if(types[type])return hashStruct(types,type,v);
    if(type==='string')return keccak256(enc.encode(v));if(type==='bytes')return keccak256(unhex(v));
    if(type==='address')return n2b(b2n(unhex(v)));if(type==='bool')return n2b(v?1n:0n);
    if(/^bytes\d+$/.test(type)){const b=typeof v==='string'?unhex(v):v,o=new Uint8Array(32);o.set(b);return o}
    if(/^u?int\d*$/.test(type)){let n=BigInt(v);if(n<0n)n=2n**256n+n;return n2b(n)}throw new Error('type '+type)}
  function hashStruct(types,t,v){return keccak256(concat(keccak256(enc.encode(typeStr(types,t))),...types[t].map(f=>encField(types,f.type,v[f.name]))))}
  const DOMAIN_FIELDS=[['name','string'],['version','string'],['chainId','uint256'],['verifyingContract','address'],['salt','bytes32']];
  function typedHash(domain,types,primary,msg){const dt=DOMAIN_FIELDS.filter(([k])=>domain[k]!=null).map(([name,type])=>({name,type}));const all={EIP712Domain:dt,...types};
    return keccak256(concat(new Uint8Array([0x19,0x01]),hashStruct(all,'EIP712Domain',domain),hashStruct(all,primary,msg)))}

  /* msgpack (파이썬 msgpack.packb와 같은 방식) */
  function mp(v,o){if(v===null||v===undefined){o.push(0xc0);return}
    if(v===true||v===false){o.push(v?0xc3:0xc2);return}
    if(typeof v==='number'){if(Number.isInteger(v)){if(v>=0){if(v<128)o.push(v);else if(v<256)o.push(0xcc,v);else if(v<65536)o.push(0xcd,v>>8,v&255);else if(v<2**32)o.push(0xce,...n2b(BigInt(v),4));else o.push(0xcf,...n2b(BigInt(v),8))}
        else{if(v>=-32)o.push(v&255);else if(v>=-128)o.push(0xd0,v&255);else if(v>=-32768)o.push(0xd1,(v>>8)&255,v&255);else if(v>=-(2**31))o.push(0xd2,...n2b(BigInt(v)+2n**32n,4));else o.push(0xd3,...n2b(BigInt(v)+2n**64n,8))}return}
      const b=new DataView(new ArrayBuffer(8));b.setFloat64(0,v);o.push(0xcb,...new Uint8Array(b.buffer));return}
    if(typeof v==='bigint'){o.push(0xcf,...n2b(v,8));return}
    if(typeof v==='string'){const b=enc.encode(v),n=b.length;if(n<32)o.push(0xa0|n);else if(n<256)o.push(0xd9,n);else if(n<65536)o.push(0xda,n>>8,n&255);else o.push(0xdb,...n2b(BigInt(n),4));o.push(...b);return}
    if(Array.isArray(v)){const n=v.length;if(n<16)o.push(0x90|n);else if(n<65536)o.push(0xdc,n>>8,n&255);else o.push(0xdd,...n2b(BigInt(n),4));v.forEach(x=>mp(x,o));return}
    const ks=Object.keys(v).filter(k=>v[k]!==undefined),n=ks.length;if(n<16)o.push(0x80|n);else if(n<65536)o.push(0xde,n>>8,n&255);else o.push(0xdf,...n2b(BigInt(n),4));
    ks.forEach(k=>{mp(k,o);mp(v[k],o)})}
  const msgpack=v=>{const o=[];mp(v,o);return new Uint8Array(o)};

  /* 하이퍼리퀴드 */
  function floatToWire(x){const r=Number(x).toFixed(8);if(Math.abs(parseFloat(r)-x)>=1e-12)throw new Error('rounding '+x);

  const AGENT_TYPES={Agent:[{name:'source',type:'string'},{name:'connectionId',type:'bytes32'}]};
  const L1_DOMAIN={name:'Exchange',version:'1',chainId:1337,verifyingContract:'0x0000000000000000000000000000000000000000'};
  async function signL1(action,priv,nonce,vault,mainnet=true){const h=actionHash(action,vault,nonce);
    const d=typedHash(L1_DOMAIN,AGENT_TYPES,'Agent',{source:mainnet?'a':'b',connectionId:h});return sign(d,priv)}
  /* 가격: 유효숫자 5자리 + 소수 (6 - szDecimals)자리, 수량: szDecimals자리 */

  return{hex,unhex,keccak256,sha3_256,addressOf,sign,recover,typedHash,msgpack,floatToWire,actionHash,signL1,roundPx,roundSz,orderWire,L1_DOMAIN,AGENT_TYPES}})();

function trBuild(isBuy){const c=trCoin(),meta=c&&M.hlMeta.get(c),f=TR.f,mid=c&&trMid(c);
  if(!c||!meta)return{err:L('이 종목은 하이퍼리퀴드에서 주문할 수 없어요.','This symbol can’t be traded on Hyperliquid.')};
  if(!(mid>0))return{err:L('현재가를 아직 못 받았어요. 잠시 후 다시 시도해 주세요.','No price yet. Try again in a moment.')};
  const slip=(+S_().slippage||1)/100,limit=f.type==='limit';
  let px=limit?cnum(f.px):mid*(isBuy?1+slip:1-slip);if(!(px>0))return{err:L('지정가를 넣어 주세요.','Enter a limit price.')};
  px=HC.roundPx(px,meta.szDec);const refPx=limit?px:mid;
  const v=cnum(f.sz);if(!(v>0))return{err:L('수량을 넣어 주세요.','Enter a size.')};
  const sz=HC.roundSz(f.unit==='usd'?v/refPx:v,meta.szDec);if(!(sz>0))return{err:L('수량이 너무 작아요.','Size is too small.')};
  const notional=sz*refPx;if(notional<10&&!f.reduce)return{err:L('하이퍼리퀴드 최소 주문 금액은 $10이에요.','Hyperliquid’s minimum order is $10.')};
  let lev=Math.round(cnum(f.lev)||TR.lev||1);lev=Math.max(1,Math.min(meta.maxLev||50,lev));
  const dir=isBuy?1:-1,orders=[{asset:meta.idx,isBuy,px,sz,reduceOnly:!!f.reduce,tif:limit?(f.post?'Alo':'Gtc'):'Ioc'}];let tp=null,sl=null;
  if(f.tpsl){tp=cnum(f.tp);sl=cnum(f.sl);
    if(tp>0){if((tp-refPx)*dir<=0)return{err:L('익절가가 진입가와 반대쪽에 있어요.','Take-profit is on the wrong side.')};
      orders.push({asset:meta.idx,isBuy:!isBuy,px:HC.roundPx(tp*(isBuy?.9:1.1),meta.szDec),sz,reduceOnly:true,trigger:{isMarket:true,px:HC.roundPx(tp,meta.szDec),tpsl:'tp'}})}else tp=null;
    if(sl>0){if((refPx-sl)*dir<=0)return{err:L('손절가가 진입가와 반대쪽에 있어요.','Stop-loss is on the wrong side.')};
      orders.push({asset:meta.idx,isBuy:!isBuy,px:HC.roundPx(sl*(isBuy?.9:1.1),meta.szDec),sz,reduceOnly:true,trigger:{isMarket:true,px:HC.roundPx(sl,meta.szDec),tpsl:'sl'}})}else sl=null}
  const fee=(+S_().calcFee||0)/100,liq=f.reduce?null:refPx*(1-dir/lev+dir*.005);
  return{coin:c,meta,isBuy,limit,px,refPx,sz,notional,lev,cross:TR.cross,orders,tp,sl,margin:notional/lev,fee:notional*fee,liq,
    slLoss:sl?(sl-refPx)*sz*dir:null,tpGain:tp?(tp-refPx)*sz*dir:null,levChange:!f.reduce&&TR.lev!=null&&lev!==TR.lev}}
async function trSend(o){if(TR.busy)return;TR.busy=true;renderTradeSoft();
  try{if(o.levChange||(TR.lev==null&&!TR.f.reduce)){await hlExchange({type:'updateLeverage',asset:o.meta.idx,isCross:!!TR.cross,leverage:o.lev});TR.lev=o.lev}
    const action={type:'order',orders:o.orders.map(HC.orderWire),grouping:o.orders.length>1?'normalTpsl':'na'};
    const res=await hlExchange(action),st=orderStatuses(res),first=st[0]||{};
    if(first.error)throw new Error(first.error);
    const msg=first.filled?L(`체결됐어요 · ${first.filled.totalSz} @ ${fmtP(+first.filled.avgPx)}`,`Filled · ${first.filled.totalSz} @ ${fmtP(+first.filled.avgPx)}`):first.resting?L('주문이 들어갔어요 (대기 중)','Order placed (resting)'):L('주문을 보냈어요','Order sent');
    const extraErr=st.slice(1).find(x=>x&&x.error);toast(msg+(extraErr?' · '+L('TP/SL 오류: ','TP/SL error: ')+extraErr.error:''));
    TR.f.sz='';CFG.lastCheckAt=0;saveCfg();setTimeout(()=>{trRefresh();hlSync(true)},800)}
  catch(e){toast(L('주문 실패: ','Order failed: ')+(e.message||e))}
  TR.busy=false;renderTrade()}
async function trClose(coin){const p=(HL.pos||[]).find(x=>x.coin===coin),meta=M.hlMeta.get(coin),mid=trMid(coin);if(!p||!meta||!(mid>0))return;
  if(!confirm(L(`${coin} 포지션을 시장가로 전부 청산할까요?`,`Close the whole ${coin} position at market?`)))return;
  const isBuy=p.szi<0,slip=(+S_().slippage||1)/100,px=HC.roundPx(mid*(isBuy?1+slip:1-slip),meta.szDec);
  try{const res=await hlExchange({type:'order',orders:[HC.orderWire({asset:meta.idx,isBuy,px,sz:Math.abs(p.szi),reduceOnly:true,tif:'Ioc'})],grouping:'na'});
    const s=orderStatuses(res)[0]||{};if(s.error)throw new Error(s.error);toast(L('청산했어요','Position closed'));setTimeout(()=>{trRefresh();hlSync(true)},800)}
  catch(e){toast(L('청산 실패: ','Close failed: ')+(e.message||e))}}
async function trCancel(coin,oid){const meta=M.hlMeta.get(coin);if(!meta)return;
  try{const res=await hlExchange({type:'cancel',cancels:[{a:meta.idx,o:+oid}]});const s=orderStatuses(res)[0];if(s&&s.error)throw new Error(s.error);toast(L('주문을 취소했어요','Order cancelled'));trRefresh()}
  catch(e){toast(L('취소 실패: ','Cancel failed: ')+(e.message||e))}}

/* ---------- 매매 규율: 틸트 잠금 · 진입 전 체크리스트 ---------- */
const principles=()=>(J&&Array.isArray(J.principles)?J.principles.filter(p=>p&&p.text&&String(p.text).trim()):[]);
function recentResults(){const out=[];
  ((J&&J.trades)||[]).forEach(t=>{if(t.settle||!t.closeTime)return;out.push({t:t.closeTime,pnl:+t.pnl||0})});

async function trAction(a,D,el){
  if(a==='buy'||a==='sell'){trConfirm(a==='buy');return}
  if(a==='last'){const m=trMid(trCoin());if(m){TR.f.px=String(m);renderTrade()}return}
  if(a==='pct'){const p=+D.p/100,mx=TR.maxSz;if(!mx){toast(L('가용 수량을 아직 못 받았어요','Max size not loaded yet'));return}TR.f.unit='coin';const m=M.hlMeta.get(trCoin());TR.f.sz=String(HC.roundSz(Math.max(mx[0],mx[1])*p,m?m.szDec:4));renderTrade();return}
  if(a==='levm'||a==='levp'){const m=M.hlMeta.get(trCoin());let v=Math.round(cnum(TR.f.lev)||TR.lev||1)+(a==='levp'?1:-1);v=Math.max(1,Math.min(m?m.maxLev:50,v));TR.f.lev=String(v);renderTrade();return}
  if(a==='close'){trClose(D.c);return}
  if(a==='cancel'){trCancel(D.c,D.o);return}
  if(a==='setup'){TR.setup=true;closeSheet();if(CFG.view==='log')goView('chart');S_().tradeShow=true;saveCfg();renderTrade();return}
  if(a==='setupClose'){TR.setup=false;renderTrade();return}
  if(a==='forget'){if(!confirm(L('이 기기에서 API 지갑 키를 지울까요?','Remove the API wallet key from this device?')))return;TR.key=null;TR.addr=null;await DB.set('hlAgent',null);toast(L('키를 지웠어요','Key removed'));renderTrade();if(sheetKind==='set')openSheet('set');return}
  if(a==='connect'){const ad=($('#trAddr').value||'').trim().toLowerCase(),k=($('#trKey').value||'').trim().replace(/^0x/i,'');
    if(!/^0x[0-9a-f]{40}$/.test(ad)){toast(L('지갑 주소는 0x로 시작하는 42자예요','Wallet addresses start with 0x and have 42 characters'));return}
    if(k&&!/^[0-9a-fA-F]{64}$/.test(k)){toast(L('개인키는 0x 뒤에 64자리예요','The private key has 64 characters after 0x'));return}
    if(ad!==CFG.hlAddr){HL={fills:[],sent:[],last:0,pos:null,acct:null};await saveHL();CFG.hlAddr=ad;saveCfg();hlSync(true)}
    if(k){try{TR.addr=HC.addressOf(HC.unhex(k));TR.key=k}catch(e){toast(L('개인키가 올바르지 않아요','Invalid private key'));return}
      await DB.set('hlAgent',$('#trSave').checked?{key:k}:null);toast(L(`연결했어요 · API 지갑 ${TR.addr.slice(0,6)}…${TR.addr.slice(-4)}`,`Connected · API wallet ${TR.addr.slice(0,6)}…${TR.addr.slice(-4)}`))}
    else toast(L('지갑 주소를 저장했어요. 주문하려면 API 지갑 키도 넣어 주세요.','Wallet saved. Add an API wallet key to place orders.'));
    TR.setup=false;renderTrade();hlPositions();trLoadAsset();trRefresh();trCheckAgent();return}}
/* 백업 안내 (하루 한 번) */
function backupNudge(){if(!J||!(J.trades||[]).length)return;const lb=(J.settings&&J.settings.lastBackup)||0,days=Math.floor((Date.now()-lb)/864e5);
  if(lb&&days<7)return;const today=dayKeyTz(Date.now());if(CFG.nudgeDay===today)return;CFG.nudgeDay=today;saveCfg();
  setTimeout(()=>toast(lb?L(`기록을 백업한 지 ${days}일 지났어요. Fillog 대시보드에서 백업할 수 있어요.`,`It’s been ${days} days since your last backup. Back up from the Fillog dashboard.`):L('아직 기록을 백업하지 않았어요. Fillog 대시보드에서 백업할 수 있어요.','You haven’t backed up yet. Back up from the Fillog dashboard.')),4000)}

/* ---------- 시작 ---------- */
(async()=>{
  await DB.open();
  const [s,c,h,v1]=await Promise.all([DB.get('state'),DB.get('fillview'),DB.get('hl'),DB.get('term')]);
  if(s&&s.trades)J=s;
  if(c)CFG=mergeCfg(c);
  else{CFG=mergeCfg(null);if(v1){CFG.hlAddr=v1.hlAddr||'';CFG.events=(v1.events||[]).map(e=>({id:e.id,title:e.title,ms:e.ms}));
    if(Array.isArray(v1.watch)&&v1.watch.length)CFG.fav=v1.watch.map(x=>'BN:'+x);if(v1.sym)CFG.sym='BN:'+v1.sym}CFG.tf=S_().defTf}
  if(h)HL={...HL,fills:h.fills||[],sent:h.sent||[],last:h.last||0};
  if(!TF[CFG.tf])CFG.tf='1h';
  CFG.panel=!!S_().panelDefault&&!isMobile();CFG.view='chart';
  if(S_().tzMode==='fillog'){S_().tzMode='custom';S_().tzMin=(J&&J.settings&&J.settings.tzMin!=null)?J.settings.tzMin:-new Date().getTimezoneOffset()}
  if(!Array.isArray(CFG.recent))CFG.recent=[];if(!CFG.recent.length)CFG.recent=[CFG.sym];if(CFG.wlOpen.recent===undefined)CFG.wlOpen.recent=true;
  CFG.calc={...JSON.parse(JSON.stringify(CALC0)),...(CFG.calc||{})};if(!Array.isArray(CFG.calc.rows)||!CFG.calc.rows.length)CFG.calc.rows=[{p:'',q:''}];
  LANG=resolveLang();
  initChart();applyTheme();renderAll();
  const ok=await loadMarkets();
  if(ok&&!tick(CFG.sym))CFG.sym='BN:BTCUSDT';
  CFG.fav=CFG.fav.filter(k=>tick(k)||!ok);
  renderAll();reconnect();
  await trLoadKey();
  if(chart)await reloadChart();drawAlertLines();renderTrade();trLoadAsset();if(trReady()){trRefresh();trCheckAgent()}
  backupNudge();
  loadDeriv();loadRange();bookLoop();
  if(CFG.hlAddr){hlSync(true);hlPositions()}
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
