<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2E9D5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fillview">
<meta name="description" content="Fillview: free crypto charts with your own trades and journal built in.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<title>Fillview</title>
<style>
:root{
  --bg:#F2E9D5;--card:#F8F1E1;--ink:#2B2418;--acc:#7A5A2B;--acc-ink:#FBF4E3;--win:#2D6A3E;--loss:#A32D2A;--fs:15px;
  --font:"Pretendard Variable",Pretendard,"SF Pro Text","Roboto","SamsungOneUI","Noto Sans KR",system-ui,sans-serif;
  --mute:color-mix(in srgb,var(--ink) 56%,var(--bg));
  --line:color-mix(in srgb,var(--ink) 13%,var(--bg));
  --soft:color-mix(in srgb,var(--ink) 6%,var(--card));
  --railw:56px;--panelw:340px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--fs);line-height:1.45}
body{display:flex;flex-direction:column;height:100svh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.win{color:var(--win)}.loss{color:var(--loss)}.mute{color:var(--mute)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 상단 */
header.tb{display:flex;align-items:center;gap:14px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:6}
.logo{font-size:1.15rem;font-weight:600;letter-spacing:-.03em;color:var(--ink);flex:none}
.logo i{font-style:normal;color:var(--loss)}
.symbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.38rem .7rem;flex:none;max-width:52vw}
.symbtn b{font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.symbtn span{font-size:.76rem;color:var(--mute);white-space:nowrap}
.exb{font-size:.66rem;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 .35rem;color:var(--mute)}
.mkt{display:flex;align-items:center;gap:18px;flex:1;min-width:0}
.price{flex:none;min-width:7rem}
.price b{display:block;font-size:1.32rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.price small{font-size:.76rem}
.stats{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.stats::-webkit-scrollbar{display:none}
.st{flex:none}
.st span{display:block;font-size:.7rem;color:var(--mute);white-space:nowrap}
.st b{display:block;font-size:.86rem;font-weight:600;white-space:nowrap}
.rng{display:flex;align-items:center;gap:6px;font-size:.76rem}
.rng .bar{position:relative;width:80px;height:2px;background:var(--line)}
.rng .bar i{position:absolute;top:-4px;width:2px;height:10px;background:var(--ink)}
.hright{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.disc{flex:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.28rem .6rem;text-align:left;display:flex;gap:12px}
.disc div span{display:block;font-size:.66rem;color:var(--mute);white-space:nowrap}
.disc div b{font-size:.84rem;white-space:nowrap}
.disc .lim{height:3px;background:var(--line);border-radius:2px;margin-top:3px;overflow:hidden}
.disc .lim i{display:block;height:100%;background:var(--loss)}
.ib{border:1px solid transparent;background:none;border-radius:9px;padding:.35rem .5rem;color:var(--mute);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.82rem}
.ib:hover{border-color:var(--line);color:var(--ink)}

/* 봉 바 */
.tfbar{display:flex;align-items:center;gap:2px;padding:5px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;background:var(--bg)}
.tfbar::-webkit-scrollbar{display:none}
.tfbar>button{border:0;background:none;border-radius:8px;padding:.32rem .6rem;font-weight:600;font-size:.85rem;color:var(--mute);flex:none;display:inline-flex;align-items:center;gap:6px}
.tfbar>button.on{background:var(--soft);color:var(--ink);box-shadow:inset 0 -2px 0 var(--acc)}
.tfbar .sep{width:1px;height:18px;background:var(--line);margin:0 6px;flex:none}
.tfbar select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:.25rem .45rem;font-size:.82rem;flex:none;width:auto!important}
.tfbar .grow{flex:1}
.live{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--mute);flex:none;padding-right:2px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.live.ok i{background:var(--win)}.live.slow i{background:var(--acc)}.live.bad i{background:var(--loss)}

/* 본문 */
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) auto var(--railw);min-height:0}
.center{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.chartbox{position:relative;flex:1;min-height:300px}
#chart{position:absolute;inset:0}
.legend{position:absolute;left:12px;top:8px;z-index:2;font-size:.8rem;color:var(--mute);pointer-events:none}
.legend b{color:var(--ink);font-weight:600}
.msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:2rem;color:var(--mute);z-index:3}
.msg.on{display:grid}
.histbar{position:absolute;left:50%;transform:translateX(-50%);bottom:40px;z-index:3;display:none}
.histbar.on{display:block}
.pill{border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:99px;padding:.45rem 1rem;font-weight:600;font-size:.85rem}
.tpop{position:absolute;right:12px;top:10px;z-index:4;width:min(300px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:none;box-shadow:0 6px 24px color-mix(in srgb,var(--ink) 14%,transparent)}
.tpop.on{display:block}
.tpop h4{margin:0 0 4px;font-size:.95rem;display:flex;justify-content:space-between;gap:8px}
.tpop .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:.8rem;margin:6px 0 10px}
.tpop .kv span{color:var(--mute)}
.tpop .kv b{text-align:right;font-weight:600}

/* Fillog 화면 */
.center{position:relative}
.logview{position:absolute;inset:0;display:none;background:var(--bg);z-index:6}
.logview iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
body.vlog .logview{display:block}
body.vlog .tfbar{display:none}

/* 포지션 줄 (모바일: 아래 버튼 바로 위) */
.posbar{display:none}
.posbar[hidden]{display:none!important}
.posbar .cnt{display:inline-block;min-width:1.2rem;padding:0 .35rem;border-radius:99px;background:var(--soft);color:var(--ink);font-size:.72rem;text-align:center}
.posbar .pchip{display:inline-flex;align-items:center;gap:4px;font-size:.78rem}
.posbar .pchip i,.prow i.side{font-style:normal;font-weight:800;font-size:.68rem;border-radius:5px;padding:0 .3rem;border:1px solid currentColor}
.posbar .grow{flex:1}
.prow{align-items:flex-start}
.prow .l span{white-space:normal}
.pwarn{margin:4px 12px;padding:6px 10px;border-radius:9px;background:color-mix(in srgb,var(--loss) 10%,transparent);color:var(--loss);font-size:.78rem}
.exb2{display:inline-grid;place-items:center;min-width:1.7rem;height:1.25rem;padding:0 .25rem;border-radius:6px;background:var(--soft);color:var(--ink);font-size:.64rem;font-weight:800;flex:none}
nav.rail button{position:relative}
nav.rail .bdg{position:absolute;top:2px;right:4px;min-width:15px;height:15px;padding:0 3px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font-size:.6rem;line-height:15px;text-align:center;font-weight:800}
.checks{border:1px solid var(--line);border-radius:12px;padding:6px 12px 10px;background:var(--card)}
.checks h5{margin:6px 0 2px;font-size:.86rem}
.checks .crow{font-size:.88rem;margin-top:8px}
.tiltbar{position:absolute;left:50%;transform:translateX(-50%);top:8px;z-index:5;display:none;align-items:center;gap:8px;background:var(--loss);color:#fff;border-radius:99px;padding:.3rem .45rem .3rem .9rem;font-size:.8rem;font-weight:600;max-width:calc(100% - 24px)}
.tiltbar.on{display:flex}
.tiltbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiltbar .ib{color:#fff;border-color:rgba(255,255,255,.5);font-size:.74rem;padding:.2rem .5rem}
.tiltbig{font-size:1.5rem;font-weight:800;margin:6px 0}
.rpbar{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;z-index:5;display:none;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:.25rem .5rem;box-shadow:0 6px 20px color-mix(in srgb,var(--ink) 15%,transparent);font-size:.8rem;white-space:nowrap}
.rpbar.on{display:flex}
.rpbar .ib{color:var(--ink);font-size:.86rem;padding:.3rem .55rem}
.rpbar .chip{padding:.15rem .55rem}
.shprev{display:flex;justify-content:center;background:var(--soft);border-radius:12px;padding:10px;margin-bottom:6px}
.shprev canvas{width:100%;max-width:300px;height:auto;border-radius:10px;box-shadow:0 6px 24px color-mix(in srgb,var(--ink) 20%,transparent)}

/* 계산기 */
.cbox{margin:8px 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.cbox h5{margin:0 0 6px;font-size:.88rem}
.cl{display:block;font-size:.76rem;font-weight:600;color:var(--mute);margin:10px 0 4px}
.cf{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.cf:focus-within{border-color:var(--acc)}
.cf input{border:0!important;background:transparent!important;flex:1;min-width:0;padding:.55rem .65rem!important;border-radius:0!important}
.cf input.solved{color:var(--acc);font-weight:700}
.cf .cu{padding:0 .65rem;font-size:.78rem;color:var(--mute);flex:none}
.cf .cb{border:0;background:none;color:var(--acc);font-weight:700;font-size:.76rem;padding:0 .5rem;flex:none}
.cf select.cu2,select.cu2{border:0!important;border-left:1px solid var(--line)!important;border-radius:0!important;background:transparent!important;width:auto!important;font-size:.78rem;padding:.4rem .5rem!important}
select.cu2{border:1px solid var(--line)!important;border-radius:8px!important}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border-radius:10px;background:var(--soft)}
.seg2 button{border:0;background:transparent;border-radius:8px;padding:.5rem;font-weight:700;color:var(--mute)}
.seg2 button.on.win{background:var(--win);color:#fff}
.seg2 button.on.loss{background:var(--loss);color:#fff}
.crow{display:flex;align-items:center;gap:8px;font-size:.82rem;margin:10px 0 0;flex-wrap:wrap}
.crow .mute{font-size:.74rem}
.cres .big{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:2px 0 8px}
.cres .big small{font-size:.78rem;font-weight:600;color:var(--mute)}
.arow{display:grid;grid-template-columns:1.2rem 1fr 1fr auto;gap:6px;align-items:center;margin-top:6px}
.arow input{padding:.45rem .55rem!important}

/* 오른쪽 패널 + 아이콘 줄 */
.spanel{width:0;overflow:hidden;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
.spanel.on{width:var(--panelw)}
.spanel>header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.spanel>header h3{margin:0;font-size:.95rem;flex:1}
.sbody{flex:1;overflow-y:auto;min-height:0;padding-bottom:16px}
nav.rail{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;background:var(--bg)}
nav.rail button{border:0;background:none;width:48px;padding:.5rem 0;border-radius:10px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.66rem;font-weight:600}
nav.rail button.on{background:var(--soft);color:var(--ink)}
nav.rail .gap{flex:1}

/* 공통 목록 */
.row{display:flex;align-items:center;gap:10px;padding:.5rem 12px;border:0;background:none;width:100%;text-align:left}
button.row:hover{background:var(--soft)}
.row .l{flex:1;min-width:0}
.row .l b{display:block;font-weight:600;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .l span{display:block;font-size:.74rem;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:.86rem;flex:none}
.row .r span{display:block;font-size:.74rem}
.row.cur{background:var(--soft);box-shadow:inset 2px 0 0 var(--acc)}
.grp{display:flex;align-items:center;gap:6px;padding:.55rem 12px .35rem;font-size:.76rem;font-weight:700;color:var(--mute);border:0;background:none;width:100%;text-align:left}
.grp i{font-style:normal;font-weight:500}
.star{border:0;background:none;color:var(--mute);padding:.15rem .3rem;font-size:1rem;flex:none}
.star.on{color:var(--acc)}
.box{margin:8px 12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.box p{margin:0 0 8px;font-size:.84rem;color:var(--mute)}
.box h5{margin:0 0 6px;font-size:.88rem}
.kv2{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-size:.84rem}
.kv2 span{color:var(--mute)}
.kv2 b{text-align:right;font-weight:600}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--acc-ink);border-radius:10px;padding:.5rem .85rem;font-weight:600;font-size:.85rem}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:.3rem .6rem;font-size:.78rem}
.btn:disabled{opacity:.4}
.btns{display:flex;gap:8px;flex-wrap:wrap}
input[type=checkbox]{width:auto;margin:0;accent-color:var(--acc)}
input:not([type=checkbox]):not([type=color]):not([type=range]),select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:.5rem .65rem;background:var(--card);outline:none}
input[type=color]{width:2.6rem;height:2rem;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:2px}
input[type=range]{width:100%;accent-color:var(--acc)}
input:focus,select:focus{border-color:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:.25rem .7rem;font-size:.78rem;font-weight:600;color:var(--mute)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.empty{padding:1.2rem 12px;color:var(--mute);font-size:.85rem}
.soon{margin:12px;padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);font-size:.86rem}
.soon b{display:block;color:var(--ink);margin-bottom:4px}
.soon ul{margin:.4rem 0 0;padding-left:1.1rem}
.h{font-size:.74rem;color:var(--mute);padding:.7rem 12px .2rem;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:.8rem}
.tbl td,.tbl th{padding:.32rem 12px;text-align:right;white-space:nowrap}
.tbl th{color:var(--mute);font-weight:600;font-size:.72rem}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--soft)}
.ob{font-size:.76rem}
.ob .lv{display:grid;grid-template-columns:5.6rem 1fr 4.6rem;align-items:center;gap:6px;padding:1px 12px}
.ob .lv .bars{display:flex;height:12px;border-radius:2px;overflow:hidden}
.ob .lv .bars i{display:block;height:100%}
.ob .mid{padding:6px 12px;font-weight:700;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:3px 0;display:flex;justify-content:space-between}
.legend2{display:flex;gap:10px;flex-wrap:wrap;padding:4px 12px 8px;font-size:.72rem;color:var(--mute)}
.legend2 i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* 하단 띠 */
footer.tick{display:flex;align-items:center;gap:18px;padding:5px 12px calc(5px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:.78rem;overflow-x:auto;scrollbar-width:none;white-space:nowrap;background:var(--bg)}
footer.tick::-webkit-scrollbar{display:none}
footer.tick button{border:0;background:none;padding:0;font-size:.78rem}
footer.tick .clk{margin-left:auto;color:var(--mute)}
footer.tick a{color:var(--mute)}

/* 창 */
.dim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);z-index:30;display:none;align-items:flex-start;justify-content:center;padding:calc(30px + env(safe-area-inset-top)) 12px 12px}
.dim.on{display:flex}
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:100%;max-width:480px;max-height:86svh;display:flex;flex-direction:column;overflow:hidden}
.sheet>header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet>header h3{margin:0;font-size:1rem;flex:1}
.sheet .sb{overflow-y:auto;padding:4px 0 14px}
.set h4{margin:0;padding:14px 14px 4px;font-size:.84rem}
.set .it{padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.set .it>label{flex:1;min-width:9rem;font-size:.86rem}
.set .it>label small{display:block;color:var(--mute);font-size:.74rem}
.set .it .ctl{flex:none;max-width:100%}
.set .it .ctl.w{flex:1 1 100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:.35rem .65rem;font-weight:600;font-size:.8rem;color:var(--mute)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.sw{position:relative;display:inline-block;vertical-align:middle;width:42px;height:24px;flex:none}
.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.sw i{position:absolute;inset:0;border-radius:99px;background:color-mix(in srgb,var(--ink) 22%,var(--bg));pointer-events:none;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--card);transition:transform .15s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i::after{transform:translateX(18px)}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:12px;font-size:.86rem;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}

@media (max-width:899px){
  header.tb{flex-wrap:wrap;gap:8px 10px}
  .mkt{order:5;flex-basis:100%;gap:14px}
  header.tb{gap:8px 8px;flex-wrap:wrap}
  .hright{order:3;gap:2px}
  #symQ,#symEx{display:none}
  .logo{font-size:1rem}
  .symbtn{padding:.32rem .55rem;gap:6px}
  .disc{gap:8px;padding:.2rem .45rem}
  .disc div span{font-size:.62rem}
  .disc div b{font-size:.76rem}
  #setBtn{padding:.3rem}
  .body{display:flex;flex-direction:column;padding-bottom:calc(54px + env(safe-area-inset-bottom))}
  body.pbar .body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  .posbar{display:flex;position:fixed;left:0;right:0;bottom:calc(53px + env(safe-area-inset-bottom));z-index:21;height:34px;align-items:center;gap:10px;padding:0 12px;border:0;border-top:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:.8rem;overflow-x:auto;white-space:nowrap;scrollbar-width:none;width:100%;text-align:left}
  .posbar::-webkit-scrollbar{display:none}
  .posbar.on{background:var(--soft)}
  .posbar b{display:inline-flex;align-items:center;gap:5px;flex:none}
  .center{border-right:0;flex:1;min-height:0}
  .chartbox{flex:1;min-height:0}
  body.vlog .mkt{display:none}
  nav.rail{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:row;justify-content:flex-start;gap:0;padding:3px 6px calc(3px + env(safe-area-inset-bottom));border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  nav.rail::-webkit-scrollbar{display:none}
  nav.rail .gap{display:block;flex:1 1 0;min-width:4px}

<script>
'use strict';
/* =========================================================
   Fillview v2 — 서버 없이 동작하는 차트 + Fillog 일지 통합
   ========================================================= */

/* ---------- 순수 계산 (테스트 가능) ---------- */
const Core=(()=>{
  const pad=n=>String(n).padStart(2,'0');
  const QUOTE=/(USDT|USDC|BUSD|FDUSD|USD)$/;
  const baseOf=s=>{let x=String(s||'').toUpperCase();if(x.includes(':'))x=x.split(':').pop();
    x=x.replace(/\.P$/,'').replace(/PERP(ETUAL)?/g,'').replace(/[\s/_-]/g,'');const y=x.replace(QUOTE,'');return y||x};
  const coreBase=b=>String(b||'').toUpperCase().replace(/^(1000000|1000|1M|K)(?=[A-Z])/,'');
  const TF={'1m':6e4,'5m':3e5,'15m':9e5,'1h':36e5,'4h':144e5,'1d':864e5,'1w':6048e5};
  const barFloor=(ms,tf)=>{const d=TF[tf];if(tf==='1w'){const o=4*864e5;return Math.floor((ms-o)/d)*d+o}return Math.floor(ms/d)*d};
  const pickTf=h=>h<2*36e5?'5m':h<12*36e5?'15m':h<2*864e5?'1h':h<10*864e5?'4h':'1d';
  const decimals=p=>p>=1e4?1:p>=100?2:p>=10?3:p>=1?4:p>=.1?5:p>=.01?6:7;
  const fmtP=p=>p==null||!isFinite(p)?'–':Number(p).toLocaleString('en-US',{minimumFractionDigits:decimals(Math.abs(p)),maximumFractionDigits:decimals(Math.abs(p))});
  const compact=n=>{if(n==null||!isFinite(n))return '–';const a=Math.abs(n);
    return a>=1e9?(n/1e9).toFixed(2)+'B':a>=1e6?(n/1e6).toFixed(2)+'M':a>=1e3?(n/1e3).toFixed(1)+'K':n.toFixed(2)};
  const countdown=ms=>{ms=Math.max(0,ms);const s=Math.floor(ms/1000);return Math.floor(s/3600)+':'+pad(Math.floor(s%3600/60))+':'+pad(s%60)};
  const plainCoin=c=>/^[A-Z0-9]+$/i.test(String(c||''))&&!String(c).startsWith('@');
  const niceStep=x=>{if(!(x>0))return 1;const e=Math.pow(10,Math.floor(Math.log10(x))),f=x/e;return (f<1.5?1:f<2.25?2:f<3.5?2.5:f<7.5?5:10)*e};

  /* 미국 동부 시각 → UTC ms (서머타임: 3월 둘째 일요일 ~ 11월 첫째 일요일) */
  function nthSunday(y,m,n){const d=new Date(Date.UTC(y,m,1));const first=(7-d.getUTCDay())%7+1;return first+7*(n-1)}
  function etToUtc(date,time){const [y,mo,d]=date.split('-').map(Number),[h,mi]=time.split(':').map(Number);
    const s=Date.UTC(y,2,nthSunday(y,2,2),2),e=Date.UTC(y,10,nthSunday(y,10,1),2),loc=Date.UTC(y,mo-1,d,h,mi);
    const dst=loc>=s&&loc<e;return loc+(dst?4:5)*36e5}

  /* 하이퍼리퀴드 체결을 0→0 매매 단위로 묶기 */
  function hlGroups(fills){
    const EPS=1e-8,by={};let skipped=0;
    (fills||[]).forEach(f=>{if(!plainCoin(f.coin)){skipped++;return}(by[f.coin]=by[f.coin]||[]).push(f)});
    const closed=[];let open=0,partial=0,flips=0;
    Object.keys(by).forEach(coin=>{
      const arr=by[coin].slice().sort((a,b)=>a.time-b.time||(a.tid||0)-(b.tid||0));let cur=null;
      arr.forEach(f=>{const sz=+f.sz,d=f.side==='B'?1:-1,st=+f.startPosition,end=st+d*sz;
        if(Math.abs(st)<EPS)cur=[f];else if(cur)cur.push(f);else{partial++;return}
        if(Math.abs(end)<EPS){closed.push({coin,fills:cur});cur=null}
        else if(Math.abs(st)>=EPS&&Math.sign(end)!==Math.sign(st)){closed.push({coin,fills:cur,flip:true});cur=null;flips++}});
      if(cur)open++});
    closed.sort((a,b)=>a.fills[0].time-b.fills[0].time);
    return{closed,open,partial,flips,skipped}}
  function toFillog(groups){const fills=[];
    groups.forEach(g=>g.fills.forEach(f=>fills.push({time:f.time,symbol:g.coin+'USDT',side:f.side==='B'?'buy':'sell',
      price:+f.px,qty:+f.sz,fee:Math.abs(+f.fee||0),feeAsset:f.feeToken||'USDC',pnl:+f.closedPnl||0,id:String(f.tid??'')})));
    return JSON.stringify({fillog:1,exchange:'Hyperliquid',timezone:'UTC',fills})}

  /* 호가 묶기: 거래소별 [가격, 수량(코인)] → 구간별 금액 */
  function bucketBook(books,mid,step,range){
    const lo=mid*(1-range/100),hi=mid*(1+range/100),B=new Map(),A=new Map();
    Object.entries(books).forEach(([ex,b])=>{if(!b)return;
      (b.bids||[]).forEach(([p,q])=>{if(p<lo||p>mid)return;const k=Math.floor(p/step)*step;const e=B.get(k)||{};e[ex]=(e[ex]||0)+p*q;B.set(k,e)});
      (b.asks||[]).forEach(([p,q])=>{if(p>hi||p<mid)return;const k=Math.ceil(p/step)*step;const e=A.get(k)||{};e[ex]=(e[ex]||0)+p*q;A.set(k,e)})});
    const tot=e=>Object.values(e).reduce((s,x)=>s+x,0);
    const bids=[...B.entries()].map(([p,e])=>({p,e,t:tot(e)})).sort((a,b)=>b.p-a.p);
    const asks=[...A.entries()].map(([p,e])=>({p,e,t:tot(e)})).sort((a,b)=>a.p-b.p);
    return{bids,asks,bidSum:bids.reduce((s,x)=>s+x.t,0),askSum:asks.reduce((s,x)=>s+x.t,0)}}

  /* 매매 → 차트 그림 재료 (상자 + 기호) */
  function tradeShapes(trades,base){
    const out=[];
    (trades||[]).forEach(t=>{if(t.settle||!t.symbol||coreBase(baseOf(t.symbol))!==coreBase(base))return;
      const fl=(t.fills||[]).filter(f=>f.time!=null&&f.price!=null);if(!t.openTime&&!fl.length)return;
      const o=t.openTime||fl[0].time,c=t.closeTime||fl[fl.length-1].time;
      out.push({id:t.id,o,c,pe:t.avgEntry!=null?+t.avgEntry:(fl.find(f=>f.kind==='open')||{}).price,px:t.avgExit!=null?+t.avgExit:null,pnl:+t.pnl||0,side:t.side,
        steps:fl.map(f=>({t:f.time,p:+f.price,k:f.kind||'',dir:f.dir}))})});
    return out}

  return{pad,baseOf,coreBase,TF,barFloor,pickTf,decimals,fmtP,compact,countdown,plainCoin,niceStep,etToUtc,hlGroups,toFillog,bucketBook,tradeShapes}})();

function mkWS(url,onopen,onmsg){let ws=null,gen=0,tries=0,last=0;const st={ok:false};
  function open(){const g=++gen;try{ws&&ws.close()}catch(e){}
    let u;try{u=url();if(!u){st.ok=false;return}ws=new WebSocket(u)}catch(e){st.ok=false;return}
    ws.onopen=()=>{if(g!==gen)return;tries=0;last=Date.now();st.ok=true;onopen&&onopen();updLive()};
    ws.onmessage=e=>{if(g!==gen)return;last=Date.now();let m;try{m=JSON.parse(e.data)}catch(_){return}onmsg(m)};
    ws.onclose=()=>{if(g!==gen)return;st.ok=false;updLive();tries++;setTimeout(()=>{if(g===gen)open()},Math.min(30000,1500*tries))};
    ws.onerror=()=>{}}
  return{open,close(){gen++;try{ws&&ws.close()}catch(e){}st.ok=false},send(o){try{ws&&ws.readyState===1&&ws.send(JSON.stringify(o))}catch(e){}},st,age:()=>Date.now()-last}}

    const wb=s.ex==='BN'?s.id:(bnKeyFor(curBase())||'').slice(3);if(wb)set.add(wb.toLowerCase()+'@aggTrade');
    CFG.fav.forEach(k=>{const p=parseKey(k);if(p.ex==='BN')set.add(p.id.toLowerCase()+'@miniTicker')});
    if(S_().liqFeed)set.add('!forceOrder@arr');
    return set.size?'wss://fstream.binance.com/stream?streams='+[...set].slice(0,60).join('/'):null},
  null,m=>onBN(m.data||m));

function onBN(d){if(!d||!d.e)return;const s=cur();

  else if(d.e==='markPriceUpdate'){const t=M.bn.get(d.s);if(t){t.mark=+d.p;t.fund=+d.r;t.next=+d.T}if(s.id===d.s)renderStats()}
  else if(d.e==='24hrMiniTicker'){const t=M.bn.get(d.s)||{};Object.assign(t,{c:+d.c,o:+d.o,h:+d.h,l:+d.l,q:+d.q});M.bn.set(d.s,t);if(s.ex==='BN'&&d.s===s.id)renderPrice();scheduleLists()}
  else if(d.e==='aggTrade'){const n=+d.p*+d.q;if(n>=S_().whaleMin||CFG.alerts.length){const w={ex:'Binance',sym:d.s,side:d.m?'S':'B',p:+d.p,n,t:+d.T};alertWhale(w);if(n<S_().whaleMin)return;M.whale.unshift(w);M.whale.length=Math.min(M.whale.length,80);if(CFG.rail==='screen'&&CFG.scTab==='whale')renderScreener()}}
  else if(d.e==='forceOrder'){const o=d.o,n=+o.ap*+o.q||+o.p*+o.q;const lq={sym:o.s,side:o.S==='SELL'?'L':'S',p:+o.ap||+o.p,n,t:+o.T};alertLiq(lq);if(n>=S_().liqMin){M.liq.unshift(lq);M.liq.length=Math.min(M.liq.length,150);if(CFG.rail==='screen'&&CFG.scTab==='liq')renderScreener()}}}
function onHL(m){const s=cur();if(!m||!m.channel)return;
  if(m.channel==='candle'&&s.ex==='HL'){const c=m.data;if(c.s===s.id&&c.i===CFG.tf)liveCandle({t:+c.t,o:+c.o,h:+c.h,l:+c.l,c:+c.c,v:+c.v})}
  else if(m.channel==='activeAssetCtx'&&s.ex==='HL'){const c=m.data.ctx,t=M.hl.get(m.data.coin)||{};
    Object.assign(t,{c:+(c.midPx||c.markPx),o:+c.prevDayPx,q:+c.dayNtlVlm,fund:+c.funding,oi:+c.openInterest,mark:+c.markPx});M.hl.set(m.data.coin,t);renderPrice()}
  else if(m.channel==='allMids'){const mids=m.data.mids||{};Object.entries(mids).forEach(([k,v])=>{const t=M.hl.get(k);if(t)t.c=+v});
    if(s.ex==='HL'&&mids[s.id])renderPrice();scheduleLists()}
  else if(m.channel==='trades'){(m.data||[]).forEach(x=>{const n=+x.px*+x.sz,w={ex:'Hyperliquid',sym:x.coin,side:x.side==='B'?'B':'S',p:+x.px,n,t:+x.time};alertWhale(w);if(n>=S_().whaleMin)M.whale.unshift(w)});
    M.whale.length=Math.min(M.whale.length,80);if(CFG.rail==='screen'&&CFG.scTab==='whale')renderScreener()}}

function applyChartOpts(){if(!chart)return;const p=pal(),s=S_(),mute=mix(p.ink,p.bg,.56),line=mix(p.ink,p.bg,.09);

function setCandles(k){const z=tzSec(),p=pal();idxMap=new Map();k.forEach((x,i)=>idxMap.set(x.t,i));
  candle.setData(k.map(x=>({time:x.t/1000+z,open:x.o,high:x.h,low:x.l,close:x.c})));
  vol.setData(k.map(x=>({time:x.t/1000+z,value:x.v,color:hexA(x.c>=x.o?p.win:p.loss,'55')})));
  const lp=k.length?k[k.length-1].c:0,dc=decimals(lp);candle.applyOptions({priceFormat:{type:'price',precision:dc,minMove:Math.pow(10,-dc)}});
  M.first=k.length?k[0].t:0;M.last=k.length?k[k.length-1].t:0}
function liveCandle(x){if(RP.on){if(lastK.length&&lastK[lastK.length-1].t===x.t)lastK[lastK.length-1]=x;else if(lastK.length&&x.t>lastK[lastK.length-1].t)lastK.push(x);return}if(M.hist||!candle||!lastK.length)return;const z=tzSec(),p=pal(),L0=lastK[lastK.length-1];
  if(x.t<L0.t)return;if(L0.t===x.t)lastK[lastK.length-1]=x;else{lastK.push(x);idxMap.set(x.t,lastK.length-1);M.last=x.t}
  candle.update({time:x.t/1000+z,open:x.o,high:x.h,low:x.l,close:x.c});
  vol.update({time:x.t/1000+z,value:x.v,color:hexA(x.c>=x.o?p.win:p.loss,'55')});
  const s=cur();if(s.ex==='BN'){const t=M.bn.get(s.id);if(t){t.c=x.c}}else{const t=M.hl.get(s.id);if(t)t.c=x.c}renderPrice()}

/* 차트 위 그림: 경제 일정선, 매매 상자, 체결 기호 */
function rrect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawOverlay(ctx,size){
  const p=pal(),s=S_(),W=size.width,H=size.height,font=getComputedStyle(document.body).fontFamily;HITS=[];const LIM=RP.on&&RP.full&&RP.i?RP.full[RP.i-1].t+TF[CFG.tf]:Infinity;
  /* 경제 일정 */
  if(s.evShow){const evs=visibleEvents().filter(e=>e.ms>=M.first-TF[CFG.tf]*2);let rows=[];
    ctx.font='600 11px '+font;
    evs.forEach(e=>{const x=xOf(e.ms);if(x==null||x<0||x>W)return;
      ctx.save();ctx.strokeStyle=hexA(p.acc,'99');ctx.setLineDash([3,4]);ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(Math.round(x)+.5,0);ctx.lineTo(Math.round(x)+.5,H);ctx.stroke();ctx.restore();
      if(!s.evLabel)return;const txt=evShort(e)+' '+fmtHM(e.ms),tw=ctx.measureText(txt).width+14;
      let r=0;while(rows[r]!=null&&rows[r]>x-tw/2-4)r++;rows[r]=x+tw/2;const y=H-24-r*24;
      rrect(ctx,x-tw/2,y,tw,19,6);ctx.fillStyle=p.card;ctx.fill();ctx.strokeStyle=hexA(p.acc,'cc');ctx.setLineDash([]);ctx.stroke();
      ctx.fillStyle=p.ink;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y+10)})}
  if(s.marks==='off')return;
  const base=curBase(),shapes=Core.tradeShapes((J&&J.trades)||[],base),showBox=s.marks!=='sym',showSym=s.marks!=='box';
  shapes.forEach(t=>{if(t.o>=LIM)return;const open=t.c>=LIM;if(open){t={...t,c:LIM-1,px:null,steps:t.steps.filter(z=>z.t<LIM)}}const x1=xOf(t.o),x2=xOf(t.c);if(x1==null||x2==null)return;if(x2<-20||x1>W+20)return;
    const ya=yOf(t.pe),yb=yOf(t.px!=null?t.px:t.pe),sel=SEL===t.id,col=t.pnl>=0?p.win:p.loss;
    if(showBox&&ya!=null&&yb!=null){const L0=Math.min(x1,x2)-3,R=Math.max(x1,x2)+3,T=Math.min(ya,yb),B=Math.max(ya,yb),h=Math.max(4,B-T);
      ctx.fillStyle=hexA(col,sel?'38':'1c');ctx.fillRect(L0,T,R-L0,h);ctx.strokeStyle=hexA(col,sel?'ff':'88');ctx.lineWidth=sel?1.6:1;ctx.setLineDash([]);ctx.strokeRect(L0+.5,T+.5,R-L0-1,h-1);
      if(s.pnlLabel&&!open){ctx.font='700 10.5px '+font;ctx.fillStyle=col;ctx.textAlign='left';ctx.textBaseline='bottom';
        ctx.fillText((t.pnl>=0?'+':'')+t.pnl.toFixed(t.pnl>=1000||t.pnl<=-1000?0:2),R+3,T-1)}
      HITS.push({id:t.id,x1:L0-4,x2:R+4,y1:T-6,y2:T+h+6})}
    else HITS.push({id:t.id,x1:Math.min(x1,x2)-6,x2:Math.max(x1,x2)+6,y1:0,y2:H});
    if(showSym)t.steps.forEach(st=>{const x=xOf(st.t),y=yOf(st.p);if(x==null||y==null)return;
      const c=st.k==='close'?col:st.dir>0?p.win:p.loss;drawSym(ctx,st.k,st.dir,x,y,c,p.card,sel)})});
  /* 아직 일지로 안 보낸 하이퍼리퀴드 체결 */
  if(s.hlMarks&&showSym&&typeof posGhostFills==='function'){posGhostFills(base).forEach(f=>{if(f.time>=LIM)return;
    const x=xOf(f.time),y=yOf(+f.price);if(x==null||y==null||x<0||x>W)return;const dir=f.side==='buy'?1:-1;
    drawSym(ctx,f.k,dir,x,y,dir>0?p.win:p.loss,p.card,false,true)})}}
function drawSym(ctx,k,dir,x,y,col,bg,sel,ghost){const r=sel?5.5:4.5;ctx.save();ctx.globalAlpha=ghost?.55:1;ctx.lineWidth=1.4;ctx.strokeStyle=col;ctx.fillStyle=col;ctx.beginPath();
  if(k==='open'){if(dir>0){ctx.moveTo(x,y-r-1);ctx.lineTo(x+r+1,y+r);ctx.lineTo(x-r-1,y+r)}else{ctx.moveTo(x,y+r+1);ctx.lineTo(x+r+1,y-r);ctx.lineTo(x-r-1,y-r)}ctx.closePath();ctx.fill();ctx.strokeStyle=bg;ctx.lineWidth=1;ctx.stroke()}
  else if(k==='add'){ctx.arc(x,y,r-1,0,Math.PI*2);ctx.fill();ctx.strokeStyle=bg;ctx.lineWidth=1;ctx.stroke()}
  else if(k==='reduce'){ctx.arc(x,y,r-.5,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();ctx.stroke()}
  else{ctx.rect(x-r,y-r,r*2,r*2);ctx.fill();ctx.strokeStyle=bg;ctx.lineWidth=1;ctx.stroke()}
  ctx.restore()}

/* PNL: 네 칸 중 비어 있는 한 칸을 계산 (순수 함수, 테스트 가능) */
function solvePnl(o){const dir=o.side==='short'?-1:1,f=o.fee?o.feeRate/100:0,lev=o.lev>0?o.lev:NaN;
  const ks=['entry','close','qty','pnl'],empty=ks.filter(k=>!(isFinite(o[k])));
  if(empty.length!==1)return{err:empty.length?'need3':'leaveOne'};
  const miss=empty[0];let {entry:e,close:c,qty:v,pnl:P}=o,q,N;
  const toN=val=>o.unit==='margin'?val*lev:val;
  if(o.unit==='margin'&&!(lev>0))return{err:'lev'};
  if(miss==='entry'){if(o.unit==='coin'){q=v;e=(q*c*(dir-f)-P)/(q*(dir+f))}else{N=toN(v);e=c*N*(dir-f)/(P+N*(dir+f));q=N/e}}
  else{q=o.unit==='coin'?v:toN(v)/e}
  if(miss==='close')c=(P+q*e*(dir+f))/(q*(dir-f));
  if(miss==='qty'){const den=dir*(c-e)-f*(e+c);if(!den)return{err:'qty'};q=P/den;if(!(q>0))return{err:'qty'}}
  if(miss==='pnl')P=q*dir*(c-e)-f*q*(e+c);
  if(!(e>0)||!(c>0)||!(q>0)||!isFinite(P))return{err:'bad'};
  N=q*e;const margin=lev>0?N/lev:NaN,fees=(o.feeRate/100)*q*(e+c),mmr=.005;
  const liq=lev>0?(dir>0?e*(1-1/lev+mmr):e*(1+1/lev-mmr)):NaN;
  const outQty=o.unit==='coin'?q:o.unit==='notional'?N:margin;
  return{miss,entry:e,close:c,qty:outQty,coin:q,pnl:P,notional:N,margin,roe:margin>0?P/margin*100:NaN,move:(c-e)/e*100,fees,feeIn:!!o.fee,liq}}
/* 평균 진입가 */
function solveAvg(o){const rows=o.rows.map(r=>({p:cnum(r.p),v:cnum(r.q)})).filter(r=>r.p>0&&r.v>0).map(r=>({p:r.p,q:o.unit==='coin'?r.v:r.v/r.p}));
  if(!rows.length)return null;const Q=rows.reduce((s,r)=>s+r.q,0),N=rows.reduce((s,r)=>s+r.p*r.q,0),A=N/Q,dir=o.side==='short'?-1:1;
  const out={n:rows.length,avg:A,qty:Q,notional:N};
  const cur=cnum(o.cur);if(cur>0){out.cur=cur;out.upnl=dir*(cur-A)*Q;out.upct=dir*(cur-A)/A*100}
  const T=cnum(o.tgt),p=cnum(o.addp);
  if(T>0&&p>0){if(p===T||(T-A)*(p-T)<=0)out.tgtErr=true;else{const x=Q*(T-A)/(p-T);if(x>0){out.addQ=x;out.addN=x*p}else out.tgtErr=true}}
  return out}

const principles=()=>(J&&Array.isArray(J.principles)?J.principles.filter(p=>p&&p.text&&String(p.text).trim()):[]);
function recentResults(){const out=[];
  ((J&&J.trades)||[]).forEach(t=>{if(t.settle||!t.closeTime)return;out.push({t:t.closeTime,pnl:+t.pnl||0})});
  if(typeof posPendingResults==='function')out.push(...posPendingResults());
  return out.sort((a,b)=>b.t-a.t)}
function dayStartMs(ms){const z=tzMin()*60000,d=new Date(ms+z);return Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-z}
const todayPnl=()=>{const ds=dayStartMs(Date.now());return recentResults().filter(r=>r.t>=ds).reduce((a,r)=>a+r.pnl,0)};
const tiltLocked=()=>!!(CFG.tilt&&CFG.tilt.until>Date.now());
function tiltEval(){const s=S_();if(!s.tiltOn)return;const rs=recentResults();if(!rs.length)return;
  const key=String(rs[0].t);if(CFG.tilt&&CFG.tilt.key===key)return;
  let streak=0;for(const r of rs){if(r.pnl<0)streak++;else break}
  const ds=dayStartMs(Date.now()),today=rs.filter(r=>r.t>=ds).reduce((a,r)=>a+r.pnl,0);let reason=null,until=0;
  if(+s.tiltLosses>0&&streak>=+s.tiltLosses&&rs[0].pnl<0){reason=L(`${streak}번 연속 손실`,`${streak} losses in a row`);until=rs[0].t+(+s.tiltCool||30)*60000}
  if(+s.tiltDaily>0&&today<=-(+s.tiltDaily)){reason=L('오늘 손실 한도에 닿았어요','Daily loss limit reached')+` (${fmtU(today)})`;until=Math.max(until,ds+864e5)}
  if(reason&&until>Date.now()){CFG.tilt={key,until,reason};saveCfg();renderTilt();openSheet('tilt')}}
setInterval(()=>{if(!document.hidden)tiltEval()},30000);
function renderTilt(){const el=$('#tiltBar');if(!el)return;if(!tiltLocked()){el.classList.remove('on');return}
  const left=CFG.tilt.until-Date.now();el.classList.add('on');
  el.innerHTML=`<span>🔒 ${L('틸트 잠금','Tilt lock')} · ${esc(CFG.tilt.reason)} · ${fmtHM(CFG.tilt.until)}${L('까지',' until')} (${countdown(left)})</span><button class="ib" data-act="tiltOff">${L('비상 해제','Unlock')}</button>`}

function replayStep(n){if(!RP.on)return;const z=tzSec(),p=pal();
  for(let k=0;k<n&&RP.i<RP.full.length;k++){const x=RP.full[RP.i];candle.update({time:x.t/1000+z,open:x.o,high:x.h,low:x.l,close:x.c});vol.update({time:x.t/1000+z,value:x.v,color:hexA(x.c>=x.o?p.win:p.loss,'55')});idxMap.set(x.t,RP.i);M.last=x.t;RP.i++}
  if(RP.i>=RP.full.length)replayPause();redraw();renderReplayBar()}

const relayUrl=()=>String(S_().relay||'').trim().replace(/\/+$/,'');
const RLY=new Set();
async function xfetch(url,opt={}){const host=new URL(url).host,r=relayUrl();
  const via=()=>fetch(r+'/?u='+encodeURIComponent(url),{method:opt.method||'GET',headers:opt.headers,body:opt.body});
  let res;
  if(RLY.has(host)&&r)res=await via();
  else{try{res=await fetch(url,opt)}catch(e){if(!r){const x=new Error('cors');x.cors=true;throw x}RLY.add(host);res=await via()}}
  const tx=await res.text();let j=null;try{j=JSON.parse(tx)}catch(_){}
  if(!res.ok){const x=new Error((j&&(j.msg||j.retMsg||j.message||j.error))||('HTTP '+res.status));x.status=res.status;x.body=j;throw x}
  return j}
async function relayTest(){const r=relayUrl();if(!r)return L('중계 주소가 비어 있어요','No relay address');
  try{const t=await (await fetch(r+'/ping')).text();if(!/ok/.test(t))return L('응답이 이상해요: ','Unexpected reply: ')+t.slice(0,60);
    const j=await xfetch('https://api.bitget.com/api/v2/public/time');return j&&j.data?L('연결됐어요 ✓','Relay works ✓'):L('응답은 왔지만 데이터가 비었어요','Reply was empty')}
  catch(e){return L('연결 실패: ','Failed: ')+errMsg(e)}}

/* 서명 (HMAC-SHA256) */
const ENC=new TextEncoder(),HK=new Map();
async function hmac(secret,msg,out){let k=HK.get(secret);if(!k){k=await crypto.subtle.importKey('raw',ENC.encode(secret),{name:'HMAC',hash:'SHA-256'},false,['sign']);HK.set(secret,k)}
  const s=new Uint8Array(await crypto.subtle.sign('HMAC',k,ENC.encode(msg)));
  if(out==='b64'){let b='';s.forEach(c=>b+=String.fromCharCode(c));return btoa(b)}return [...s].map(c=>c.toString(16).padStart(2,'0')).join('')}

const VAULT={key:null,data:null};
async function vaultOpen(){if(VAULT.data)return VAULT.data;VAULT.data={};
  try{let k=await DB.get('exVaultKey');if(!k){k=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);await DB.set('exVaultKey',k)}VAULT.key=k;
    const b=await DB.get('exVault');if(b&&b.iv){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b.iv},k,b.ct);VAULT.data=JSON.parse(new TextDecoder().decode(pt))}}catch(e){}
  return VAULT.data}
async function vaultSave(){if(!VAULT.key)return;const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},VAULT.key,ENC.encode(JSON.stringify(VAULT.data||{})));await DB.set('exVault',{iv,ct})}

const TOFF={},GT={},GAP={binance:160,aster:160,bybit:110,okx:230,bitget:120,hl:60,lighter:150};
async function gate(ex){const g=GAP[ex]||120,now=Date.now(),t=Math.max(now,GT[ex]||0);GT[ex]=t+g;if(t>now)await sleep(t-now)}
async function toff(ex){if(TOFF[ex]!=null&&Date.now()-(TOFF[ex+'@']||0)<36e5)return TOFF[ex];let st=null;const t0=Date.now();
  try{if(ex==='binance'||ex==='aster'){const r=await xfetch(EXS[ex].host+'/fapi/v1/time');st=+r.serverTime}
    else if(ex==='bybit'){const r=await xfetch('https://api.bybit.com/v5/market/time');st=+r.time||Math.floor(+r.result.timeNano/1e6)}
    else if(ex==='okx'){const r=await xfetch('https://www.okx.com/api/v5/public/time');st=+r.data[0].ts}
    else if(ex==='bitget'){const r=await xfetch('https://api.bitget.com/api/v2/public/time');st=+r.data.serverTime}}catch(e){}
  const t1=Date.now();TOFF[ex]=st?Math.round(st-(t0+t1)/2):0;TOFF[ex+'@']=t1;return TOFF[ex]}
const rawq=p=>Object.entries(p).filter(([k,v])=>v!=null&&v!=='').map(([k,v])=>k+'='+v).join('&');
async function bnGet(ex,sec,path,params={},host){await gate(ex);const off=await toff(ex),q=rawq({...params,recvWindow:10000,timestamp:Date.now()+off});
  return xfetch((host||EXS[ex].host)+path+'?'+q+'&signature='+await hmac(sec.s,q),{headers:{'X-MBX-APIKEY':sec.k}})}

  const r=await xfetch('https://api.bybit.com'+path+(q?'?'+q:''),{headers:{'X-BAPI-API-KEY':sec.k,'X-BAPI-TIMESTAMP':ts,'X-BAPI-RECV-WINDOW':rw,'X-BAPI-SIGN':await hmac(sec.s,ts+sec.k+rw+q)}});
  if(!r||r.retCode!==0)throw new Error((r&&r.retMsg)||'Bybit');return r.result||{}}
async function okGet(sec,path,params={}){await gate('okx');const off=await toff('okx'),q=rawq(params),rp=path+(q?'?'+q:''),ts=new Date(Date.now()+off).toISOString();

async function bgGet(sec,path,params={}){await gate('bitget');const off=await toff('bitget'),ks=Object.keys(params).filter(k=>params[k]!=null&&params[k]!=='').sort(),

      await one('');if(!a._dexAt||Date.now()-a._dexAt>20000||a._dexPos){a._dexAt=Date.now();const n0=out.length;for(const d of M.dexes){try{await one(d)}catch(e){}}a._dexPos=out.length>n0}
      return out},
    async fills(a,sec,from,to,ctx){const out=[];let st=from;
      for(let g=0;g<40;g++){await gate('hl');const r=await hlPost({type:'userFillsByTime',user:a.addr,startTime:st,endTime:to,aggregateByTime:false});if(!Array.isArray(r)||!r.length)break;
        r.forEach(f=>{if(!Core.plainCoin(f.coin))return;out.push(F(a,{id:f.tid,time:+f.time,sym:f.coin,coin:f.coin,side:f.side==='B'?'buy':'sell',price:+f.px,qty:+f.sz,fee:+f.fee||0,
          feeAsset:f.feeToken||'USDC',pnl:+f.closedPnl||0,start:+f.startPosition,dir:f.dir}))});
        const mx=Math.max(...r.map(f=>+f.time));ctx.tick(Math.min(1,(mx-from)/Math.max(1,to-from)));if(r.length<2000)break;st=mx+1}
      return out}},
  lighter:{
    async pos(a){await gate('lighter');const r=await xfetch('https://mainnet.zklighter.elliot.ai/api/v1/account?by=l1_address&value='+a.addr);const out=[];
      (r.accounts||[]).forEach(ac=>(ac.positions||[]).forEach(x=>{const q=+x.position;if(!q)return;
        out.push(P(a,{sym:x.symbol,coin:x.symbol,side:+x.sign===-1?'short':'long',sz:Math.abs(q),entry:+x.avg_entry_price,val:Math.abs(+x.position_value),upnl:+x.unrealized_pnl,
          lev:+x.initial_margin_fraction?Math.round(100/+x.initial_margin_fraction):null,liq:+x.liquidation_price||null}))}));

ADP.aster={pos:ADP.binance.pos,fills:ADP.binance.fills};

/* 체결 → 0에서 0까지 하나의 매매로 묶기 */
function groupX(fills,curPos){const by={};fills.forEach(f=>{const k=f.sym+'|'+(f.ps||'');(by[k]=by[k]||[]).push(f)});
  const closed=[],open=[];let orphan=0;const sd=f=>(f.side==='buy'?1:-1)*f.qty;
  for(const k of Object.keys(by)){const arr=by[k],eps=Math.max(1e-9,Math.max(...arr.map(f=>f.qty))*1e-7);
    let p=0;if(arr[0].start==null){const tot=arr.reduce((s,f)=>s+sd(f),0);p=(curPos&&curPos[k]||0)-tot;if(Math.abs(p)<eps)p=0}
    let cur=null;
    for(const f of arr){const st=f.start!=null&&isFinite(f.start)?f.start:p,end=st+sd(f),flip=Math.abs(st)>=eps&&Math.abs(end)>=eps&&Math.sign(end)!==Math.sign(st);
      if(Math.abs(st)<eps){cur={key:k,fills:[f]}}
      else if(cur){cur.fills.push(f)}
      else orphan++;
      if(flip){const qc=Math.abs(st),r=qc/f.qty,op={...f,id:f.id+'#o',qty:Math.abs(end),fee:(f.fee||0)*(1-r),pnl:0};delete op.start;
        if(cur){cur.fills[cur.fills.length-1]={...f,id:f.id+'#c',qty:qc,fee:(f.fee||0)*r};closed.push(cur)}
        cur={key:k,fills:[op]}}
      else if(cur&&Math.abs(end)<eps){closed.push(cur);cur=null}
      p=Math.abs(end)<eps?0:end}
    if(cur)open.push(cur)}
  return{closed,open,orphan}}

/* 상태 */
const POS={by:{},list:[],err:{},at:{},busy:{},prog:{},open:{},pend:{},lp:{}};
const FS={};
async function loadFS(a){if(FS[a.id])return FS[a.id];const v=await DB.get('xf:'+a.id);FS[a.id]=v&&Array.isArray(v.fills)?v:{fills:[],sent:[],from:null,to:null};return FS[a.id]}
const saveFS=a=>DB.set('xf:'+a.id,FS[a.id]);
function importFromMs(){const d=J&&J.settings&&J.settings.importFrom;
  if(/^\d{4}-\d{2}-\d{2}$/.test(d||'')){const [y,m,dd]=d.split('-').map(Number),tz=J.settings.tzMin!=null?+J.settings.tzMin:tzMin();return Date.UTC(y,m-1,dd)-tz*60000}return null}
const autoRec=()=>!(J&&J.settings&&J.settings.autoRecord===false);
const posKey=p=>p.fsym+'|'+(p.ps||'');
function curPosMap(aid){const m={};(POS.by[aid]||[]).forEach(p=>{m[posKey(p)]=(m[posKey(p)]||0)+(p.side==='long'?p.sz:-p.sz)});return m}
const posSig=l=>(l||[]).map(p=>posKey(p)+':'+(+p.sz).toPrecision(8)).sort().join(',');

async function pollPos(a){const ad=ADP[a.ex];if(!ad||a.on===false)return;
  try{const sec=EXS[a.ex].auth==='addr'?null:await secretOf(a);if(EXS[a.ex].auth!=='addr'&&!sec)throw new Error(L('이 기기에 키가 없어요. 다시 연결해 주세요.','No key on this device. Reconnect.'));
    const ps=await ad.pos(a,sec),prev=POS.by[a.id];POS.by[a.id]=ps;POS.err[a.id]=null;POS.at[a.id]=Date.now();
    ps.forEach(p=>{const t=p.key&&tick(p.key);p.lp0=t&&t.c||null});
    if(prev&&posSig(prev)!==posSig(ps)&&!EXS[a.ex].nofills)setTimeout(()=>syncFills(a),2500)}
  catch(e){POS.err[a.id]=errMsg(e)}}
async function pollAll(){await Promise.all(accts().filter(a=>a.on!==false).map(pollPos));
  POS.list=accts().filter(a=>a.on!==false).flatMap(a=>POS.by[a.id]||[]);drawPosLines();renderPosSoft()}
let posT=null;function posLoop(){clearTimeout(posT);if(!accts().length)return;const fast=CFG.panel&&CFG.rail==='pos';
  posT=setTimeout(async()=>{if(!document.hidden)await pollAll();posLoop()},document.hidden?60000:fast?4000:12000)}

async function syncFills(a,manual){const ad=ADP[a.ex];if(!ad||!ad.fills||a.on===false||POS.busy[a.id])return;
  const sec=EXS[a.ex].auth==='addr'?null:await secretOf(a);if(EXS[a.ex].auth!=='addr'&&!sec)return;
  POS.busy[a.id]=true;POS.prog[a.id]=0;renderPosSoft();
  try{const st=await loadFS(a),now=Date.now(),lbMs=now-EXS[a.ex].lb*864e5,want=Math.max(importFromMs()??(a.added||now),lbMs);
    const ctx={posSyms:(POS.by[a.id]||[]).map(p=>p.raw),tick:f=>{POS.prog[a.id]=f;renderPosSoft()}},got=[];
    if(st.from==null){st.from=want;st.to=want}
    if(want<st.from-6e4){got.push(...await ad.fills(a,sec,want,st.from+6e4,ctx));st.from=want}
    const posA=posSig(POS.by[a.id]);
    got.push(...await ad.fills(a,sec,Math.max(st.from,(st.to||st.from)-5*6e4),now,ctx));st.to=now;
    const seen=new Set(st.fills.map(f=>f.id));let added=0;got.forEach(f=>{if(!seen.has(f.id)&&f.qty>0&&f.price>0){seen.add(f.id);st.fills.push(f);added++}});
    st.fills.sort((x,y)=>x.time-y.time||(String(x.id)<String(y.id)?-1:1));if(st.fills.length>15000)st.fills=st.fills.slice(-15000);if(st.sent.length>30000)st.sent=st.sent.slice(-30000);
    await pollPos(a);
    const stable=posA===posSig(POS.by[a.id]);
    POS.err[a.id+'f']=null;a.syncAt=now;saveCfg();await saveFS(a);
    const n=await pushClosed(a,want,stable);if(manual)toast(n?L(`끝난 매매 ${n}건을 일지에 보냈어요`,`Sent ${n} closed trade(s) to the journal`):L(`새 체결 ${added}건 · 새로 끝난 매매는 없어요`,`${added} new fill(s) · no newly closed trades`))}
  catch(e){POS.err[a.id+'f']=errMsg(e);if(manual)toast(EXS[a.ex].n+': '+errMsg(e))}
  finally{POS.busy[a.id]=false;POS.prog[a.id]=null;POS.list=accts().filter(x=>x.on!==false).flatMap(x=>POS.by[x.id]||[]);renderPosSoft();redraw()}}

async function pushClosed(a,want,stable){const st=FS[a.id];if(!st)return 0;const sent=new Set(st.sent),d=EXS[a.ex];
  const g=groupX(st.fills,curPosMap(a.id));POS.open[a.id]=g.open;
  const ready=g.closed.filter(c=>c.fills[0].time>=want&&c.fills.every(f=>!sent.has(f.id)));
  POS.pend[a.id]=ready.length;
  if(!ready.length||!stable)return 0;
  const mk=gs=>{const fills=[],rep=[];gs.forEach(c=>{c.fills.forEach((f,j)=>{fills.push({time:f.time,symbol:f.sym,side:f.side,positionSide:f.ps&&/^(LONG|SHORT)$/.test(f.ps)?f.ps.toLowerCase():undefined,price:f.price,qty:f.qty,
      fee:Math.abs(f.fee||0),feeAsset:f.feeAsset||'USDT',pnl:j===0?0:(f.pnl||0),id:f.id});st.sent.push(f.id)});
    if(d.rep){const l=c.fills[c.fills.length-1];rep.push({symbol:l.sym,pnl:+c.fills.reduce((s,f)=>s+(+f.pnl||0),0).toFixed(2),closeTime:l.time})}});
    const o={fillog:1,exchange:d.n,timezone:'UTC',fills};if(d.rep)o.reported=rep;return JSON.stringify(o)};
  if(autoRec()){const bs=d.perGroup?ready.map(c=>[c]):[ready],q=(await DB.get('autoImport'))||[];
    bs.forEach((b,i)=>q.push({id:Date.now().toString(36)+i+Math.random().toString(36).slice(2,6),txt:mk(b),n:b.length,ex:d.n,rep:!!d.rep}));
    await saveFS(a);await DB.set('autoImport',q);flSend({type:'fillview:autoImport'})}
  else{const txt=mk(ready);let pi=await DB.get('pendingImport');try{if(pi){const o=JSON.parse(pi),n=JSON.parse(txt);if(o.exchange===d.n){o.fills=o.fills.concat(n.fills);if(n.reported)o.reported=(o.reported||[]).concat(n.reported);pi=JSON.stringify(o)}else pi=txt}else pi=txt}catch(e){pi=txt}
    await saveFS(a);await DB.set('pendingImport',pi);CFG.pendImp=(CFG.pendImp||0)+ready.length;saveCfg();
    toast(L(`끝난 매매 ${ready.length}건 · 일지에서 확인하고 저장하세요`,`${ready.length} closed trade(s) · review and save in the journal`))}
  POS.pend[a.id]=0;
  CFG.recLog=[{t:Date.now(),ex:d.n,n:ready.length,auto:autoRec()},...(CFG.recLog||[])].slice(0,20);saveCfg();
  return ready.length}

/* 일지 쪽 계산(틸트 등)에 쓰는: 아직 일지에 안 들어간 끝난 매매 */
function posPendingResults(){const out=[];accts().forEach(a=>{const st=FS[a.id];if(!st)return;const sent=new Set(st.sent);
  groupX(st.fills,curPosMap(a.id)).closed.forEach(c=>{if(!c.fills.every(f=>!sent.has(f.id)))return;const l=c.fills[c.fills.length-1];
    out.push({t:l.time,pnl:c.fills.reduce((s,f)=>s+(+f.pnl||0)-Math.abs(+f.fee||0),0)})})});return out}

function posGhostFills(base){const out=[];accts().forEach(a=>(POS.open[a.id]||[]).forEach(g=>{const s0=g.fills[0]&&g.fills[0].side;g.fills.forEach((f,j)=>{if(coreBase(f.coin)===base)out.push({...f,k:j===0?'open':f.side===s0?'add':'reduce'})})}));return out}

/* 실시간 값: 거래소가 준 미실현 손익 + 그 뒤 시세 움직임 */
function livePos(p){const t=p.key&&tick(p.key),lp=t&&t.c;const d=p.side==='long'?1:-1;
  if(lp&&p.lp0&&Math.abs(lp/p.lp0-1)<.2){const mk=(p.mark||lp)*(lp/p.lp0);return{mark:mk,upnl:(+p.upnl||0)+(lp-p.lp0)*p.sz*d}}
  return{mark:p.mark,upnl:+p.upnl||0}}
function posTotals(){let u=0,v=0;POS.list.forEach(p=>{const l=livePos(p);u+=l.upnl;v+=Math.abs(p.sz*(l.mark||p.entry||0))});return{u,v,n:POS.list.length}}

      const oa=last-c,op=last/(1+c/100),o24=(oa>=lo*.999&&oa<=hi*1.001)?oa:op;const fr8=fm.has(x.symbol)&&SC.ltK?fm.get(x.symbol)*SC.ltK:null;
      return R('lighter',{sym:x.symbol,base:x.symbol,last,o24,q:x.daily_quote_token_volume,fund:fr8,fh:8,oi:+x.open_interest*last,rough:true})})}};
async function scLoad(ex,force){if(SC.busy&&SC.busy[ex])return;if(!force&&SC.at[ex]&&Date.now()-SC.at[ex]<45000)return;SC.busy=SC.busy||{};SC.busy[ex]=1;
  try{SC.t[ex]=await LOAD[ex]();SC.at[ex]=Date.now();SC.err[ex]=null}catch(e){SC.err[ex]=errMsg(e)}finally{SC.busy[ex]=0;scSoft()}}
const scLoadAll=force=>Promise.all(EXORDER.map(ex=>scLoad(ex,force)));
let scT=null;function scSoft(){if(scT)return;scT=setTimeout(()=>{scT=null;if(CFG.panel&&CFG.rail==='screen')renderScreener(true)},400)}

/* 일봉: 오늘 09:00 시가 · 7일 전 시가 · 오늘 거래대금 */
const KL={
  async binance(sym,n){const r=await getJ(BN+'/fapi/v1/klines?symbol='+sym+'&interval=1d&limit='+n);return r.map(x=>({t:+x[0],o:+x[1],c:+x[4],qv:+x[7]}))},
  async aster(sym,n){const r=await xfetch(EXS.aster.host+'/fapi/v1/klines?symbol='+sym+'&interval=1d&limit='+n);return r.map(x=>({t:+x[0],o:+x[1],c:+x[4],qv:+x[7]}))},
  async bybit(sym,n){const r=await xfetch('https://api.bybit.com/v5/market/kline?category=linear&symbol='+sym+'&interval=D&limit='+n);return ((r.result||{}).list||[]).map(x=>({t:+x[0],o:+x[1],c:+x[4],qv:+x[6]}))},
  async okx(sym,n){const r=await xfetch('https://www.okx.com/api/v5/market/candles?instId='+sym+'&bar=1Dutc&limit='+n);return (r.data||[]).map(x=>({t:+x[0],o:+x[1],c:+x[4],qv:+x[7]}))},
  async bitget(sym,n){const r=await xfetch('https://api.bitget.com/api/v2/mix/market/candles?symbol='+sym+'&productType=USDT-FUTURES&granularity=1Dutc&limit='+n);return (r.data||[]).map(x=>({t:+x[0],o:+x[1],c:+x[4],qv:+x[6]}))},
  async hl(sym,n){await gate('hl');const t0=utc0()-(n-1)*864e5,r=await hlPost({type:'candleSnapshot',req:{coin:sym,interval:'1d',startTime:t0,endTime:Date.now()}});
    return (r||[]).map(x=>({t:+x.t,o:+x.o,c:+x.c,qv:+x.v*(+x.o+ +x.c)/2}))}};
async function opOf(ex,sym){const k=ex+':'+sym;if(SC.op[k])return SC.op[k];const ks=await KL[ex](sym,8),d0=utc0(),d7=d0-7*864e5;
  const a=ks.find(x=>x.t===d0),b=ks.find(x=>x.t===d7);SC.op[k]={o0:a?a.o:null,o7:b?b.o:null};return SC.op[k]}
async function scSweep(){const id=dayId();if(SC.sweep.on)return;
  if(SC.opDay!==id){const c=await DB.get('scrDay');if(c&&c.day===id){SC.op=c.op||{}}else SC.op={};SC.opDay=id}
  const bn=(SC.t.binance||[]).filter(r=>r.q>0);if(!bn.length)return;
  const bnSet=new Set(bn.map(r=>r.coin));
  const chg=r=>r.o24?r.last/r.o24-1:0;
  const pri=[...bn].sort((a,b)=>Math.abs(chg(b))-Math.abs(chg(a))).slice(0,90).concat([...bn].sort((a,b)=>b.q-a.q)).map(r=>['binance',r.sym]);
  ['bybit','hl','aster','okx','bitget'].forEach(ex=>(SC.t[ex]||[]).forEach(r=>{if(!bnSet.has(r.coin)&&r.q>2e5)pri.push([ex,r.sym])}));
  const todo=[...new Map(pri.map(x=>[x[0]+':'+x[1],x])).values()].filter(([ex,s])=>!SC.op[ex+':'+s]);
  if(!todo.length)return;SC.sweep={on:true,done:0,tot:todo.length};scSoft();
  const lane={binance:[],other:[]};todo.forEach(x=>(x[0]==='binance'?lane.binance:lane.other).push(x));
  await Promise.all([pool(lane.binance,4,async([ex,s])=>{await opOf(ex,s);SC.sweep.done++;if(SC.sweep.done%25===0)scSoft()}),
    pool(lane.other,2,async([ex,s])=>{await opOf(ex,s);SC.sweep.done++;if(SC.sweep.done%10===0)scSoft()})]);
  SC.sweep.on=false;DB.set('scrDay',{day:id,op:SC.op});scSoft()}

/* 같은 코인을 다른 거래소 값으로 보완할 때는 가격이 3% 안쪽일 때만 */
function refOp(r,field){const own=SC.op[r.ex+':'+r.sym];if(own&&own[field])return own[field];
  if(field==='o0'&&r.o0n)return r.o0n;
  const b=(SC.t.binance||[]).find(x=>x.coin===r.coin&&x.base===r.base)||(SC.t.binance||[]).find(x=>x.coin===r.coin);if(!b||Math.abs(r.last/b.last-1)>.03)return null;
  const bo=SC.op['binance:'+b.sym];return bo&&bo[field]?bo[field]*(r.last/b.last):null}
const ch0=r=>{const o=r.o0n||refOp(r,'o0');return o?r.last/o-1:null};
const ch7=r=>{const o=refOp(r,'o7');return o?r.last/o-1:null};
function byCoin(exs,minQ){const m=new Map();exs.forEach(ex=>(SC.t[ex]||[]).forEach(r=>{if(r.q<minQ)return;const c=m.get(r.coin)||{coin:r.coin,rows:[],q:0};c.rows.push(r);c.q+=r.q;m.set(r.coin,c)}));
  m.forEach(c=>{c.rows.sort((a,b)=>b.q-a.q);c.main=c.rows[0]});return [...m.values()]}
const exTags=rows=>rows.slice(0,4).map(r=>EXS[r.ex].s).join('·')+(rows.length>4?'+':'');

/* 롱숏 · 미결제약정: 차트 종목 하나를 여러 거래소에서 */
async function scLS(force){const b=curBase();if(!force&&SC.lsK===b&&Date.now()-SC.lsAt<55000)return;SC.lsK=b;SC.lsAt=Date.now();const out={coin:b,oi:{},hist:{},ls:{},top:{},at:Date.now()};
  const find=ex=>(SC.t[ex]||[]).filter(r=>r.coin===b).sort((x,y)=>y.q-x.q)[0];
  const by=find('bybit'),ok=find('okx'),bg=find('bitget'),hl=find('hl'),as=find('aster'),lt=find('lighter'),bn=find('binance');
  const jobs=[];
  if(by)jobs.push((async()=>{const [h,l]=await Promise.all([xfetch('https://api.bybit.com/v5/market/open-interest?category=linear&symbol='+by.sym+'&intervalTime=1h&limit=25'),
      xfetch('https://api.bybit.com/v5/market/account-ratio?category=linear&symbol='+by.sym+'&period=1h&limit=1').catch(()=>null)]);
    const hs=((h.result||{}).list||[]).map(x=>({t:+x.timestamp,v:+x.openInterest*by.last})).sort((a,b)=>a.t-b.t);if(hs.length)out.hist.bybit=hs;
    const z=l&&((l.result||{}).list||[])[0];if(z)out.ls.bybit=+z.buyRatio})());
  if(ok)jobs.push((async()=>{const [h,l,t]=await Promise.all([xfetch('https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-history?instId='+ok.sym+'&period=1H&limit=25'),
      xfetch('https://www.okx.com/api/v5/rubik/stat/contracts/long-short-account-ratio-contract?instId='+ok.sym+'&period=1H&limit=1').catch(()=>null),
      xfetch('https://www.okx.com/api/v5/rubik/stat/contracts/long-short-position-ratio-contract-top-trader?instId='+ok.sym+'&period=1H&limit=1').catch(()=>null)]);
    const hs=(h.data||[]).map(x=>({t:+x[0],v:+x[3]})).filter(x=>x.v>0).sort((a,b)=>a.t-b.t);if(hs.length)out.hist.okx=hs;
    const r1=l&&l.data&&l.data[0]&&+l.data[0][1];if(r1>0)out.ls.okx=r1/(1+r1);const r2=t&&t.data&&t.data[0]&&+t.data[0][1];if(r2>0)out.top.okx=r2/(1+r2)})());
  if(bg)jobs.push((async()=>{const l=await xfetch('https://api.bitget.com/api/v2/mix/market/account-long-short?symbol='+bg.sym+'&period=1h');
    const arr=(l.data||[]).slice().sort((a,b)=>+b.ts-+a.ts),z=arr[0];if(z&&+z.longAccountRatio>0)out.ls.bitget=+z.longAccountRatio>1?+z.longAccountRatio/100:+z.longAccountRatio})());
  if(as)jobs.push((async()=>{const r=await xfetch(EXS.aster.host+'/fapi/v1/openInterest?symbol='+as.sym);if(r&&+r.openInterest)as.oi=+r.openInterest*as.last})());
  await Promise.all(jobs.map(p=>p.catch(()=>{})));
  const d=M.ls;if(bn&&d&&d.sym===bn.sym){if(d.oih&&d.oih.length)out.hist.binance=d.oih.map(x=>({t:+x.timestamp,v:+x.sumOpenInterestValue}));
    const a=d.acc&&d.acc[d.acc.length-1];if(a)out.ls.binance=+a.longAccount;const tp=d.top&&d.top[d.top.length-1];if(tp)out.top.binance=+tp.longAccount;
    const tk=d.taker&&d.taker[d.taker.length-1];if(tk)out.taker={now:+tk.buySellRatio,avg:d.taker.reduce((s,x)=>s+ +x.buySellRatio,0)/d.taker.length};
    if(d.oi)out.oi.binance=d.oi*bn.last}
  [['bybit',by],['okx',ok],['bitget',bg],['hl',hl],['aster',as],['lighter',lt]].forEach(([ex,r])=>{if(r&&r.oi)out.oi[ex]=r.oi});
  if(!out.oi.binance&&out.hist.binance)out.oi.binance=out.hist.binance[out.hist.binance.length-1].v;
  SC.ls=out;scSoft()}

async function scVol(){if(SC.volBusy)return;SC.volBusy=true;scSoft();
  try{if(!SC.t.binance||!SC.t.bybit&&!SC.err.bybit)return;const cands=byCoin(['binance','bybit','okx','bitget','hl','aster'],1e6).sort((a,b)=>b.q-a.q).slice(0,26),d0=utc0(),jobs=[];
    cands.forEach(c=>c.rows.forEach(r=>{if(KL[r.ex])jobs.push([c,r])}));const got=new Map();
    await pool(jobs,6,async([c,r])=>{const ks=await KL[r.ex](r.sym,2),k=ks.find(x=>x.t===d0);if(k){const e=got.get(c.coin)||{coin:c.coin,v:0,by:{},key:c.main.key,main:c.main};e.v+=k.qv;e.by[r.ex]=(e.by[r.ex]||0)+k.qv;got.set(c.coin,e)}});
    const rows=[...got.values()].sort((a,b)=>b.v-a.v).map(e=>({coin:e.coin,v:e.v,key:e.key,c0:ch0(e.main),share:Object.entries(e.by).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([x,v])=>EXS[x].s+' '+Math.round(v/e.v*100)+'%').join(' ')}));
    SC.vol={day:dayId(),rows};SC.volAt=Date.now()}
  catch(e){}finally{SC.volBusy=false;scSoft()}}

/* ---------- cTrader (공식 Open API · 보기 전용) · MT5 (보고서 파일) ---------- */
EXS.ctrader={n:'cTrader',s:'CT',k:'fx',auth:'oauth',lb:3650,perGroup:true,rep:true,page:'https://openapi.ctrader.com/apps'};
EXS.mt5={n:'MT5',s:'MT',k:'fx',auth:'file'};
GAP.ctrader=250;
const CT={ws:{},pend:{},seq:0,info:{}};
const ctSym=(I,id)=>String((I&&I.sym[id])||id).replace(/[\/\s.]/g,'').toUpperCase();
function ctCoin(nm){const b=String(nm).replace(/(USDT|USD)$/,'');return b&&b!==nm&&(bnKeyFor(coreBase(b))||hlKeyFor(coreBase(b)))?b:nm}
const isBuy=v=>v===1||v==='BUY';

async function ctCred(){const v=await vaultOpen();let c=v.ctcred;if(!c)return null;
  if(c.exp&&c.exp-Date.now()<3*864e5&&relayUrl()){try{const t=await (await fetch(relayUrl()+'/ct/refresh?rt='+encodeURIComponent(c.rt))).json();
      if(t.accessToken){c={...c,at:t.accessToken,rt:t.refreshToken||c.rt,exp:Date.now()+(+t.expiresIn||2628000)*1000,cid:t.clientId||c.cid,cs:t.clientSecret||c.cs};v.ctcred=c;await vaultSave();
        Object.values(CT.ws).forEach(o=>{try{o&&o.ws.close()}catch(e){}})}}catch(e){}}
  return c}
function ctReq(o,type,payload,ms){const id='fv'+(++CT.seq);return new Promise((res,rej)=>{CT.pend[id]={res,rej};
  try{o.ws.send(JSON.stringify({clientMsgId:id,payloadType:type,payload:payload||{}}))}catch(e){delete CT.pend[id];rej(e);return}
  setTimeout(()=>{if(CT.pend[id]){delete CT.pend[id];rej(new Error(L('cTrader 응답이 없어요','No reply from cTrader')))}},ms||20000)})}
function ctOpen(live,cred){const key=live?'live':'demo';const cur=CT.ws[key];if(cur&&cur.ws.readyState<2)return cur.ready;
  const ws=new WebSocket('wss://'+(live?'live':'demo')+'.ctraderapi.com:5036'),o={ws,acc:new Set(),hb:null};
  o.ready=new Promise((res,rej)=>{ws.onopen=async()=>{try{await ctReq(o,2100,{clientId:cred.cid,clientSecret:cred.cs});res(o)}catch(e){rej(e)}};
    ws.onerror=()=>rej(new Error(L('cTrader 서버에 연결하지 못했어요','Could not reach cTrader')))});
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(_){return}const p=m.clientMsgId&&CT.pend[m.clientMsgId];
    if(p){delete CT.pend[m.clientMsgId];if(m.payloadType===2142||m.payloadType===50)p.rej(new Error((m.payload&&(m.payload.description||m.payload.errorCode))||'cTrader'));else p.res(m.payload||{})}
    else ctEvent(m)};
  ws.onclose=()=>{clearInterval(o.hb);if(CT.ws[key]===o)CT.ws[key]=null};
  o.hb=setInterval(()=>{try{ws.readyState===1&&ws.send(JSON.stringify({payloadType:51,payload:{}}))}catch(e){}},10000);
  CT.ws[key]=o;return o.ready}
function ctEvent(m){const p=m.payload||{},a=accts().find(x=>x.ex==='ctrader'&&+x.ctid===+p.ctidTraderAccountId);
  if(m.payloadType===2126&&a){const t=p.executionType;if([3,11,'ORDER_FILLED','ORDER_PARTIAL_FILL'].includes(t)){setTimeout(()=>{pollPos(a).then(()=>{POS.list=accts().filter(x=>x.on!==false).flatMap(x=>POS.by[x.id]||[]);renderPosSoft()});syncFills(a)},1500)}}
  else if(m.payloadType===2147){toast(L('cTrader 로그인이 만료됐어요. 연결 관리에서 다시 로그인해 주세요.','cTrader sign-in expired. Sign in again from Manage.'))}
  else if(m.payloadType===2164&&a){Object.values(CT.ws).forEach(o=>o&&o.acc.delete(+a.ctid))}}
async function ctAcct(a){const cred=await ctCred();if(!cred)throw new Error(L('cTrader 로그인이 필요해요','Sign in to cTrader'));
  const o=await ctOpen(a.live,cred),id=+a.ctid;
  if(!o.acc.has(id)){await ctReq(o,2102,{ctidTraderAccountId:id,accessToken:cred.at});o.acc.add(id)}
  if(!CT.info[id]){const [tr,sy]=await Promise.all([ctReq(o,2121,{ctidTraderAccountId:id}),ctReq(o,2114,{ctidTraderAccountId:id,includeArchivedSymbols:true})]);
    const m={};(sy.symbol||[]).forEach(x=>m[x.symbolId]=x.symbolName);(sy.archivedSymbol||[]).forEach(x=>{if(!m[x.symbolId])m[x.symbolId]=x.name});
    const t=tr.trader||{};CT.info[id]={md:t.moneyDigits!=null?+t.moneyDigits:2,lev:t.leverageInCents?+t.leverageInCents/100:null,sym:m}}
  return o}
ADP.ctrader={
  async pos(a){const o=await ctAcct(a),I=CT.info[+a.ctid];await gate('ctrader');
    const [r,u]=await Promise.all([ctReq(o,2124,{ctidTraderAccountId:+a.ctid}),ctReq(o,2187,{ctidTraderAccountId:+a.ctid}).catch(()=>null)]);
    const um={},umd=u&&u.moneyDigits!=null?+u.moneyDigits:I.md;((u&&u.positionUnrealizedPnL)||[]).forEach(x=>um[x.positionId]=+x.netUnrealizedPnL/10**umd);
    return (r.position||[]).filter(p=>p.tradeData&&+p.tradeData.volume>0).map(p=>{const td=p.tradeData,nm=ctSym(I,td.symbolId);
      return P(a,{sym:nm,coin:ctCoin(nm),side:isBuy(td.tradeSide)?'long':'short',ps:'P'+p.positionId,sz:+td.volume/100,entry:+p.price,upnl:um[p.positionId]!=null?um[p.positionId]:0,lev:I.lev,t:+td.openTimestamp||null})})},
  async fills(a,sec,from,to,ctx){const o=await ctAcct(a),I=CT.info[+a.ctid],out=[],W=windows(from,to);
    const get=async(s,e,dep)=>{await gate('ctrader');const r=await ctReq(o,2133,{ctidTraderAccountId:+a.ctid,fromTimestamp:s,toTimestamp:e,maxRows:1000},30000);
      if(r.hasMore&&dep<8&&e-s>6e4){const m=Math.floor((s+e)/2);await get(s,m,dep+1);await get(m+1,e,dep+1);return}
      (r.deal||[]).forEach(d=>{const st=d.dealStatus;if(![2,3,'FILLED','PARTIALLY_FILLED'].includes(st))return;const q=+d.filledVolume/100;if(!(q>0))return;
        const cp=d.closePositionDetail,md=d.moneyDigits!=null?+d.moneyDigits:cp&&cp.moneyDigits!=null?+cp.moneyDigits:I.md,k=10**md,nm=ctSym(I,d.symbolId);
        let pnl=0;if(cp){const com=+cp.commission||0;pnl=(+cp.grossProfit+(+cp.swap||0)-Math.abs(com))/k}
        out.push(F(a,{id:d.dealId,time:+d.executionTimestamp,sym:nm,coin:ctCoin(nm),side:isBuy(d.tradeSide)?'buy':'sell',ps:'P'+d.positionId,price:+d.executionPrice,qty:q,
          fee:Math.abs(+d.commission||0)/k,feeAsset:'USD',pnl}))})};
    for(let i=0;i<W.length;i++){await get(W[i][0],W[i][1],0);ctx.tick((i+1)/W.length)}
    return out}};

async function ctLogin(){const r=relayUrl();if(!r){CN.msg=L('먼저 설정 → 거래소 연결에서 중계 서버 주소를 넣어 주세요.','Add the relay address in Settings first.');return reSheet()}

  catch(e){CN.msg=errMsg(e);reSheet()}}
async function ctCallback(){const q=new URLSearchParams(location.search),code=q.get('code');if(!code)return;history.replaceState(null,'',location.pathname+location.hash);
  const r=relayUrl();if(!r){toast(L('중계 서버 주소가 없어서 cTrader 연결을 끝내지 못했어요','No relay address, so cTrader sign-in could not finish'));return}
  try{const t=await (await fetch(r+'/ct/token?code='+encodeURIComponent(code)+'&redirect='+encodeURIComponent(location.origin+location.pathname))).json();
    if(!t||!t.accessToken)throw new Error((t&&t.error)||'token');
    const cred={at:t.accessToken,rt:t.refreshToken,exp:Date.now()+(+t.expiresIn||2628000)*1000,cid:t.clientId,cs:t.clientSecret};
    const v=await vaultOpen();v.ctcred=cred;await vaultSave();
    let o;try{o=await ctOpen(true,cred)}catch(e){o=await ctOpen(false,cred)}
    const res=await ctReq(o,2149,{accessToken:cred.at}),list=res.ctidTraderAccount||[];let n=0;
    list.forEach(x=>{const id='ct'+x.ctidTraderAccountId;if(accts().some(a=>a.id===id))return;
      accts().push({id,ex:'ctrader',name:(x.brokerTitleShort||'cTrader')+(x.traderLogin?' '+x.traderLogin:''),ctid:+x.ctidTraderAccountId,live:!!x.isLive,login:x.traderLogin||'',on:true,added:Date.now()});n++});
    saveCfg();let fd='';try{fd=localStorage.getItem('fvCtFrom')||''}catch(e){}if(!fd)fd=dayKeyTz(Date.now());
    if(!(J&&J.settings&&J.settings.importFrom)){if(J){J.settings=J.settings||{};J.settings.importFrom=fd}flSend({type:'fillview:setImport',importFrom:fd})}
    toast(L(`cTrader 계좌 ${n}개를 연결했어요 (보기 전용)`,`Connected ${n} cTrader account(s), view only`))}
  catch(e){toast(L('cTrader 연결 실패: ','cTrader sign-in failed: ')+errMsg(e))}}

  if(e.target.id==='dim'){closeSheet();return}
  if(e.target.closest('#symBtn')){openSheet('sym');return}
  if(e.target.closest('#setBtn')){openSheet('set');return}
  if(e.target.closest('#spClose')){CFG.panel=false;saveCfg();renderRail();bookLoop();return}
  if(e.target.closest('#liveBtn')){await reloadChart();return}
  if(e.target.closest('#disc')){goView('log');flSend({type:'fillview:tab',tab:'dash'});return}
  const el=e.target.closest('[data-cnex],[data-acdel],[data-rp],[data-sh],[data-aldel],[data-afop],[data-tf]:not(input):not(select),[data-rail],[data-ctab],[data-cset],[data-cact],[data-star],[data-sym],[data-wlg],[data-wlsort],[data-sctab],[data-obr],[data-obex],[data-evcat],[data-evdel],[data-set],[data-act]');
  if(!el)return;const D=el.dataset;
  if(D.cnex){CN.ex=D.cnex;CN.msg='';reSheet();return}
  if(D.acdel){connDel(D.acdel);return}
  if(D.rp){const a=D.rp;if(a==='play')replayPlay();else if(a==='pause')replayPause();else if(a==='fwd')replayStep(1);else if(a==='back')replayBack();else if(a==='speed'){RP.speed={1:2,2:5,5:10,10:1}[RP.speed]||2;if(RP.timer)replayPlay();else renderReplayBar()}else if(a==='stop'||a==='cancel'){replayStop()}renderTf();return}
  if(D.sh){SH[D.sh]=D.v;const sb=$('#sheet .sb'),y=sb?sb.scrollTop:0;openSheet('share');const s2=$('#sheet .sb');if(s2)s2.scrollTop=y;drawShare();return}
  if(D.aldel){CFG.alerts=CFG.alerts.filter(a=>a.id!==D.aldel);saveCfg();drawAlertLines();renderAlerts();return}
  if(D.afop){AF.op=D.afop;renderAlerts();return}
  if(D.tf){setTf(D.tf);return}
  if(D.rail){openRail(D.rail);return}
  if(D.ctab){C().tab=D.ctab;saveCfg();renderCalc();return}
  if(D.cset){C()[D.cset]=D.v;C().res=null;saveCfg();renderCalc();return}
  if(D.cact){const c=C(),px=curPx();
    if(D.cact==='calc')calcRun();
    else if(D.cact==='reset'){Object.assign(c,{entry:'',close:'',qty:'',pnl:'',res:null});saveCfg();renderCalc()}
    else if(D.cact==='last'){if(px){c[D.k]=fmtIn(px,'entry');if(c.res&&c.res.miss===D.k)c.res=null;saveCfg();renderCalc()}}
    else if(D.cact==='rowAdd'){c.rows.push({p:'',q:''});saveCfg();renderCalc()}
    else if(D.cact==='rowLast'){c.rows.push({p:px?fmtIn(px,'entry'):'',q:''});saveCfg();renderCalc()}
    else if(D.cact==='rowDel'){c.rows.splice(+D.i,1);if(!c.rows.length)c.rows.push({p:'',q:''});saveCfg();renderCalc()}
    else if(D.cact==='aclear'){Object.assign(c,{rows:[{p:'',q:''},{p:'',q:''}],cur:'',tgt:'',addp:''});saveCfg();renderCalc()}
    return}
  if(D.star){const i=CFG.fav.indexOf(D.star);if(i>=0)CFG.fav.splice(i,1);else CFG.fav.push(D.star);saveCfg();if(CFG.panel&&CFG.rail==='watch')renderWatch();renderSymList();renderTick();bnWS.open();return}
  if(D.sym){setSym(D.sym);if(isMobile()&&CFG.panel){CFG.panel=false;renderRail()}return}
  if(D.wlg){CFG.wlOpen[D.wlg]=!CFG.wlOpen[D.wlg];saveCfg();renderWatch();return}
  if(D.wlsort){CFG.wlSort=D.wlsort;saveCfg();renderWatch();return}
  if(D.sctab){CFG.scTab=D.sctab;saveCfg();renderScreener();return}
  if(D.obr){S_().obRange=+D.obr;saveCfg();M.book=null;renderBook();fetchBooks();return}
  if(D.obex){S_().obEx[D.obex]=!S_().obEx[D.obex];saveCfg();fetchBooks();renderBook();return}
  if(D.evcat){const c=S_().evCats;c[D.evcat]=c[D.evcat]===false;saveCfg();renderEvents();redraw();return}
  if(D.evdel){CFG.events=CFG.events.filter(x=>x.id!==D.evdel);saveCfg();renderEvents();redraw();return}
  if(D.set){const old=getP(D.set),v=typeof old==='number'?+D.v:D.v;setP(D.set,v);afterSet(D.set);return}
  switch(D.act){
    case 'close':closeSheet();break;
    case 'evTog':S_().evShow=!S_().evShow;saveCfg();renderTf();redraw();break;
    case 'snap':if(SEL)snapTo({kind:'trade',id:SEL});else openSheet('snap');break;
    case 'snapDay':closeSheet();snapTo({kind:'day'});break;
    case 'snapDl':closeSheet();snapTo('download');break;
    case 'check':openSheet('check');break;
    case 'chkDone':sendChecks();closeSheet();toast(L('체크 완료 · 오늘 일지에 기록했어요','Checked · saved to today’s journal'));break;
    case 'goRules':closeSheet();goView('log');flSend({type:'fillview:tab',tab:'more'});break;
    case 'tiltOff':CFG.tilt.until=0;saveCfg();renderTilt();break;
    case 'connOpen':closeSheet();openSheet('conn');break;
    case 'cnSave':connSave();break;
    case 'ctLogin':ctLogin();break;
    case 'mt5Imp':closeSheet();goView('log');flSend({type:'fillview:tab',tab:'imp'});break;
    case 'posSync':accts().forEach(a=>{if(!EXS[a.ex].nofills)syncFills(a,true)});pollAll();break;
    case 'impSet':goView('log');flSend({type:'fillview:tab',tab:'more',focus:'imp'});break;
    case 'pendOpen':goView('log');flSend({type:'fillview:import'});CFG.pendImp=0;saveCfg();break;
    case 'relayTest':{el.disabled=true;const m=await relayTest();el.disabled=false;toast(m);break}
    case 'relayHow':CFG._relayHow=!CFG._relayHow;{const sb=$('#sheet .sb'),y=sb?sb.scrollTop:0;openSheet('set');const s2=$('#sheet .sb');if(s2)s2.scrollTop=y}break;
    case 'relayCopy':try{await navigator.clipboard.writeText(RELAY_CODE);toast(L('Worker 코드를 복사했어요. Cloudflare 편집기에 붙여넣으세요.','Worker code copied. Paste it into the Cloudflare editor.'))}catch(_){toast(L('복사하지 못했어요','Could not copy'))}break;
    case 'tiltReview':closeSheet();goView('log');flSend({type:'fillview:tab',tab:'journal'});break;
    case 'replay':if(RP.on||RP.pick)replayStop();else if(SEL){const t=findTrade(SEL);replayStart((t.openTime||t.closeTime)-TF[CFG.tf]*30)}else replayPick();renderTf();break;
    case 'rpSel':{const t=findTrade(SEL);if(t){$('#tpop').classList.remove('on');replayStart((t.openTime||t.closeTime)-TF[CFG.tf]*30);renderTf()}break}
    case 'shareSel':if(SEL)openShare('trade',SEL);break;
    case 'shareWeek':closeSheet();openShare('week');break;
    case 'shSave':shareSave();break;
    case 'shShare':shareShare();break;
    case 'notifPerm':try{await Notification.requestPermission()}catch(e){}renderAlerts();break;
    case 'afLast':{const p=(tick(CFG.sym)||{}).c;if(p){AF.val=fmtP(p).replace(/,/g,'');renderAlerts()}break}
    case 'afPick':pickAlert=!pickAlert;if(isMobile()&&pickAlert){CFG.panel=false;renderRail()}renderAlerts();if(pickAlert)toast(L('차트에서 알림 받을 가격을 누르세요','Tap the chart at the alert price'));break;
    case 'afAdd':{const v=cnum(AF.val);if(!(v>0)){toast(L('값을 넣어 주세요','Enter a value'));break}
      addAlert({type:AF.type,sym:ALT[AF.type][1]==='sym'?CFG.sym:'',op:AF.op,val:v,once:AF.type==='price'});AF.val='';toast(L('알림을 추가했어요','Alert added'));break}
    case 'openInJ':goView('log');flSend({type:'fillview:openTrade',id:SEL});break;
    case 'snapSel':if(SEL)snapTo({kind:'trade',id:SEL});break;
    case 'unsel':SEL=null;$('#tpop').classList.remove('on');redraw();break;
    case 'evAdd':{const ti=($('#evT').value||'').trim(),dv=$('#evD').value;if(!ti||!dv){toast(L('이름과 날짜를 넣어 주세요','Add a name and a date'));break}
      const [dd,tt]=dv.split('T'),[y,mo,d]=dd.split('-').map(Number),[h,mi]=tt.split(':').map(Number);
      CFG.events.push({id:Date.now().toString(36),title:ti,ms:Date.UTC(y,mo-1,d,h,mi)-tzMin()*60000});saveCfg();renderEvents();redraw();break}
    case 'setExport':{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(CFG,null,2)],{type:'application/json'}));a.download='fillview-settings.json';a.click();break}
    case 'setImport':{const i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=async()=>{try{const o=JSON.parse(await i.files[0].text());CFG=mergeCfg(o);saveCfg();LANG=resolveLang();applyTheme();renderAll();openSheet('set');toast(L('설정을 가져왔어요','Settings imported'))}catch(_){toast(L('설정 파일을 읽지 못했어요','Could not read that file'))}};i.click();break}
    case 'setReset':if(confirm(L('설정을 처음 상태로 되돌릴까요? 매매 기록은 그대로예요.','Reset all settings? Your trades stay as they are.'))){const keep={sym:CFG.sym,fav:CFG.fav,accts:CFG.accts,events:CFG.events};CFG=mergeCfg(keep);saveCfg();LANG=resolveLang();applyTheme();renderAll();openSheet('set')}break}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='wlQ'){renderWatch();return}if(t.id==='symQ2'){renderSymList();return}
  if(t.dataset.cn){CN[t.dataset.cn]=t.value;return}
  if(t.dataset.shin&&t.type!=='checkbox'){SH[t.dataset.shin]=t.value;clearTimeout(window._shT);window._shT=setTimeout(drawShare,300);return}
  if(t.dataset.af&&t.tagName==='INPUT'){AF[t.dataset.af]=t.value;return}
  if(t.dataset.calc&&t.tagName==='INPUT'&&t.type!=='checkbox'){const c=C(),k=t.dataset.calc;c[k]=t.value;if(c.res&&c.res.miss===k){c.res.miss=null;t.classList.remove('solved')}saveCfg();if(c.tab==='avg')updAvg();return}
  if(t.dataset.arow!=null){C().rows[+t.dataset.arow][t.dataset.f]=t.value;saveCfg();updAvg();return}
  if(t.dataset.setin&&t.type==='range'){setP(t.dataset.setin,+t.value);document.documentElement.style.setProperty('--fs',t.value+'px');const n=t.nextElementSibling;if(n)n.textContent=t.value+'px'}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='markSel'){S_().marks=t.value;saveCfg();redraw();return}
  if(t.dataset.cn){CN[t.dataset.cn]=t.value;return}
  if(t.dataset.acon){const a=accts().find(x=>x.id===t.dataset.acon);if(a){a.on=t.checked;saveCfg();if(a.on){pollAll();syncFills(a)}else{POS.list=accts().filter(x=>x.on!==false).flatMap(x=>POS.by[x.id]||[]);drawPosLines();renderPosSoft()}}return}
  if(t.dataset.chk!=null){const all=[...document.querySelectorAll('[data-chk]')],ok=all.every(x=>x.checked),b=$('#chkDone');if(b)b.disabled=!ok;return}
  if(t.dataset.shin&&t.type==='checkbox'){SH[t.dataset.shin]=t.checked;drawShare();return}
  if(t.dataset.af==='type'){AF.type=t.value;AF.val='';renderAlerts();return}
  if(t.dataset.alon){const a=CFG.alerts.find(x=>x.id===t.dataset.alon);if(a){a.on=t.checked;if(a.on)a.last=0;saveCfg();drawAlertLines()}return}
  if(t.dataset.calc&&(t.tagName==='SELECT'||t.type==='checkbox')){const c=C();c[t.dataset.calc]=t.type==='checkbox'?t.checked:t.value;c.res=null;saveCfg();renderCalc();return}
  if(t.dataset.setin==='tzSel'){if(t.value==='device')S_().tzMode='device';else{S_().tzMode='custom';S_().tzMin=+t.value}afterSet('tzMode');return}
  if(t.dataset.setin){const ty=t.dataset.ty,v=ty==='b'?t.checked:ty==='n'?(t.value===''?0:+t.value):t.value;setP(t.dataset.setin,v);afterSet(t.dataset.setin)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();if(SEL){SEL=null;$('#tpop').classList.remove('on');redraw()}}
  if(e.key===' '&&RP.on&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();RP.timer?replayPause():replayPlay()}
  if(e.key==='ArrowRight'&&RP.on&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))replayStep(1);
  if(e.key==='Enter'&&e.target.id==='symQ2'){const b=document.querySelector('#symList [data-sym]');b&&b.click()}});
document.addEventListener('visibilitychange',async()=>{if(document.hidden)return;reloadJ();if(!bnWS.st.ok||!hlWS.st.ok)reconnect();if(accts().length){pollAll();posLoop()}});
/* 백업 안내 (하루 한 번) */
function backupNudge(){if(!J||!(J.trades||[]).length)return;const lb=(J.settings&&J.settings.lastBackup)||0,days=Math.floor((Date.now()-lb)/864e5);
  if(lb&&days<7)return;const today=dayKeyTz(Date.now());if(CFG.nudgeDay===today)return;CFG.nudgeDay=today;saveCfg();
  setTimeout(()=>toast(lb?L(`기록을 백업한 지 ${days}일 지났어요. Fillog 대시보드에서 백업할 수 있어요.`,`It’s been ${days} days since your last backup. Back up from the Fillog dashboard.`):L('아직 기록을 백업하지 않았어요. Fillog 대시보드에서 백업할 수 있어요.','You haven’t backed up yet. Back up from the Fillog dashboard.')),4000)}

/* ---------- 시작 ---------- */
(async()=>{
  await DB.open();
  const [s,c,h,v1]=await Promise.all([DB.get('state'),DB.get('fillview'),DB.get('hl'),DB.get('term')]);
  if(s&&s.trades)J=s;
  if(c)CFG=mergeCfg(c);
  else{CFG=mergeCfg(null);if(v1){CFG.hlAddr=v1.hlAddr||'';CFG.events=(v1.events||[]).map(e=>({id:e.id,title:e.title,ms:e.ms}));
    if(Array.isArray(v1.watch)&&v1.watch.length)CFG.fav=v1.watch.map(x=>'BN:'+x);if(v1.sym)CFG.sym='BN:'+v1.sym}CFG.tf=S_().defTf}
  if(!TF[CFG.tf])CFG.tf='1h';
  CFG.panel=!!S_().panelDefault&&!isMobile();CFG.view='chart';
  if(S_().tzMode==='fillog'){S_().tzMode='custom';S_().tzMin=(J&&J.settings&&J.settings.tzMin!=null)?J.settings.tzMin:-new Date().getTimezoneOffset()}
  if(!Array.isArray(CFG.recent))CFG.recent=[];if(!CFG.recent.length)CFG.recent=[CFG.sym];if(CFG.wlOpen.recent===undefined)CFG.wlOpen.recent=true;
  CFG.calc={...JSON.parse(JSON.stringify(CALC0)),...(CFG.calc||{})};if(!Array.isArray(CFG.calc.rows)||!CFG.calc.rows.length)CFG.calc.rows=[{p:'',q:''}];
  LANG=resolveLang();
  initChart();applyTheme();renderAll();
  const ok=await loadMarkets();
  if(ok&&!tick(CFG.sym))CFG.sym='BN:BTCUSDT';
  CFG.fav=CFG.fav.filter(k=>tick(k)||!ok);
  renderAll();reconnect();
  if(chart)await reloadChart();drawAlertLines();
  backupNudge();
  loadDeriv();loadRange();bookLoop();
  posStart();
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
